    <style>
        .background-dark {

            position: fixed;

        }

            margin: 0 10px;
            cursor: pointer;
        }


        .labels-container {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 30px;
        }

        .label {
            display: flex;
            justify-content: space-between;

            color: white;

        }

        }

        #result1, #result2, #result3, #result4, #result5, #result6, #result7, #result8, #result9, #result10 {

            text-align: right;
            font-size: 25px;
        }

        ::placeholder {
            color: 	#A9A9A9;
            font-style: italic;
        }

        /* Menü */
        .menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100%;
            background-color: #5b5b5b;
            z-index: 2;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .menu a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: white;
            display: block;
            transition: 0.3s;
        }

        .menu a:hover {
            color: white;
        }

        .menu .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
            color: white;
        }

        #profileList {
            margin-top: 12px;
            position: relative;
        }

        .profile-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #5b5b5b;
            margin-bottom: 5px;
        }

        .profile-item.dragging {
            opacity: 0.6;
        }

        .profile-drop-indicator {
            height: 0;
            border-top: 2px solid #f1f1f1;
            margin: 4px 8px;
            pointer-events: none;
        }

        /* Overlay styles */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 200px; /* Starts right next to the sidebar */
            width: calc(100% - 200px); /* Covers the area to the right of the sidebar */
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Halbtransparent */
            z-index: 1; /* Set lower than the sidebar */
        }

        #main {
            transition: margin-left .5s;
            padding: 16px;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

    <script>
        // Profile speichern
        function saveProfilesToLocalStorage() {
            localStorage.setItem('profiles', JSON.stringify(profiles));
        }

        // Profile laden
        function loadProfilesFromLocalStorage() {
            profiles.splice(0, profiles.length);
            console.log('Profile:' ,profiles);
            const savedProfiles = localStorage.getItem('profiles');
            console.log('Saved Profiles:', savedProfiles);
            if (savedProfiles) {
                try {
                    JSON.parse(savedProfiles).forEach(profile => {
                        if (!profile || typeof profile.name !== 'string' || !profile.name.trim()) {
                            return;
                        }

                        ensureProfileShape(profile);

                        if (!profiles.some(p => p.name === profile.name)) {
                            profiles.push(profile);
                        }
                    });
                } catch (error) {
                    console.error('Profile konnten nicht aus dem localStorage geladen werden:', error);
                    localStorage.removeItem('profiles');
                }
            }
            console.log('Loaded profiles:', profiles);
        }

        function normalizePerformanceInput(inputValue) {
            return (inputValue || '').trim().replace(',', '.');
        }

        function parsePerformanceValue(inputValue, disciplineType) {
            const normalizedValue = normalizePerformanceInput(inputValue);

            if (!normalizedValue) {
                return null;
            }

            if (disciplineType === 4) {
                const timeMatch = normalizedValue.match(/^(\d+):([0-5]?\d(?:\.\d+)?)$/);
                if (!timeMatch) {
                    return null;
                }

                const minutes = parseInt(timeMatch[1], 10);
                const seconds = parseFloat(timeMatch[2]);
                const totalSeconds = minutes * 60 + seconds;

                return Number.isFinite(totalSeconds) ? totalSeconds : null;
            }

            const numericValue = parseFloat(normalizedValue);
            if (!Number.isFinite(numericValue) || numericValue < 0) {
                return null;
            }

            if (disciplineType === 2) {
                return numericValue * 100;
            }

            return numericValue;
        }

        function calculateDecathlonPoints(disciplineType, performance, A, B, C) {
            if (!Number.isFinite(performance)) {
                return 0;
            }

            let baseValue = 0;

            if (disciplineType === 1 || disciplineType === 4) {
                baseValue = B - performance;
            } else {
                baseValue = performance - B;
            }

            if (baseValue <= 0) {
                return 0;
            }

            const points = A * Math.pow(baseValue, C);
            if (!Number.isFinite(points) || points < 0) {
                return 0;
            }

            return Math.floor(points);
        }

        function getComparisonAthletes(profileName) {
            if (typeof profileName !== 'string') {
                return [];
            }

            return profileName.includes(' vs. ') ? profileName.split(' vs. ') : [];
        }

        function getResultIndexForInput(profileName, inputName, resultId) {
            const resultIndexBase = parseInt(resultId.replace('result', ''), 10) - 1;
            const comparisonAthletes = getComparisonAthletes(profileName);

            if (comparisonAthletes.length !== 2) {
                return resultIndexBase;
            }

            const athleteName = inputName.includes('_') ? inputName.substring(inputName.indexOf('_') + 1) : '';
            return athleteName === comparisonAthletes[1] ? resultIndexBase + 10 : resultIndexBase;
        }

        function ensureProfileShape(profile) {
            const expectedLength = profile.type === 'comparison' ? 20 : 10;

            if (!Array.isArray(profile.results)) {
                profile.results = [];
            }
            if (!Array.isArray(profile.values)) {
                profile.values = [];
            }

            while (profile.results.length < expectedLength) {
                profile.results.push('0');
            }
            while (profile.values.length < expectedLength) {
                profile.values.push('');
            }

            profile.results = profile.results.slice(0, expectedLength).map(result => result === '' ? '0' : String(result));
            profile.values = profile.values.slice(0, expectedLength).map(value => value == null ? '' : String(value));

            if (profile.type === 'comparison') {
                const [athlete1, athlete2] = getComparisonAthletes(profile.name);
                if (!profile.totalPoints || typeof profile.totalPoints !== 'object') {
                    profile.totalPoints = {};
                }
                if (athlete1 && typeof profile.totalPoints[athlete1] !== 'number') {
                    profile.totalPoints[athlete1] = 0;
                }
                if (athlete2 && typeof profile.totalPoints[athlete2] !== 'number') {
                    profile.totalPoints[athlete2] = 0;
                }
            } else if (typeof profile.totalPoints !== 'number') {
                profile.totalPoints = 0;
            }
        }

        function sanitizeProfileName(profileName) {
            if (typeof profileName !== 'string') {
                return '';
            }

            return profileName.trim().replace(/\s+/g, ' ');
        }

        function toggleNav() {
            var sidebar = document.getElementById("mySidebar");
            var mainContent = document.getElementById("main");

            // Überprüfen, ob die Sidebar derzeit geöffnet ist
            if (sidebar.style.width === "200px") {
                // Sidebar schließen
                closeNav();
            } else {
                // Sidebar öffnen
                openNav();
            }
        }

        function openNav() {
            var sidebar = document.getElementById("mySidebar");
            sidebar.style.display = "block";
            sidebar.style.width = "200px";
            document.getElementById("main").style.marginLeft = "200px";
            // Overlay nach 0.5s sichtbar machen
            setTimeout(function() {
                var overlay = document.getElementById('overlay');
                if (overlay) {
                    overlay.style.display = 'block';
                }
            }, 500);
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("main").style.marginLeft = "0";
            document.getElementById("overlay").style.display = "none"; // Hide overlay
            // Öffnen Standardprofil nach Löschung
            if (profileDeleted) {
                handleProfileButtonClick(defaultTitle);
                profileDeleted = false;
            }
        }
        
        function calculatePoints(inputName, resultId, disciplineType, A, B, C) {
            var inputElement = document.getElementsByName(inputName)[0];
            var resultElement = document.getElementById(resultId);
            if (!inputElement || !resultElement) {
                return;
            }

            var inputValue = inputElement.value;
            var profileName = document.querySelector('.center').textContent;

            const profileIndex = getProfileIndex(profileName);
            if (profileIndex === -1) {
                return;
            }

            const normalizedValue = normalizePerformanceInput(inputValue);
            const resultIndex = getResultIndexForInput(profileName, inputName, resultId);

            if (normalizedValue === "") {
                resultElement.textContent = "0";
                profiles[profileIndex].results[resultIndex] = "0";
                profiles[profileIndex].values[resultIndex] = ""; // Wert im Profil ebenfalls auf leer setzen
            } else {
                const performance = parsePerformanceValue(normalizedValue, disciplineType);
                const points = calculateDecathlonPoints(disciplineType, performance, A, B, C);

                resultElement.textContent = String(points);
                profiles[profileIndex].results[resultIndex] = String(points);
                profiles[profileIndex].values[resultIndex] = normalizedValue;
            }
            saveProfilesToLocalStorage();

            // Aktualisieren der Gesamtpunktzahl für das Vergleichsprofil
            if (profileName.includes(" vs. ")) {
                const [athlete1, athlete2] = profileName.split(" vs. ");
                
                if (inputName.includes(athlete1)) {
                    calculateTotalPoints(profileName, athlete1);
                } else if (inputName.includes(athlete2)) {
                    calculateTotalPoints(profileName, athlete2);
                }
            } else {
                // Standardverhalten für nicht-Vergleichsprofile
                calculateTotalPoints(profileName);
            }
        }


        function calculateTotalPoints(profileName, athlete = null) {
            const profile = profiles.find(p => p.name === profileName);

            if (profile) {
                ensureProfileShape(profile);
                if (athlete) {
                    const athleteIndex = profileName.split(" vs. ").indexOf(athlete);
                    if (athleteIndex === -1) {
                        return;
                    }
                    const startIndex = athleteIndex * 10;
                    const resultValues = profile.results.slice(startIndex, startIndex + 10).filter(result => result !== "" && !isNaN(result) && result !== null && result !== undefined);
                    const totalPoints = resultValues.reduce((total, result) => total + parseInt(result), 0);
                    profile.totalPoints[athlete] = totalPoints;

                    const totalElement = document.getElementById(`totalPoints_${athlete}`);
                    if (totalElement) {
                        totalElement.innerHTML = totalPoints;
                    }
                } else {
                    const resultValues = profile.results.filter(result => result !== "" && !isNaN(result) && result !== null && result !== undefined);
                    const totalPoints = resultValues.reduce((total, result) => total + parseInt(result), 0);
                    profile.totalPoints = totalPoints;

                    const totalElement = document.getElementById('total');
                    if (totalElement) {
                        totalElement.innerHTML = totalPoints;
                    }
                }

            }
        }

        function bindEnterKeyToOk(modal, okButton) {
            modal.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    okButton.click();
                }
            });
        }

        // Function new_profile
        function openProfileWindow() {
            // Create a modal window
            var modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.zIndex = '1';
            modal.style.left = '0';
            modal.style.top = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.backgroundColor = 'rgba(0,0,0,0.4)';
            modal.style.display = 'flex';
            modal.style.justifyContent = 'center';
            modal.style.alignItems = 'center';

            // Create the inner content
            var content = document.createElement('div');
            content.style.backgroundColor = '#a0a0a0';
            content.style.padding = '20px';
            content.style.border = '1px solid #ddd';
            content.style.width = '50%';
            content.style.borderRadius = '5px';
            content.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.1)';

            // Close button
            var closeButton = document.createElement('span');
            closeButton.textContent = 'x';
            closeButton.style.float = 'right';
            closeButton.style.cursor = 'pointer';
            closeButton.style.fontWeight = 'bold';
            closeButton.style.color = 'white';
            closeButton.style.fontSize = '20px';
            closeButton.style.marginBottom = '20px';
            closeButton.onclick = function() {
                document.body.removeChild(modal);
            };
            content.appendChild(closeButton);
                        
            // Input field
            var inputField = document.createElement('input');
            inputField.type = 'text';
            inputField.placeholder = 'Name des Athleten';
            inputField.style.width = '90%';
            inputField.style.padding = '10px';
            inputField.style.fontSize = '16px';
            inputField.style.marginBottom = '20px';
            inputField.style.border = '1px solid #ddd';
            inputField.style.borderRadius = '4px';
            content.appendChild(inputField);

            // OK button
            var okButton = document.createElement('button');
            okButton.textContent = 'OK';
            okButton.style.backgroundColor = '#4CAF50';
            okButton.style.color = 'white';
            okButton.style.padding = '10px 20px';
            okButton.style.border = 'none';
            okButton.style.borderRadius = '4px';
            okButton.style.cursor = 'pointer';
            okButton.style.float = 'right';
            okButton.onclick = function() {
                var athleteName = sanitizeProfileName(inputField.value);
                if (!athleteName) {
                    alert('Bitte geben Sie einen Profilnamen ein.');
                    inputField.focus();
                    return;
                }
                if (athleteName.includes(' vs. ')) {
                    alert('Der Profilname darf "vs." nicht enthalten.');
                    inputField.focus();
                    return;
                }

                const createdProfileName = addProfileToSidebar(athleteName);
                if (!createdProfileName) {
                    inputField.focus();
                    inputField.select();
                    return;
                }
                document.body.removeChild(modal);
                handleProfileButtonClick(createdProfileName);
            };
            content.appendChild(okButton);

            modal.appendChild(content);
            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, okButton);
            setTimeout(function() {
                inputField.focus();
                inputField.select();
            }, 0);
        }

        // Funktion zum Hinzufügen neuer Profile
        function handleProfileButtonClick(profileName) {
            if (profileName !== defaultTitle) {
                closeNav();
                document.querySelector('.center').textContent = profileName;
                displayProfileResults(profileName);
                // Anzeigen der Disziplinen beim Wechseln zu einem Profil
                document.querySelector('.labels-container').style.display = 'flex';
                document.querySelector('.icon-container').style.display = 'none'; // Icons auf Profilseite ausblenden
                // Zeige die oberen Icons an, wenn ein Profil ausgewählt wird
                document.getElementById('top-icons').style.display = 'flex';
                // Aktualisieren der Gesamtpunktzahl für das Vergleichsprofil
                if (profileName.includes(" vs.")) {
                    // Zerlegen des Inputnamens, um die Athletennamen zu extrahieren
                    const [athlete1, athlete2] = profileName.split(" vs. ");
                    calculateTotalPoints(profileName, athlete1);
                    calculateTotalPoints(profileName, athlete2);
                } 
                else {
                    // Standardverhalten für nicht-Vergleichsprofile
                    calculateTotalPoints(profileName);
                }
                profileDeleted = false;
            } else {
                navigateToHome();
            }
        }

        // Beispielprofil-Daten
        const profiles = [];
        let draggedProfileName = null;
        let dropIndicator = null;

        function getProfileIndex(profileName) {
            return profiles.findIndex(p => p.name === profileName);
        }

        function getInputName(index) {
            return [
                '100m', 'Weit', 'Kugel', 'Hoch', '400m',
                '110mH', 'Diskus', 'Stab', 'Speer', '1500m'
            ][index - 1];
        }

        function displayProfileResults(profileName) {
            const profile = profiles.find(p => p.name === profileName);
            if (!profile) return;
            ensureProfileShape(profile);

            // Leeren der vorhandenen Labels
            const labelsContainer = document.querySelector('.labels-container');
            labelsContainer.innerHTML = '';

            if (profile.type === 'single') {
                // Funktion zum Anzeigen von Einzelprofilen
                displaySingleProfile(profile);
            } else if (profile.type === 'comparison') {
                // Funktion zum Anzeigen von Vergleichsprofilen
                displayComparisonProfile(profile);
            }
        }

        function getProfileItems(includeDragging = true) {
            const profileList = getProfileListElement();
            const allItems = Array.from(profileList.querySelectorAll('.profile-item'));
            if (includeDragging) return allItems;
            return allItems.filter(item => !item.classList.contains('dragging'));
        }

        function findProfileItemByName(profileName) {
            return getProfileItems(true).find(item => item.dataset.profileName === profileName) || null;
        }

        function ensureDropIndicator() {
            if (!dropIndicator) {
                dropIndicator = document.createElement('div');
                dropIndicator.className = 'profile-drop-indicator';
            }
            return dropIndicator;
        }

        function removeDropIndicator() {
            if (dropIndicator && dropIndicator.parentNode) {
                dropIndicator.parentNode.removeChild(dropIndicator);
            }
        }

        function getDropIndexByY(clientY) {
            const items = getProfileItems(false);
            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();
                if (clientY < rect.top + (rect.height / 2)) {
                    return i;
                }
            }
            return items.length;
        }

        function placeDropIndicator(dropIndex) {
            const profileList = getProfileListElement();
            const indicator = ensureDropIndicator();
            const items = getProfileItems(false);
            const targetItem = items[dropIndex];

            removeDropIndicator();

            if (targetItem) {
                profileList.insertBefore(indicator, targetItem);
            } else {
                profileList.appendChild(indicator);
            }
        }

        function reorderProfilesBySidebarOrder() {
            const orderedNames = getProfileItems(true).map(item => item.dataset.profileName);
            const profileMap = new Map(profiles.map(profile => [profile.name, profile]));
            const reorderedProfiles = [];

            orderedNames.forEach(name => {
                if (profileMap.has(name)) {
                    reorderedProfiles.push(profileMap.get(name));
                    profileMap.delete(name);
                }
            });

            profiles.splice(0, profiles.length, ...reorderedProfiles, ...Array.from(profileMap.values()));
            saveProfilesToLocalStorage();
        }

        function initializeSidebarDragAndDrop() {
            const profileList = getProfileListElement();
            if (profileList.dataset.dndInitialized === 'true') return;

            profileList.addEventListener('dragover', function(event) {
                event.preventDefault();
                if (!draggedProfileName) return;
                placeDropIndicator(getDropIndexByY(event.clientY));
            });

            profileList.addEventListener('drop', function(event) {
                event.preventDefault();
                if (!draggedProfileName) return;

                const draggedItem = findProfileItemByName(draggedProfileName);
                if (!draggedItem) {
                    removeDropIndicator();
                    draggedProfileName = null;
                    return;
                }

                const dropIndex = getDropIndexByY(event.clientY);
                const itemsWithoutDragged = getProfileItems(false).filter(item => item.dataset.profileName !== draggedProfileName);
                const referenceItem = itemsWithoutDragged[dropIndex];

                if (referenceItem) {
                    profileList.insertBefore(draggedItem, referenceItem);
                } else {
                    profileList.appendChild(draggedItem);
                }

                draggedItem.classList.remove('dragging');
                removeDropIndicator();
                draggedProfileName = null;
                reorderProfilesBySidebarOrder();
            });

            profileList.addEventListener('dragleave', function(event) {
                if (!profileList.contains(event.relatedTarget)) {
                    removeDropIndicator();
                }
            });

            profileList.dataset.dndInitialized = 'true';
        }

                // Hinzufügen des Containers zur Sidebar

            // Prüfen ob Profil bereits in `profiles` existiert
            if (!existingProfile) {
                let resultsArray = Array(10).fill('');

                // Wenn es sich um ein Vergleichsprofil handelt, erweitern Sie die Arrays
                if (type === 'comparison') {

                profiles.push({ name: profileName, results: resultsArray, values: valuesArray, type: type });

                ensureProfileShape(existingProfile);
            }

            return profileName;

        function createAthleteComparisonProfile(athlete1, athlete2) {
            athlete1 = sanitizeProfileName(athlete1);
            athlete2 = sanitizeProfileName(athlete2);

            if (!athlete1 || !athlete2) {
                alert('Bitte wählen Sie zwei Athleten aus.');
                return;
            }

            if (athlete1 === athlete2) {
                alert('Bitte wählen Sie zwei unterschiedliche Athleten aus.');
                return;
            }

            const profileName = `${athlete1} vs. ${athlete2}`;

            // Erstellen Sie ein neues Profil für den Vergleich
            addProfileToSidebar(profileName, 'comparison');
            // Abrufen der einzelnen Athletenprofile
            const athlete1Profile = profiles.find(p => p.name === athlete1);
            const athlete2Profile = profiles.find(p => p.name === athlete2);
            if (!athlete1Profile || !athlete2Profile) {
                alert('Mindestens eines der ausgewählten Profile existiert nicht mehr.');
                return;
            }

            // Abrufen des neu erstellten Vergleichsprofils
            const comparisonProfile = profiles.find(p => p.name === profileName);
            if (!comparisonProfile) {
                return;
            }

            // Initialisieren der Arrays für Werte und Ergebnisse
            comparisonProfile.values = new Array(20).fill('');
            comparisonProfile.results = new Array(20).fill('0');

            comparisonProfile.totalPoints = {};
            comparisonProfile.totalPoints[athlete1] = 0;
            comparisonProfile.totalPoints[athlete2] = 0;

            // Befüllen der Arrays
            for (let i = 0; i < 10; i++) {
                comparisonProfile.values[i] = athlete1Profile.values[i] || '';
                comparisonProfile.values[i + 10] = athlete2Profile.values[i] || '';

                comparisonProfile.results[i] = athlete1Profile.results[i] || '0';
                comparisonProfile.results[i + 10] = athlete2Profile.results[i] || '0';
            }

            saveProfilesToLocalStorage();
            // Ändern Sie die Überschrift entsprechend
            document.querySelector('.center').textContent = profileName;

            displayComparisonProfile(comparisonProfile);
            calculateTotalPoints(profileName, athlete1);
            calculateTotalPoints(profileName, athlete2);
        }

        function deleteProfile(profileName) {
            // Name des zurzeit angezeigten Profils
            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);

            // Entfernen Sie das Profil aus der internen Profil-Liste
            const profileList = getProfileListElement();
            const profilesToDelete = profiles
                .filter(profile => profile.name === profileName || getComparisonAthletes(profile.name).includes(profileName))
                .map(profile => profile.name);

            profilesToDelete.forEach(name => {
                const index = profiles.findIndex(profile => profile.name === name);
                if (index !== -1) {
                    profiles.splice(index, 1);
                }

                const profileItem = findProfileItemByName(name);
                if (profileItem) {
                    profileList.removeChild(profileItem);
                }
            });

            saveProfilesToLocalStorage();

            if (currentTitle === profileName || currentComparisonAthletes.includes(profileName)) {
                navigateToHome();
            }
        }

        let initialX = null;
        let initialY = null;

        document.body.addEventListener('touchstart', function (e) {
            initialX = e.touches[0].clientX;
            initialY = e.touches[0].clientY;
        });

        document.body.addEventListener('touchmove', function (e) {
            if (initialX === null || initialY === null) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let diffX = currentX - initialX;
            let diffY = currentY - initialY;

            // Prüfen, ob die horizontale Bewegung größer ist als die vertikale
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    openNav(); // Öffnen der Sidebar durch Swipen nach rechts
                } else {
                    closeNav(); // Schließen der Sidebar durch Swipen nach links
                }
            }

            // Zurücksetzen der initialen Werte
            initialX = null;
            initialY = null;
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
            console.log('Service Worker registriert mit Scope: ', registration.scope);
            }, function(err) {
            console.log('Service Worker Registrierung fehlgeschlagen: ', err);
            });
        });
        }
    </script>
</body>
