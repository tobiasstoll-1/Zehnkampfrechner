                    existingRanking.selectedProfiles = selectedProfiles;
                    updateRankingSidebarName(previousName, rankingName);
                } else {
                    rankings.push({
                        name: rankingName,
                        selectedProfiles: selectedProfiles,
                        type: 'active',
                        archiveFolder: '',
                        createdAt: new Date().toISOString()
                    });
                    addRankingToSidebar(rankingName);
                }

                saveRankingsToLocalStorage();
                closeModal(modal);
                openRankingResults(rankingName);
            };
            content.appendChild(confirmButton);
            document.body.appendChild(modal);
            rankingNameInput.focus();
            bindEnterKeyToOk(modal, confirmButton);
            updateSelectAllState();
            selectAllCheckbox.checked = true;
        }

        function openAthleteComparison(athlete1, athlete2) {
            var modalParts = createUnifiedModal(
                'Vergleichsprofil erstellen',
                'min(92vw, 520px)'
            );
            var modal = modalParts.modal;
            var content = modalParts.content;

            var dropdown1 = createAthleteDropdown('athlete1');
            var dropdown2 = createAthleteDropdown('athlete2');

            var firstAthleteSection = createModalSection();
            firstAthleteSection.appendChild(dropdown1);
            content.appendChild(firstAthleteSection);

            var secondAthleteSection = createModalSection();
            secondAthleteSection.appendChild(dropdown2);
            content.appendChild(secondAthleteSection);

            var okButton = createPrimaryButton('Vergleich erstellen');
            okButton.onclick = function () {
                var selectedAthlete1 = dropdown1.value;
                var selectedAthlete2 = dropdown2.value;
                closeModal(modal);
                createAthleteComparisonProfile(selectedAthlete1, selectedAthlete2);
            };
            content.appendChild(okButton);

            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, okButton);
        }

        function getDisciplineType(index) {
            if (index === 1 || index === 5 || index === 6) {
                return 1; // Laufdisziplin
            } else if (index === 2 || index === 4 || index === 8) {
                return 2; // Sprungdisziplin
            } else if (index === 3 || index === 7 || index === 9) {
                return 3; // Wurfdisziplin
            }
            else {
                return 4; // 1500m
            }
        }

        function getABCValues(index, athlete) {
            if (index === 1) {
                return [25.43471, 18, 1.81];
            }
            else if (index === 2) {
                return [0.14354,220,1.4];
            }
            else if (index === 3) {
                return [51.39,1.5,1.05];
            }
            else if (index === 4) {
                return [0.8465,75,1.42];
            }
            else if (index === 5) {
                return [1.53775,82,1.81];
            }
            else if (index === 6) {
                return [5.74352,28.5,1.92];
            }
            else if (index === 7) {
                return [12.91,4,1.10];
            }
            else if (index === 8) {
                return [0.2797,100,1.35];
            }
            else if (index === 9) {
                return [10.14,7,1.08];
            }
            else if (index === 10) {
                return [0.03768,480,1.85];
            }
        }

        function getDefaultPlaceholder(index) {
            const placeholders = [
                '11.05', '7.25', '14.75', '2.03', '48.25',
                '14.25', '47.50', '5.05', '55.25', '4:45.25'
            ];

            return placeholders[index - 1];
        }

        function createAthleteComparisonProfile(athlete1, athlete2) {
            athlete1 = sanitizeProfileName(athlete1);
            athlete2 = sanitizeProfileName(athlete2);

            if (!athlete1 || !athlete2) {
                alert('Bitte wählen Sie zwei Athleten aus.');
                return;
            }

            if (athlete1 === athlete2) {
                alert('Bitte wählen Sie zwei unterschiedliche Athleten aus.');
                return;
            }

            const profileName = `${athlete1} vs. ${athlete2}`;

            // Erstellen Sie ein neues Profil für den Vergleich
            addProfileToSidebar(profileName, 'comparison');
            // Abrufen der einzelnen Athletenprofile
            const athlete1Profile = profiles.find(p => p.name === athlete1);
            const athlete2Profile = profiles.find(p => p.name === athlete2);
            if (!athlete1Profile || !athlete2Profile) {
                alert('Mindestens eines der ausgewählten Profile existiert nicht mehr.');
                return;
            }

            // Abrufen des neu erstellten Vergleichsprofils
            const comparisonProfile = profiles.find(p => p.name === profileName);
            if (!comparisonProfile) {
                return;
            }

            // Initialisieren der Arrays für Werte und Ergebnisse
            comparisonProfile.values = new Array(20).fill('');
            comparisonProfile.results = new Array(20).fill('0');

            comparisonProfile.totalPoints = {};
            comparisonProfile.totalPoints[athlete1] = 0;
            comparisonProfile.totalPoints[athlete2] = 0;

            // Befüllen der Arrays
            for (let i = 0; i < 10; i++) {
                comparisonProfile.values[i] = athlete1Profile.values[i] || '';
                comparisonProfile.values[i + 10] = athlete2Profile.values[i] || '';

                comparisonProfile.results[i] = athlete1Profile.results[i] || '0';
                comparisonProfile.results[i + 10] = athlete2Profile.results[i] || '0';
            }

            saveProfilesToLocalStorage();
            handleProfileButtonClick(profileName);
        }
        
        function createAthleteDropdown(id) {
            var dropdown = document.getElementById(id);

            // Wenn das Dropdown-Menü bereits existiert, leere es, sonst erstelle ein neues
            if (dropdown) {
                dropdown.innerHTML = ''; // Dropdown leeren
            }
            
            else {
                dropdown = document.createElement('select');
                dropdown.id = id;
                styleModalField(dropdown);
                dropdown.style.appearance = 'none';
                dropdown.style.backgroundImage = 'linear-gradient(45deg, transparent 50%, #5b6a78 50%), linear-gradient(135deg, #5b6a78 50%, transparent 50%)';
                dropdown.style.backgroundPosition = 'calc(100% - 22px) calc(50% - 3px), calc(100% - 16px) calc(50% - 3px)';
                dropdown.style.backgroundSize = '6px 6px, 6px 6px';
                dropdown.style.backgroundRepeat = 'no-repeat';
                dropdown.style.paddingRight = '42px';
            }
            
            // Füge die erstellten Profile als Optionen hinzu (Vergleichsprofile ausgeschlossen)
            getActiveSingleProfiles().forEach(function (profile) {
                // Überprüfe, ob der Profilname bereits im Dropdown existiert
                var alreadyExists = Array.from(dropdown.options).some(option => option.value === profile.name);

                // Nur hinzufügen, wenn das Profil noch nicht im Dropdown ist
                if (!alreadyExists) {
                    var option = document.createElement('option');
                    option.value = profile.name;
                    option.text = profile.name;
                    dropdown.add(option);
                }
            });

            return dropdown;
        }

        function renameSingleProfile(oldName, newName) {
            const sanitizedNewName = sanitizeProfileName(newName);
            if (!sanitizedNewName) {
                alert('Bitte geben Sie einen Profilnamen ein.');
                return false;
            }

            if (sanitizedNewName.includes(' vs. ')) {
                alert('Der Profilname darf "vs." nicht enthalten.');
                return false;
            }

            if (isReservedProfileName(sanitizedNewName, oldName)) {
                alert('Ein Profil oder Ranking mit diesem Namen existiert bereits.');
                return false;
            }

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentRanking = getRankingByName(currentTitle);
            const profile = profiles.find(function(existingProfile) {
                return existingProfile.name === oldName && existingProfile.type === 'single';
            });

            if (!profile) {
                return false;
            }

            profile.name = sanitizedNewName;
            updateProfileSidebarName(oldName, sanitizedNewName);

            profiles
                .filter(function(existingProfile) {
                    return existingProfile.type === 'comparison' && getComparisonAthletes(existingProfile.name).includes(oldName);
                })
                .forEach(function(comparisonProfile) {
                    const athletes = getComparisonAthletes(comparisonProfile.name).map(function(athleteName) {
                        return athleteName === oldName ? sanitizedNewName : athleteName;
                    });
                    const updatedComparisonName = athletes.join(' vs. ');
                    const previousComparisonName = comparisonProfile.name;
                    comparisonProfile.name = updatedComparisonName;
                    updateProfileSidebarName(previousComparisonName, updatedComparisonName);
                });

            rankings.forEach(function(ranking) {
                ranking.selectedProfiles = (ranking.selectedProfiles || []).map(function(profileName) {
                    return profileName === oldName ? sanitizedNewName : profileName;
                });
            });

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            updateSidebarEmptyStates();

            if (currentTitle === oldName) {
                handleProfileButtonClick(sanitizedNewName);
            } else {
                const currentComparisonAthletes = getComparisonAthletes(currentTitle);
                if (currentComparisonAthletes.includes(oldName)) {
                    const updatedComparisonName = currentComparisonAthletes
                        .map(function(athleteName) {
                            return athleteName === oldName ? sanitizedNewName : athleteName;
                        })
                        .join(' vs. ');
                    handleProfileButtonClick(updatedComparisonName);
                } else if (currentRanking) {
                    openRankingResults(currentRanking.name);
                }
            }

            return true;
        }

        function openProfileRenameWindow(profileName) {
            const profile = profiles.find(function(existingProfile) {
                return existingProfile.name === profileName && existingProfile.type === 'single';
            });

            if (!profile) {
                return;
            }

            closeNav();

            var modalParts = createUnifiedModal(
                'Profil bearbeiten',
                'min(92vw, 520px)'
            );
            var modal = modalParts.modal;
            var content = modalParts.content;

            var inputSection = createModalSection();
            var inputField = document.createElement('input');
            inputField.type = 'text';
            inputField.placeholder = 'Name des Athleten';
            inputField.value = profile.name;
            styleModalField(inputField);
            inputSection.appendChild(inputField);
            content.appendChild(inputSection);

            const worldAthleticsLinkEditor = createWorldAthleticsLinkEditor({
                profile: profile,
                initialLink: profile.worldAthletics,
                getSearchSeed: function() {
                    return inputField.value;
                }
            });
            content.appendChild(worldAthleticsLinkEditor.element);

            var okButton = createPrimaryButton('Speichern');
            okButton.onclick = function() {
                const previousWorldAthleticsLink = normalizeWorldAthleticsLink(profile.worldAthletics);
                const selectedWorldAthleticsLink = worldAthleticsLinkEditor.getLink();
                if (renameSingleProfile(profileName, inputField.value)) {
                    if (selectedWorldAthleticsLink) {
                        profile.worldAthletics = selectedWorldAthleticsLink;
                    } else {
                        delete profile.worldAthletics;
                    }
                    saveProfilesToLocalStorage();
                    closeModal(modal);
                    handleProfileButtonClick(profile.name);

                    const linkChanged = selectedWorldAthleticsLink
                        && (!previousWorldAthleticsLink
                            || previousWorldAthleticsLink.athleteId !== selectedWorldAthleticsLink.athleteId);
                    if (linkChanged) {
                        syncAllWorldAthleticsProfiles({
                            force: true,
                            announce: true,
                            athleteIds: [selectedWorldAthleticsLink.athleteId]
                        });
                    }
                } else {
                    inputField.focus();
                    inputField.select();
                }
            };
            content.appendChild(okButton);

            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, okButton);
            setTimeout(function() {
                inputField.focus();
                inputField.select();
            }, 0);
        }

        function confirmRankingDeletion(rankingName) {
            closeNav();

            var modalParts = createUnifiedModal(
                'Ranking löschen',
                'min(92vw, 520px)'
            );
            var modal = modalParts.modal;
            var content = modalParts.content;

            var textSection = createModalSection();
            var text = document.createElement('p');
            text.innerHTML = 'Möchten Sie das Ranking <strong>' + rankingName + '</strong> wirklich löschen?';
            text.style.margin = '0';
            text.style.fontSize = '16px';
            text.style.lineHeight = '1.5';
            text.style.color = '#243342';
            textSection.appendChild(text);
            content.appendChild(textSection);

            var buttonRow = document.createElement('div');
            buttonRow.style.display = 'flex';
            buttonRow.style.justifyContent = 'flex-end';
            buttonRow.style.gap = '12px';

            var cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.textContent = 'Abbrechen';
            cancelButton.style.padding = '12px 18px';
            cancelButton.style.border = '1px solid rgba(69, 87, 107, 0.18)';
            cancelButton.style.borderRadius = '14px';
            cancelButton.style.background = 'rgba(255, 255, 255, 0.55)';
            cancelButton.style.color = '#233242';
            cancelButton.style.cursor = 'pointer';
            cancelButton.onclick = function() {
                closeModal(modal);
            };
            buttonRow.appendChild(cancelButton);

            var deleteButton = createPrimaryButton('Löschen');
            deleteButton.style.background = 'linear-gradient(135deg, #8e4343 0%, #6d3131 100%)';
            deleteButton.style.boxShadow = '0 14px 28px rgba(109, 49, 49, 0.22)';
            deleteButton.onclick = function() {
                deleteRanking(rankingName);
                closeModal(modal);
            };
            buttonRow.appendChild(deleteButton);

            content.appendChild(buttonRow);
            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, deleteButton);
        }
        
        let profileDeleted = false;

        // Profile löschen
        function confirmProfileDeletion(profileName) {
            closeNav();
            const profile = profiles.find(existingProfile => existingProfile.name === profileName);
            const canArchive = profile && profile.type === 'single' && profile.archived !== true;

            var modalParts = createUnifiedModal(
                canArchive ? 'Profil verwalten' : 'Profil löschen',
                'min(92vw, 520px)'
            );
            var modal = modalParts.modal;
            var content = modalParts.content;

            var textSection = createModalSection();
            var text = document.createElement('p');
            text.innerHTML = canArchive
                ? 'Möchten Sie das Profil <strong>' + profileName + '</strong> archivieren oder endgültig löschen?'
                : 'Möchten Sie das Profil <strong>' + profileName + '</strong> wirklich löschen?';
            text.style.margin = '0';
            text.style.fontSize = '16px';
            text.style.lineHeight = '1.5';
            text.style.color = '#243342';
            textSection.appendChild(text);
            content.appendChild(textSection);

            var buttonRow = document.createElement('div');
            buttonRow.className = 'profile-manage-actions';
            buttonRow.style.display = 'flex';
            buttonRow.style.justifyContent = 'flex-end';
            buttonRow.style.gap = '12px';

            var cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.className = 'profile-manage-action';
            cancelButton.textContent = 'Abbrechen';
            cancelButton.style.padding = '12px 18px';
            cancelButton.style.border = '1px solid rgba(69, 87, 107, 0.18)';
            cancelButton.style.borderRadius = '14px';
            cancelButton.style.background = 'rgba(255, 255, 255, 0.55)';
            cancelButton.style.color = '#233242';
            cancelButton.style.cursor = 'pointer';
            cancelButton.onclick = function() {
                closeModal(modal);
            };
            buttonRow.appendChild(cancelButton);

            if (canArchive) {
                var archiveButton = createPrimaryButton('Archivieren');
                archiveButton.classList.add('profile-manage-action');
                archiveButton.onclick = function() {
                    closeModal(modal);
                    openArchiveProfileWindow(profileName);
                };
                buttonRow.appendChild(archiveButton);
            }

            var deleteButton = createPrimaryButton('Löschen');
            deleteButton.classList.add('profile-manage-action');
            deleteButton.style.background = 'linear-gradient(135deg, #8e4343 0%, #6d3131 100%)';
            deleteButton.style.boxShadow = '0 14px 28px rgba(109, 49, 49, 0.22)';
            deleteButton.onclick = function() {
                deleteProfile(profileName);
                closeModal(modal);
            };
            buttonRow.appendChild(deleteButton);

            content.appendChild(buttonRow);
            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, deleteButton);
        }

        function deleteProfile(profileName) {
            // Name des zurzeit angezeigten Profils
            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);
            const currentRanking = getRankingByName(currentTitle);

            const profilesToDelete = profiles
                .filter(profile => profile.name === profileName || getComparisonAthletes(profile.name).includes(profileName))
                .map(profile => profile.name);

            removeProfilesByName(profilesToDelete);

            for (let i = rankings.length - 1; i >= 0; i--) {
                rankings[i].selectedProfiles = (rankings[i].selectedProfiles || [])
                    .filter(selectedProfileName => !profilesToDelete.includes(selectedProfileName));

                if (rankings[i].selectedProfiles.length === 0) {
                    deleteRanking(rankings[i].name);
                }
            }

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            updateSidebarEmptyStates();

            if (currentTitle === profileName || currentComparisonAthletes.includes(profileName)) {
                navigateToHome();
            } else if (currentRanking) {
                const updatedRanking = getRankingByName(currentRanking.name);
                if (updatedRanking) {
                    openRankingResults(updatedRanking.name);
                } else {
                    navigateToHome();
                }
            }
        }

        let initialX = null;
        let initialY = null;

        document.body.addEventListener('touchstart', function (e) {
            const sidebarOpen = parseInt(document.getElementById('mySidebar').style.width || '0', 10) > 0;
            const startX = e.touches[0].clientX;
            const edgeSwipeZone = 24;

            if (!sidebarOpen && startX > edgeSwipeZone) {
                initialX = null;
                initialY = null;
                return;
            }

            initialX = startX;
            initialY = e.touches[0].clientY;
        });

        document.body.addEventListener('touchmove', function (e) {
            if (initialX === null || initialY === null) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let diffX = currentX - initialX;
            let diffY = currentY - initialY;

            // Prüfen, ob die horizontale Bewegung größer ist als die vertikale
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    openNav();
                } else if (parseInt(document.getElementById('mySidebar').style.width || '0', 10) > 0) {
                    closeNav();
                }
            }

            // Zurücksetzen der initialen Werte
            initialX = null;
            initialY = null;
        });
    </script>

            console.log('Service Worker registriert mit Scope: ', registration.scope);
            registration.update();

            window.addEventListener('online', function() {
                registration.update();
            });
            }, function(err) {
            console.log('Service Worker Registrierung fehlgeschlagen: ', err);
            });
        });
        }
