        function calculatePoints(inputName, resultId, disciplineType, A, B, C) {
            var inputElement = document.getElementsByName(inputName)[0];
            var resultElement = document.getElementById(resultId);
            if (!inputElement || !resultElement) {
                return;
            }

            var inputValue = inputElement.value;
            var profileName = document.querySelector('.center').textContent;

            const profileIndex = getProfileIndex(profileName);
            if (profileIndex === -1) {
                return;
            }

            const normalizedValue = normalizePerformanceInput(inputValue);
            const resultIndex = getResultIndexForInput(profileName, inputName, resultId);
            const isComparisonProfile = profileName.includes(" vs. ");
            const isSingleProfile = !isComparisonProfile;

            if (normalizedValue === "") {
                setAnimatedText(resultElement, isComparisonProfile || isSingleProfile ? "0 P" : "0");
                profiles[profileIndex].results[resultIndex] = "0";
                profiles[profileIndex].values[resultIndex] = ""; // Wert im Profil ebenfalls auf leer setzen
            } else {
                const performance = parsePerformanceValue(normalizedValue, disciplineType);
                const points = calculateDecathlonPoints(disciplineType, performance, A, B, C);

                setAnimatedText(resultElement, isComparisonProfile || isSingleProfile ? `${points} P` : String(points));
                profiles[profileIndex].results[resultIndex] = String(points);
                profiles[profileIndex].values[resultIndex] = normalizedValue;
            }
            saveProfilesToLocalStorage();

            // Aktualisieren der Gesamtpunktzahl für das Vergleichsprofil
            if (isComparisonProfile) {
                const [athlete1, athlete2] = profileName.split(" vs. ");
                
                if (inputName.includes(athlete1)) {
                    calculateTotalPoints(profileName, athlete1);
                } else if (inputName.includes(athlete2)) {
                    calculateTotalPoints(profileName, athlete2);
                }
                updateComparisonRowStates(profileName);
            } else {
                // Standardverhalten für nicht-Vergleichsprofile
                calculateTotalPoints(profileName);
            }
        }


        function calculateTotalPoints(profileName, athlete = null) {
            const profile = profiles.find(p => p.name === profileName);

            if (profile) {
                ensureProfileShape(profile);
                if (athlete) {
                    const athleteIndex = profileName.split(" vs. ").indexOf(athlete);
                    if (athleteIndex === -1) {
                        return;
                    }
                    const startIndex = athleteIndex * 10;
                    const totalPoints = getTotalPointsFromResults(profile.results.slice(startIndex, startIndex + 10));
                    profile.totalPoints[athlete] = totalPoints;

                    const totalElement = document.getElementById(`totalPoints_${athlete}`);
                    if (totalElement) {
                        setAnimatedText(totalElement, `${totalPoints} P`);
                        pulseSummaryContainer(totalElement.closest('.comparison-total-summary'));
                    }
                } else {
                    const totalPoints = getTotalPointsFromResults(profile.results);
                    profile.totalPoints = totalPoints;

                    const totalElement = document.getElementById('total');
                    if (totalElement) {
                        setAnimatedText(totalElement, `${totalPoints} P`);
                        pulseSummaryContainer(totalElement.closest('.profile-total-summary'));
                    }

                    updateSingleProfileCumulative(profileName);
                }

            }
        }

        function updateSingleProfileCumulative(profileName) {
            const profile = profiles.find(function(entry) {
                return entry.name === profileName;
            });

            if (!profile || profile.type !== 'single') {
                return;
            }

            const cumulativePoints = getCumulativePoints(profile.results.slice(0, 10));
            cumulativePoints.forEach(function(points, index) {
                const cumulativeElement = document.getElementById(`singleCumulative${index + 1}`);
                if (cumulativeElement) {
                    setAnimatedText(cumulativeElement, `${points} P`);
                }
            });
        }

        function updateComparisonRowStates(profileName) {
            const profile = profiles.find(function(entry) {
                return entry.name === profileName;
            });
            if (!profile || profile.type !== 'comparison') {
                return;
            }

            for (let i = 0; i < 10; i++) {
                const leftColumn = document.getElementById(`comparisonLeftColumn${i + 1}`);
                const rightColumn = document.getElementById(`comparisonRightColumn${i + 1}`);
                const leftPoints = parseInt(profile.results[i] || '0', 10);
                const rightPoints = parseInt(profile.results[i + 10] || '0', 10);

                if (leftColumn) {
                    leftColumn.classList.remove('is-leading');
                }
                if (rightColumn) {
                    rightColumn.classList.remove('is-leading');
                }

                if (leftPoints > rightPoints) {
                    if (leftColumn) {
                        leftColumn.classList.add('is-leading');
                    }
                } else if (rightPoints > leftPoints) {
                    if (rightColumn) {
                        rightColumn.classList.add('is-leading');
                    }
                }
            }
        }


        function getTotalPointsFromResults(results) {
            return (results || [])
                .filter(result => result !== "" && !isNaN(result) && result !== null && result !== undefined)
                .reduce((total, result) => total + parseInt(result, 10), 0);
        }

            const scrollLeft = scrollWrapper.scrollLeft;
            rankingView.classList.toggle('can-scroll-left', scrollLeft > 6);
            rankingView.classList.toggle('can-scroll-right', scrollLeft < maxScrollLeft - 6);

        function createWorldAthleticsLinkEditor(options = {}) {
            const profile = options.profile || null;

            let searchIsOpen = false;
            let searchTimer = null;
            let searchRequestVersion = 0;

            const editor = document.createElement('div');
            editor.className = 'wa-link-editor';

            function createSecondaryButton(label, onClick, extraClass = '') {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `wa-secondary-button${extraClass ? ` ${extraClass}` : ''}`;

            function createLinkIconButton(iconPath, label, onClick, extraClass = '') {

            function cancelPendingSearch() {
                if (searchTimer) {
                    window.clearTimeout(searchTimer);
                    searchTimer = null;
                }
                searchRequestVersion += 1;
            }

            function appendSearchPanel() {
                const panel = document.createElement('div');
                panel.className = 'wa-search-panel';

                const searchRow = document.createElement('div');
                searchRow.className = 'wa-search-row';

                const searchInput = document.createElement('input');
                searchInput.type = 'search';
                searchInput.placeholder = 'Athlet bei World Athletics suchen';
                searchInput.autocomplete = 'off';
                styleModalField(searchInput);

                    ? sanitizeProfileName(options.getSearchSeed())
                    : '';

                searchRow.appendChild(searchInput);
                panel.appendChild(searchRow);

                const status = document.createElement('div');
                status.className = 'wa-search-status';
                status.textContent = 'Mindestens zwei Zeichen eingeben.';
                panel.appendChild(status);

                const results = document.createElement('div');
                results.className = 'wa-search-results';
                panel.appendChild(results);

                function renderSearchResults(athletes) {
                    const identities = athletes.map(createWorldAthleticsIdentity).filter(Boolean);
                    results.innerHTML = '';
                    if (identities.length === 0) {
                        return;
                    }

                    status.textContent = `${identities.length} ${identities.length === 1 ? 'Athlet gefunden' : 'Athleten gefunden'}.`;
                    identities.forEach(function(identity) {
                        const resultButton = document.createElement('button');
                        resultButton.type = 'button';
                        resultButton.className = 'wa-search-result';
                        resultButton.textContent = formatWorldAthleticsIdentity(identity);
                        resultButton.onclick = function() {
                            const existingLink = normalizeWorldAthleticsLink(profile && profile.worldAthletics);
                            selectedLink = existingLink && existingLink.athleteId === identity.athleteId
                                ? existingLink
                                : identity;
                            searchIsOpen = false;
                            renderEditor();
                        };
                        resultButton.addEventListener('keydown', function(event) {
                            if (event.key === 'Enter' || event.key === ' ') {
                                event.stopPropagation();
                            }
                        });
                        results.appendChild(resultButton);
                    });
                }

                async function runSearch(searchTerm, requestVersion) {
                    status.textContent = 'Passende Zehnkämpfer werden geprüft ...';
                    results.innerHTML = '';
                    try {
                        const athletes = await searchWorldAthleticsDecathletes(searchTerm, 5, function(partialAthletes) {
                            if (requestVersion !== searchRequestVersion || !panel.isConnected) {
                                return;
                            }
                            renderSearchResults(partialAthletes);
                        });
                        if (requestVersion !== searchRequestVersion || !panel.isConnected) {
                            return;
                        }
                        if (athletes.length === 0) {
                            results.innerHTML = '';
                            status.textContent = 'Keine passenden Zehnkämpfer gefunden.';
                            return;
                        }
                        renderSearchResults(athletes);
                    } catch (error) {
                        if (requestVersion !== searchRequestVersion || !panel.isConnected) {
                            return;
                        }
                        console.error('World-Athletics-Suche fehlgeschlagen:', error);
                        results.innerHTML = '';
                        status.textContent = 'Die Suche ist momentan nicht erreichbar.';
                    }
                }

                function scheduleSearch(delay = 250) {
                    if (searchTimer) {
                        window.clearTimeout(searchTimer);
                        searchTimer = null;
                    }

                    const searchTerm = sanitizeProfileName(searchInput.value);
                    searchRequestVersion += 1;
                    const requestVersion = searchRequestVersion;
                    results.innerHTML = '';
                    if (searchTerm.length < 2) {
                        status.textContent = 'Mindestens zwei Zeichen eingeben.';
                        return;
                    }

                    status.textContent = 'Suche wird vorbereitet ...';
                    searchTimer = window.setTimeout(function() {
                        searchTimer = null;
                        runSearch(searchTerm, requestVersion);
                    }, delay);
                }

                searchInput.addEventListener('input', function() {
                    scheduleSearch();
                });

                searchInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        event.stopPropagation();
                        scheduleSearch(0);
                    } else if (event.key === 'ArrowDown') {
                        const firstSuggestion = results.querySelector('.wa-search-result');
                        if (firstSuggestion) {
                            event.preventDefault();
                            firstSuggestion.focus();
                        }
                    }
                });

                editor.appendChild(panel);
                window.setTimeout(function() {
                    searchInput.focus();
                    searchInput.select();
                }, 0);
            }

            function renderEditor() {
                cancelPendingSearch();
                editor.innerHTML = '';

                if (selectedLink) {
                    const summary = document.createElement('div');
                    summary.className = 'wa-link-summary';

                    const icon = document.createElement('img');
                    icon.src = 'imgs/profile_linked.png';
                    icon.alt = '';
                    icon.draggable = false;
                    summary.appendChild(icon);

                    const identity = document.createElement('span');
                    identity.textContent = formatWorldAthleticsIdentity(selectedLink);
                    summary.appendChild(identity);

                    const summaryActions = document.createElement('div');
                    summaryActions.className = 'wa-link-summary-actions';
                    summaryActions.appendChild(createLinkIconButton(
                        'imgs/edit.png',
                        'Verknüpfung ändern',
                        function() {
                            searchIsOpen = !searchIsOpen;
                            renderEditor();
                        }
                    ));
                    summaryActions.appendChild(createLinkIconButton(
                        'imgs/profile_unlink.png',
                        'Verknüpfung lösen',
                        function() {
                            selectedLink = null;
                            searchIsOpen = false;
                            renderEditor();
                        },
                        'is-danger'
                    ));
                    summary.appendChild(summaryActions);
                    editor.appendChild(summary);
                    if (searchIsOpen) {
                        appendSearchPanel();
                    }

                    const actions = document.createElement('div');
                    actions.className = 'wa-link-actions';

                    const currentProfileLink = normalizeWorldAthleticsLink(profile && profile.worldAthletics);
                    const canUseCurrentData = currentProfileLink
                        && currentProfileLink.athleteId === selectedLink.athleteId;
                    if (canUseCurrentData && Object.keys(currentProfileLink.seasonBests).length > 0) {
                        actions.appendChild(createSecondaryButton('Hochrechnung (SB)', function() {
                            fillEmptyProfileValuesFromWorldAthletics(profile, 'season');
                        }));
                    }
                    if (canUseCurrentData && Object.keys(currentProfileLink.personalBests).length > 0) {
                        actions.appendChild(createSecondaryButton('Hochrechnung (PB)', function() {
                            fillEmptyProfileValuesFromWorldAthletics(profile, 'personal');
                        }));
                    }
                    if (actions.childElementCount > 0) {
                        editor.appendChild(actions);
                    }
                } else {
                    editor.appendChild(createSecondaryButton('Mit World Athletics verknüpfen', function() {
                        searchIsOpen = !searchIsOpen;
                        renderEditor();
                    }));
                }

                if (searchIsOpen && !selectedLink) {
                    appendSearchPanel();
                }
            }

            renderEditor();
            return {
                element: editor,
                getLink: function() {
                    return normalizeWorldAthleticsLink(selectedLink);
                }
            };
        }

        function createWorldAthleticsInlineLinkPicker(inputField) {
            let selectedLink = null;
            let searchTimer = null;
            let searchRequestVersion = 0;

            const picker = document.createElement('div');
            picker.className = 'wa-inline-link-picker';

            function clearPendingSearch() {
                if (searchTimer) {
                    window.clearTimeout(searchTimer);
                    searchTimer = null;
                }
                searchRequestVersion += 1;
            }

            function renderSelectedLink() {
                picker.innerHTML = '';
                if (!selectedLink) {
                    return;
                }

                const summary = document.createElement('div');
                summary.className = 'wa-link-summary';

                const icon = document.createElement('img');
                icon.src = 'imgs/profile_linked.png';
                icon.alt = '';
                icon.draggable = false;
                summary.appendChild(icon);

                const identity = document.createElement('span');
                identity.textContent = formatWorldAthleticsIdentity(selectedLink);
                summary.appendChild(identity);

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'wa-link-remove';
                removeButton.textContent = '×';
                removeButton.setAttribute('aria-label', 'Verknüpfung entfernen');
                removeButton.onclick = function() {
                    selectedLink = null;
                    picker.innerHTML = '';
                    inputField.focus();
                    scheduleSearch();
                };
                summary.appendChild(removeButton);
                picker.appendChild(summary);
            }

            function selectLink(link) {
                clearPendingSearch();
                selectedLink = normalizeWorldAthleticsLink(link);
                renderSelectedLink();
                window.setTimeout(function() {
                    inputField.focus({ preventScroll: true });
                }, 0);
            }

            function renderSearchState(message) {
                picker.innerHTML = '';
                if (!message) {
                    return;
                }
                const state = document.createElement('div');
                state.className = 'wa-inline-search-state';
                state.textContent = message;
                picker.appendChild(state);
            }

            function renderSuggestions(identities) {
                picker.innerHTML = '';
                if (!identities.length) {
                    return;
                }

                const label = document.createElement('div');
                label.className = 'wa-inline-suggestion-label';
                label.textContent = 'Vorschläge zur Verknüpfung';
                picker.appendChild(label);

                const results = document.createElement('div');
                results.className = 'wa-search-results';
                identities.slice(0, 5).forEach(function(identity) {
                    const resultButton = document.createElement('button');
                    resultButton.type = 'button';
                    resultButton.className = 'wa-search-result';
                    resultButton.textContent = formatWorldAthleticsIdentity(identity);
                    resultButton.onclick = function() {
                        selectLink(identity);
                    };
                    resultButton.addEventListener('keydown', function(event) {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.stopPropagation();
                        }
                    });
                    results.appendChild(resultButton);
                });
                picker.appendChild(results);
            }

            async function runSearch(searchTerm, requestVersion) {
                renderSearchState('Passende Zehnkämpfer werden geprüft ...');
                try {
                    const athletes = await searchWorldAthleticsDecathletes(searchTerm, 5, function(partialAthletes) {
                        if (requestVersion !== searchRequestVersion || selectedLink || !picker.isConnected) {
                            return;
                        }
                        const partialIdentities = partialAthletes.map(createWorldAthleticsIdentity).filter(Boolean);
                        if (partialIdentities.length > 0) {
                            renderSuggestions(partialIdentities);
                        }
                    });
                    if (requestVersion !== searchRequestVersion || selectedLink || !picker.isConnected) {
                        return;
                    }
                    const identities = athletes.map(createWorldAthleticsIdentity).filter(Boolean);
                    if (identities.length === 0) {
                        renderSearchState('Keine passenden Zehnkämpfer gefunden.');
                        return;
                    }
                    renderSuggestions(identities);
                } catch (error) {
                    if (requestVersion !== searchRequestVersion || selectedLink || !picker.isConnected) {
                        return;
                    }
                    console.error('Automatische World-Athletics-Suche fehlgeschlagen:', error);
                    renderSearchState('Verknüpfungsvorschläge sind momentan nicht erreichbar.');
                }
            }

            function scheduleSearch() {
                if (selectedLink) {
                    renderSelectedLink();
                    return;
                }

                if (searchTimer) {
                    window.clearTimeout(searchTimer);
                }
                const searchTerm = sanitizeProfileName(inputField.value);
                searchRequestVersion += 1;
                const requestVersion = searchRequestVersion;
                if (searchTerm.length < 2) {
                    picker.innerHTML = '';
                    searchTimer = null;
                    return;
                }

                searchTimer = window.setTimeout(function() {
                    searchTimer = null;
                    runSearch(searchTerm, requestVersion);
                }, 250);
            }

            inputField.addEventListener('input', scheduleSearch);
            inputField.addEventListener('keydown', function(event) {
                if (event.key === 'ArrowDown') {
                    const firstSuggestion = picker.querySelector('.wa-search-result');
                    if (firstSuggestion) {
                        event.preventDefault();
                        firstSuggestion.focus();
                    }
                }
            });

            return {
                element: picker,
                getLink: function() {
                    return normalizeWorldAthleticsLink(selectedLink);
                },
                destroy: clearPendingSearch
            };
        }

        // Beispielprofil-Daten
        const profiles = [];
        const rankings = [];
        const archiveFolderOrder = [];
        let draggedProfileName = null;
        let draggedArchiveFolderName = null;
        let draggedArchiveProfileName = null;
        let dropIndicator = null;
        let sidebarMode = 'main';
        let activeArchiveFolder = '';

        function saveRankingsToLocalStorage() {
            localStorage.setItem('rankings', JSON.stringify(rankings));
        }

        function loadRankingsFromLocalStorage() {
            rankings.splice(0, rankings.length);
            const savedRankings = localStorage.getItem('rankings');

            if (!savedRankings) {
                return;
            }

            try {
                JSON.parse(savedRankings).forEach(ranking => {
                    if (!ranking || typeof ranking.name !== 'string') {
                        return;
                    }

                    const sanitizedName = sanitizeProfileName(ranking.name);
                    if (!sanitizedName) {
                        return;
                    }

                    const selectedProfiles = Array.isArray(ranking.selectedProfiles)
                        ? ranking.selectedProfiles
                            .map(profileName => sanitizeProfileName(profileName))
                            .filter(profileName => !!profileName)
                        : [];

                    rankings.push({
                        name: sanitizedName,
                        selectedProfiles: selectedProfiles,
                        type: ranking.type === 'archive' ? 'archive' : 'active',
                        archiveFolder: ranking.type === 'archive' ? normalizeArchiveFolderName(ranking.archiveFolder) : '',
                        createdAt: ranking.createdAt || new Date().toISOString()
                    });
                });
            } catch (error) {
                console.error('Rankings konnten nicht aus dem localStorage geladen werden:', error);
                localStorage.removeItem('rankings');
            }
        }

        function getProfileIndex(profileName) {
            return profiles.findIndex(p => p.name === profileName);
        }

        function getInputName(index) {
            return [
                '100m', 'Weit', 'Kugel', 'Hoch', '400m',
                '110mH', 'Diskus', 'Stab', 'Speer', '1500m'
            ][index - 1];
        }

        function displayProfileResults(profileName) {
            hideWorldAthleticsPerformanceSuggestions();
            const profile = profiles.find(p => p.name === profileName);
            if (!profile) return;
            ensureProfileShape(profile);

            // Leeren der vorhandenen Labels
            const labelsContainer = document.querySelector('.labels-container');
            labelsContainer.innerHTML = '';

            if (profile.type === 'single') {
                // Funktion zum Anzeigen von Einzelprofilen
                displaySingleProfile(profile);
            } else if (profile.type === 'comparison') {
                // Funktion zum Anzeigen von Vergleichsprofilen
                displayComparisonProfile(profile);
            }
        }

        function getRankingByName(rankingName) {
            return rankings.find(ranking => ranking.name === rankingName) || null;
        }

        function getSortedRankingEntries(ranking) {
            if (!ranking || !Array.isArray(ranking.selectedProfiles)) {
                return [];
            }

            const isArchiveRanking = ranking.type === 'archive';
            const archiveFolderName = normalizeArchiveFolderName(ranking.archiveFolder);

            return ranking.selectedProfiles
                .map(profileName => profiles.find(profile => profile.name === profileName && profile.type === 'single'))
                .filter(function(profile) {
                    if (!profile) {
                        return false;
                    }

                    if (isArchiveRanking) {
                        return profile.archived === true && normalizeArchiveFolderName(profile.archiveFolder) === archiveFolderName;
                    }

                    return profile.archived !== true;
                })
                .map(profile => {
                    ensureProfileShape(profile);
                    const totalPoints = getTotalPointsFromResults(profile.results.slice(0, 10));
                    profile.totalPoints = totalPoints;

                    return {
                        name: profile.name,
                        values: profile.values.slice(0, 10),
                        results: profile.results.slice(0, 10),
                        totalPoints: totalPoints
                    };
                })
                .sort((entryA, entryB) => {
                    if (entryB.totalPoints !== entryA.totalPoints) {
                        return entryB.totalPoints - entryA.totalPoints;
                    }

                    return entryA.name.localeCompare(entryB.name, 'de');
                });
        }

        function buildDescendingRanks(values) {
            const sortedValues = Array.from(new Set(values.slice().sort(function(a, b) {
                return b - a;
            })));

            return values.map(function(value) {
                return sortedValues.indexOf(value) + 1;
            });
        }

        function getCumulativePoints(results) {
            let runningTotal = 0;
            return results.map(function(result) {
                runningTotal += parseInt(result || '0', 10);
                return runningTotal;
            });
        }

        function displayRankingResults(ranking) {
            const labelsContainer = document.querySelector('.labels-container');
            labelsContainer.innerHTML = '';
            appendViewHeader(labelsContainer, ranking.name, ranking.type === 'archive' ? null : function() {
                openRankingWindow(ranking.name);
            });

            const entries = getSortedRankingEntries(ranking);
            if (entries.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'ranking-empty';
                emptyState.textContent = 'Für dieses Ranking sind aktuell keine Einzelprofile verfügbar.';
                labelsContainer.appendChild(emptyState);
                return;
            }

            const rankingView = document.createElement('div');
            rankingView.className = 'ranking-view';

            const scrollWrapper = document.createElement('div');
            scrollWrapper.className = 'ranking-scroll';

            const table = document.createElement('div');
            table.className = 'ranking-table';
            const disciplinePointsByIndex = Array.from({ length: 10 }, function(_, disciplineIndex) {
                return entries.map(function(entry) {
                    return parseInt(entry.results[disciplineIndex] || '0', 10);
                });
            });
            const disciplineRanksByIndex = disciplinePointsByIndex.map(function(pointValues) {
                return buildDescendingRanks(pointValues);
            });
            const cumulativePointsByEntry = entries.map(function(entry) {
                return getCumulativePoints(entry.results);
            });
            const cumulativeRanksByIndex = Array.from({ length: 10 }, function(_, disciplineIndex) {
                return buildDescendingRanks(cumulativePointsByEntry.map(function(cumulativeValues) {
                    return cumulativeValues[disciplineIndex];
                }));
            });
            const disciplineTopRanksByIndex = disciplinePointsByIndex.map(function(pointValues) {
                const uniqueValues = Array.from(new Set(pointValues.filter(function(value) {
                    return value > 0;
                }).sort(function(a, b) {
                    return b - a;
                }))).slice(0, 3);
                return uniqueValues;
            });

            const headerRow = document.createElement('div');
            headerRow.className = 'ranking-row ranking-header';

            const athleteHeader = document.createElement('div');
            athleteHeader.className = 'ranking-cell ranking-athlete';
            athleteHeader.textContent = '';
            headerRow.appendChild(athleteHeader);

            for (let i = 1; i <= 10; i++) {
                const disciplineHeader = document.createElement('div');
                disciplineHeader.className = 'ranking-cell ranking-discipline-header';
                disciplineHeader.textContent = getInputName(i);
                headerRow.appendChild(disciplineHeader);
            }

            const totalHeader = document.createElement('div');
            totalHeader.className = 'ranking-cell ranking-total';
            totalHeader.textContent = 'Punkte';
            headerRow.appendChild(totalHeader);
            table.appendChild(headerRow);

            entries.forEach((entry, index) => {
                const row = document.createElement('div');
                row.className = 'ranking-row';

                const totalLeader = entries[0].totalPoints;
                const totalBehind = totalLeader - entry.totalPoints;

                const athleteCell = document.createElement('div');
                athleteCell.className = 'ranking-cell ranking-athlete';

                const place = document.createElement('div');
                place.className = 'ranking-place';
                place.textContent = `${index + 1}.`;
                athleteCell.appendChild(place);

                const name = document.createElement('div');
                name.className = 'ranking-name';
                name.textContent = entry.name;
                athleteCell.appendChild(name);
                row.appendChild(athleteCell);

                entry.values.forEach((value, valueIndex) => {
                    const valueCell = document.createElement('div');
                    valueCell.className = 'ranking-cell ranking-value-cell';
                    const currentPoints = parseInt(entry.results[valueIndex] || '0', 10);
                    const disciplineRank = disciplineRanksByIndex[valueIndex][index];
                    const cumulativePoints = cumulativePointsByEntry[index][valueIndex];
                    const cumulativeRank = cumulativeRanksByIndex[valueIndex][index];

                    if (entries.length > 1 && currentPoints > 0) {
                        const topValues = disciplineTopRanksByIndex[valueIndex];
                        if (topValues[0] === currentPoints) {
                            valueCell.classList.add('is-best');
                        } else if (entries.length >= 4 && topValues[1] === currentPoints) {
                            valueCell.classList.add('is-second-best');
                        } else if (entries.length >= 4 && topValues[2] === currentPoints) {
                            valueCell.classList.add('is-third-best');
                        }
                    }

                    const points = document.createElement('div');
                    points.className = 'ranking-value';
                    points.textContent = `${currentPoints} P`;
                    valueCell.appendChild(points);

                    const performance = document.createElement('div');
                    performance.className = 'ranking-subvalue ranking-performance';
                    performance.appendChild(document.createTextNode(value || '—'));

                    const isHighlightedDisciplineRank = currentPoints > 0 && disciplineRank >= 1 && disciplineRank <= 3;

                    if (isHighlightedDisciplineRank) {
                        performance.appendChild(document.createTextNode(' '));
                    } else {
                        performance.appendChild(document.createTextNode(' ('));
                    }

                    const disciplineRankElement = document.createElement('span');
                    disciplineRankElement.textContent = isHighlightedDisciplineRank ? disciplineRank : `${disciplineRank}.`;
                    if (isHighlightedDisciplineRank) {
                        disciplineRankElement.className = 'ranking-discipline-rank';
                    }

                    if (isHighlightedDisciplineRank && disciplineRank === 1) {
                        disciplineRankElement.classList.add('is-gold');
                    } else if (isHighlightedDisciplineRank && disciplineRank === 2) {
                        disciplineRankElement.classList.add('is-silver');
                    } else if (isHighlightedDisciplineRank && disciplineRank === 3) {
                        disciplineRankElement.classList.add('is-bronze');
                    }
                    performance.appendChild(disciplineRankElement);
                    if (!isHighlightedDisciplineRank) {
                        performance.appendChild(document.createTextNode(')'));
                    }
                    valueCell.appendChild(performance);

                    const cumulative = document.createElement('div');
                    cumulative.className = 'ranking-subvalue ranking-cumulative';
                    cumulative.textContent = `${cumulativePoints} P (${cumulativeRank}.)`;
                    valueCell.appendChild(cumulative);

                    row.appendChild(valueCell);
                });

                const totalCell = document.createElement('div');
                totalCell.className = 'ranking-cell ranking-total';
                totalCell.style.flexDirection = 'column';
                totalCell.style.gap = '4px';
                totalCell.style.justifyContent = 'center';
                totalCell.style.alignItems = 'flex-end';

                const totalValue = document.createElement('div');
                totalValue.className = 'ranking-total-points';
                totalValue.textContent = `${entry.totalPoints} P`;
                totalCell.appendChild(totalValue);

                if (index !== 0) {
                    const totalMeta = document.createElement('div');
                    totalMeta.className = 'ranking-total-meta';
                    totalMeta.textContent = `-${totalBehind} P`;
                    totalCell.appendChild(totalMeta);
                }

                row.appendChild(totalCell);
                table.appendChild(row);
            });

            scrollWrapper.appendChild(table);
            rankingView.appendChild(scrollWrapper);
            labelsContainer.appendChild(rankingView);
            attachRankingScrollEnhancements(rankingView, scrollWrapper);
            animateViewEntrance(rankingView);
        }

        function reorderArchivedProfilesBySidebarOrder(folderName) {
            const normalizedFolderName = normalizeArchiveFolderName(folderName);
            const orderedNames = getArchiveProfileItems(true).map(function(item) {
                return item.dataset.profileName;
            });
            const profileMap = new Map(profiles.map(function(profile) {
                return [profile.name, profile];
            }));
            const reorderedFolderProfiles = [];
            const remainingProfiles = [];

            orderedNames.forEach(function(profileName) {
                const profile = profileMap.get(profileName);
                if (profile) {
                    reorderedFolderProfiles.push(profile);
                    profileMap.delete(profileName);
                }
            });

            profiles.forEach(function(profile) {
                if (!profileMap.has(profile.name)) {
                    return;
                }

                if (profile.archived === true && normalizeArchiveFolderName(profile.archiveFolder) === normalizedFolderName) {
                    return;
                }

                remainingProfiles.push(profile);
            });

            profiles.splice(0, profiles.length, ...remainingProfiles, ...reorderedFolderProfiles);
            saveProfilesToLocalStorage();
        }

        function initializeArchiveProfileDragAndDrop(profileList, folderName) {
            if (!profileList || profileList.dataset.archiveProfileDndInitialized === 'true') {
                return;
            }

            profileList.addEventListener('dragover', function(event) {
                event.preventDefault();
                if (!draggedArchiveProfileName) {
                    return;
                }

                const items = Array.from(profileList.querySelectorAll('.archive-profile-item:not(.dragging)'));
                placeArchiveDropIndicator(profileList, items, getDropIndexByYForItems(items, event.clientY));
            });

            profileList.addEventListener('drop', function(event) {
                event.preventDefault();
                if (!draggedArchiveProfileName) {
                    return;
                }

                const draggedItem = profileList.querySelector('.archive-profile-item.dragging');
                if (!draggedItem) {
                    removeDropIndicator();
                    draggedArchiveProfileName = null;
                    return;
                }

                const items = Array.from(profileList.querySelectorAll('.archive-profile-item:not(.dragging)'));
                const dropIndex = getDropIndexByYForItems(items, event.clientY);
                const referenceItem = items[dropIndex];

                if (referenceItem) {
                    profileList.insertBefore(draggedItem, referenceItem);
                } else {
                    profileList.appendChild(draggedItem);
                }

                draggedItem.classList.remove('dragging');
                removeDropIndicator();
                draggedArchiveProfileName = null;
                reorderArchivedProfilesBySidebarOrder(folderName);
            });

            profileList.addEventListener('dragleave', function(event) {

                }
            });

        function initializeArchiveFolderDragAndDrop(archiveSection) {
            if (!archiveSection || archiveSection.dataset.archiveFolderDndInitialized === 'true') {
                return;
            }

            archiveSection.addEventListener('dragover', function(event) {
                if (sidebarMode !== 'archive' || !draggedArchiveFolderName) {
                    return;
                }

                event.preventDefault();
                const items = getArchiveFolderItems(false);
                placeArchiveDropIndicator(archiveSection, items, getDropIndexByYForItems(items, event.clientY));
            });

            archiveSection.addEventListener('drop', function(event) {
                if (sidebarMode !== 'archive' || !draggedArchiveFolderName) {
                    return;
                }

                event.preventDefault();
                const draggedItem = getArchiveFolderItems(true).find(function(item) {
                    return item.dataset.folderName === draggedArchiveFolderName;
                });

                if (!draggedItem) {
                    removeDropIndicator();
                    draggedArchiveFolderName = null;
                    return;
                }

                const items = getArchiveFolderItems(false);
                const dropIndex = getDropIndexByYForItems(items, event.clientY);
                const referenceItem = items[dropIndex];

                if (referenceItem) {
                    archiveSection.insertBefore(draggedItem, referenceItem);
                } else {
                    archiveSection.appendChild(draggedItem);
                }

                draggedItem.classList.remove('dragging');
                removeDropIndicator();
                draggedArchiveFolderName = null;
                reorderArchiveFoldersBySidebarOrder();
            });

            archiveSection.addEventListener('dragleave', function(event) {
                if (!archiveSection.contains(event.relatedTarget)) {
                    removeDropIndicator();
                }
            });

            archiveSection.dataset.archiveFolderDndInitialized = 'true';
        }

        function getArchiveFolderProfileNames(folderName) {
            const normalizedFolderName = normalizeArchiveFolderName(folderName);
            return getArchiveFolderProfiles(normalizedFolderName).map(function(profile) {
                return profile.name;
            });
        }

        function deleteArchiveFolder(folderName) {
            const normalizedFolderName = normalizeArchiveFolderName(folderName);
            const folderProfileNames = getArchiveFolderProfileNames(normalizedFolderName);
            if (folderProfileNames.length === 0) {
                return false;
            }

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);
            const currentRanking = getRankingByName(currentTitle);
            const profilesToDelete = profiles
                .filter(function(profile) {
                    return folderProfileNames.includes(profile.name)
                        || folderProfileNames.some(function(profileName) {
                            return getComparisonAthletes(profile.name).includes(profileName);
                        });
                })
                .map(function(profile) {
                    return profile.name;
                });

            removeProfilesByName(profilesToDelete);

            for (let i = rankings.length - 1; i >= 0; i--) {
                rankings[i].selectedProfiles = (rankings[i].selectedProfiles || [])
                    .filter(function(selectedProfileName) {
                        return !profilesToDelete.includes(selectedProfileName);
                    });

                const isDeletedArchiveFolderRanking = rankings[i].type === 'archive'
                    && normalizeArchiveFolderName(rankings[i].archiveFolder) === normalizedFolderName;

                if (isDeletedArchiveFolderRanking || rankings[i].selectedProfiles.length === 0) {
                    deleteRanking(rankings[i].name);
                }
            }

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            const folderOrderIndex = archiveFolderOrder.indexOf(normalizedFolderName);
            if (folderOrderIndex !== -1) {
                archiveFolderOrder.splice(folderOrderIndex, 1);
                saveArchiveFolderOrderToLocalStorage();
            }
            if (sidebarMode === 'archive-folder' && activeArchiveFolder === normalizedFolderName) {
                sidebarMode = 'archive';
                activeArchiveFolder = '';
            }
            updateSidebarEmptyStates();

            if (profilesToDelete.includes(currentTitle) || currentComparisonAthletes.some(function(profileName) {
                return profilesToDelete.includes(profileName);
            })) {
                navigateToHome();
            } else if (currentRanking) {
                const updatedRanking = getRankingByName(currentRanking.name);
                if (updatedRanking) {
                    openRankingResults(updatedRanking.name);
                } else {
                    navigateToHome();
                }
            }

            return true;
        }

            }) || profileName === defaultTitle;

        function deleteRanking(rankingName) {
            const rankingIndex = rankings.findIndex(ranking => ranking.name === rankingName);
            if (rankingIndex !== -1) {
                rankings.splice(rankingIndex, 1);
            }

            const rankingItem = findRankingItemByName(rankingName);
            if (rankingItem && rankingItem.parentNode) {
                rankingItem.parentNode.removeChild(rankingItem);
            }

            saveRankingsToLocalStorage();
            updateSidebarEmptyStates();

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            if (currentTitle === rankingName) {
                navigateToHome();
            }
        }

        function removeProfilesByName(profileNames) {
            profileNames.forEach(function(name) {
                const index = profiles.findIndex(profile => profile.name === name);
                if (index !== -1) {
                    profiles.splice(index, 1);
                }

                const profileItem = findProfileItemByName(name);
                if (profileItem && profileItem.parentNode) {
                    profileItem.parentNode.removeChild(profileItem);
                }

                const archiveItem = findArchiveProfileItemByName(name);
                if (archiveItem && archiveItem.parentNode) {
                    archiveItem.parentNode.removeChild(archiveItem);
                }
            });
        }

        function archiveProfile(profileName, folderName = '') {
            const profile = profiles.find(existingProfile => existingProfile.name === profileName && existingProfile.type === 'single');
            if (!profile) {
                return false;
            }

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);
            const currentRanking = getRankingByName(currentTitle);
            const comparisonProfilesToDelete = profiles
                .filter(existingProfile => existingProfile.type === 'comparison' && getComparisonAthletes(existingProfile.name).includes(profileName))
                .map(existingProfile => existingProfile.name);

            profile.archived = true;
            profile.archiveFolder = normalizeArchiveFolderName(folderName);
            if (profile.archiveFolder && !archiveFolderOrder.includes(profile.archiveFolder)) {
                archiveFolderOrder.push(profile.archiveFolder);
                saveArchiveFolderOrderToLocalStorage();
            }

            const profileItem = findProfileItemByName(profileName);
            if (profileItem && profileItem.parentNode) {
                profileItem.parentNode.removeChild(profileItem);
            }

            removeProfilesByName(comparisonProfilesToDelete);
            cleanupRankingsAfterProfileArchive(profileName);

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            if (sidebarMode === 'archive-folder' && getArchiveFolderProfiles(activeArchiveFolder).length === 0) {
                sidebarMode = 'archive';
                activeArchiveFolder = '';
            }
            updateSidebarEmptyStates();

            if (currentTitle === profileName || currentComparisonAthletes.includes(profileName)) {
                navigateToHome();
            } else if (currentRanking) {
                const updatedRanking = getRankingByName(currentRanking.name);
                if (updatedRanking) {
                    openRankingResults(updatedRanking.name);
                } else {
                    navigateToHome();
                }
            }

            return true;
        }

            const profileList = getProfileListElement();

        function ensureDropIndicator() {
            if (!dropIndicator) {
                dropIndicator = document.createElement('div');
                dropIndicator.className = 'profile-drop-indicator';
            }
            return dropIndicator;
        }

        function removeDropIndicator() {
            if (dropIndicator && dropIndicator.parentNode) {
                dropIndicator.parentNode.removeChild(dropIndicator);
            }
        }

        function getDropIndexByY(clientY) {
            const items = getProfileItems(false);
            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();
                if (clientY < rect.top + (rect.height / 2)) {
                    return i;
                }
            }
            return items.length;
        }

        function placeDropIndicator(dropIndex) {
            const profileList = getProfileListElement();
            const indicator = ensureDropIndicator();
            const items = getProfileItems(false);
            const targetItem = items[dropIndex];

            removeDropIndicator();

            if (targetItem) {
                profileList.insertBefore(indicator, targetItem);
            } else {
                profileList.appendChild(indicator);
            }
        }

        function reorderProfilesBySidebarOrder() {
            const orderedNames = getProfileItems(true).map(item => item.dataset.profileName);
            const profileMap = new Map(profiles.map(profile => [profile.name, profile]));
            const reorderedProfiles = [];

            orderedNames.forEach(name => {
                if (profileMap.has(name)) {
                    reorderedProfiles.push(profileMap.get(name));
                    profileMap.delete(name);
                }
            });

            profiles.splice(0, profiles.length, ...reorderedProfiles, ...Array.from(profileMap.values()));
            saveProfilesToLocalStorage();
        }

        function initializeSidebarDragAndDrop() {
            const profileList = getProfileListElement();
            if (profileList.dataset.dndInitialized === 'true') return;

            profileList.addEventListener('dragover', function(event) {
                event.preventDefault();
                if (!draggedProfileName) return;
                placeDropIndicator(getDropIndexByY(event.clientY));
            });

            profileList.addEventListener('drop', function(event) {
                event.preventDefault();
                if (!draggedProfileName) return;

                const draggedItem = findProfileItemByName(draggedProfileName);
                if (!draggedItem) {
                    removeDropIndicator();
                    draggedProfileName = null;
                    return;
                }

                const dropIndex = getDropIndexByY(event.clientY);
                const itemsWithoutDragged = getProfileItems(false).filter(item => item.dataset.profileName !== draggedProfileName);
                const referenceItem = itemsWithoutDragged[dropIndex];

                if (referenceItem) {
                    profileList.insertBefore(draggedItem, referenceItem);
                } else {
                    profileList.appendChild(draggedItem);
                }

                draggedItem.classList.remove('dragging');
                removeDropIndicator();
                draggedProfileName = null;
                reorderProfilesBySidebarOrder();
            });

            profileList.addEventListener('dragleave', function(event) {
                if (!profileList.contains(event.relatedTarget)) {
                    removeDropIndicator();
                }
            });

            profileList.dataset.dndInitialized = 'true';
        }

        // Hier können Sie die Funktion addProfileToSidebar anpassen, um neue Profile mit ihren eigenen Ergebnis-Arrays hinzuzufügen
        function addProfileToSidebar(profileName, type = 'single') {
            profileName = sanitizeProfileName(profileName);
            if (!profileName) {
                return null;
            }

            if (profileName === defaultTitle) {
                alert('Dieser Profilname ist bereits reserviert.');
                return null;
            }

            if (type === 'single' && profileName.includes(' vs. ')) {
                alert('Der Profilname darf "vs." nicht enthalten.');
                return null;
            }

            const profileList = getProfileListElement();
            const existingProfile = profiles.find(p => p.name === profileName);
            if (existingProfile && existingProfile.archived === true) {
                updateSidebarEmptyStates();
                return profileName;
            }

            // Prüfen ob Profil bereits in Sidebar existiert
            if (!getProfileItems(true).some(item => item.dataset.profileName === profileName)) {
                // Erstellen eines Containers für das Profil und den Lösch-Button
                const profileContainer = document.createElement('div');
                profileContainer.className = 'profile-item sidebar-entry';
                profileContainer.dataset.profileName = profileName;
                profileContainer.draggable = true;

                profileContainer.addEventListener('dragstart', function(event) {
                    draggedProfileName = profileName;
                    profileContainer.classList.add('dragging');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', profileName);
                });

                profileContainer.addEventListener('dragend', function() {
                    profileContainer.classList.remove('dragging');
                    removeDropIndicator();
                    draggedProfileName = null;
                });

                // Erstellen des Profil-Buttons
                const newButton = document.createElement('button');
                newButton.className = 'sidebar-main-button';
                newButton.onclick = function() {
                    handleProfileButtonClick(profileName);
                };

                const profileIcon = document.createElement('img');
                profileIcon.src = 'imgs/profile.png';
                profileIcon.draggable = false;
                newButton.appendChild(profileIcon);

                const profileLabel = document.createElement('span');
                profileLabel.textContent = profileName;
                newButton.appendChild(profileLabel);

                profileContainer.appendChild(newButton);

                // Erstellen des Lösch-Buttons
                const deleteButton = document.createElement('button');
                deleteButton.className = 'sidebar-action-button profile-delete-button';
                // Füge das Bild-Element hinzu
                const deleteIcon = document.createElement('img');
                deleteIcon.src = 'imgs/delete_profile.png'; // Der Dateipfad für das Bild
                deleteIcon.draggable = false;
                deleteIcon.style.width = '20px'; // Größe des Bildes anpassen
                deleteIcon.style.height = '20px';
                deleteButton.appendChild(deleteIcon);
                deleteButton.onclick = function() {
                    confirmProfileDeletion(profileName);
                };
                profileContainer.appendChild(deleteButton);

                // Hinzufügen des Containers zur Sidebar
                profileList.appendChild(profileContainer);
            }

            // Prüfen ob Profil bereits in `profiles` existiert
            if (!existingProfile) {
                let resultsArray = Array(10).fill('');
                let valuesArray = Array(10).fill('');

                // Wenn es sich um ein Vergleichsprofil handelt, erweitern Sie die Arrays
                if (type === 'comparison') {
                    resultsArray = Array(20).fill('');
                    valuesArray = Array(20).fill('');
                }

                // Hinzufügen des Profils zur internen Profil-Liste
                profiles.push({ name: profileName, results: resultsArray, values: valuesArray, type: type, archived: false, archiveFolder: '' });
                saveProfilesToLocalStorage(); // Speichern der Profile im `localStorage`
            } else {
                ensureProfileShape(existingProfile);
            }

            updateSidebarEmptyStates();

            return profileName;
        }
