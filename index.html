<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zehnkampfrechner</title>

    <!-- Verweise auf die Manifest-Datei -->
    <link rel="manifest" href="manifest.json">

    <!-- Theme color für die mobile Ansicht -->
    <meta name="theme-color" content="#262626">

    <!-- Icons -->
    <link rel="icon" href="imgs/appIcon.png" sizes="192x192">
    <link rel="icon" href="imgs/appIcon.png" sizes="512x512">

    <style>
        :root {
            --accent: #8fd0a3;
            --accent-strong: #63a97b;
            --surface-soft: rgba(255, 255, 255, 0.06);
            --surface-mid: rgba(255, 255, 255, 0.1);
            --surface-strong: rgba(255, 255, 255, 0.16);
            --border-soft: rgba(255, 255, 255, 0.08);
            --border-mid: rgba(255, 255, 255, 0.18);
            --text-main: #f4f6f8;
            --text-soft: rgba(232, 237, 241, 0.72);
            --text-muted: rgba(220, 226, 233, 0.48);
            --shadow-soft: 0 16px 30px rgba(0, 0, 0, 0.16);
            --shadow-mid: 0 20px 42px rgba(0, 0, 0, 0.22);
            --radius-card: 22px;
        }

        .background-dark {
            background-color: #262626;
            background-image: radial-gradient(circle at top, rgba(108, 151, 122, 0.18), transparent 34%), linear-gradient(180deg, #1f2328 0%, #262626 42%, #222629 100%);
            min-height: 100vh;
            color: var(--text-main);
        }

        #transparentOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Hinter allen anderen Elementen */
            background: transparent; /* Unsichtbar */
        }
        
        .center{
            display: none;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
            text-align: center;
            letter-spacing: 0.01em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .home-top-title {
            display: none;
            flex: 1;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 34px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin: 0 16px;
            padding: 10px 0 12px 0;
            border-bottom: 1px solid var(--border-soft);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0.02) 100%);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .app-topbar-menu {
            flex: 0 0 auto;
        }

        .app-topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex: 0 0 auto;
            margin-left: auto;
            padding-right: 2px;
        }

        .home-intro {
            width: calc(100% - 32px);
            max-width: 720px;
            margin: 22px auto 0 auto;
            padding: 0;
            box-sizing: border-box;
        }

        .icon-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 0;
        }

        .home-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 12px;
            aspect-ratio: 1 / 1;
            min-height: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-card);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.045) 100%);
            box-shadow: var(--shadow-soft);
            color: white;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .home-action:hover {
            transform: translateY(-3px);
            border-color: rgba(143, 208, 163, 0.3);
            background: linear-gradient(180deg, rgba(143, 208, 163, 0.12) 0%, rgba(255, 255, 255, 0.065) 100%);
            box-shadow: var(--shadow-mid);
        }

        .home-action-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .home-action-icon img {
            display: block;
            width: min(100%, 22vh);
            height: min(100%, 22vh);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .home-action-comparison .home-action-icon img {
            width: min(100%, 24vh);
            height: auto;
            max-height: min(48%, 15vh);
        }

        .home-action-title {
            font-family: 'Roboto', sans-serif;
            font-size: 24px;
            font-weight: bold;
            min-height: 22px;
            letter-spacing: 0.01em;
        }

        .home-action-placeholder {
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.14);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
            cursor: default;
            box-shadow: none;
        }

        .home-action-placeholder:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.12);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
        }

        .home-action-placeholder .home-action-icon {
            color: rgba(255, 255, 255, 0.42);
            font-size: 52px;
            font-weight: bold;
        }

        .install-hint {
            display: none;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
            padding: 14px 14px 12px 14px;
            border: 1px solid rgba(143, 208, 163, 0.18);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(143, 208, 163, 0.1) 0%, rgba(255, 255, 255, 0.04) 100%);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
        }

        .install-hint.is-visible {
            display: flex;
        }

        .install-hint-copy {
            min-width: 0;
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
        }

        .install-hint-title {
            font-size: 15px;
            font-weight: bold;
            line-height: 1.25;
        }

        .install-hint-text {
            margin-top: 4px;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.4;
        }

        .install-hint-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .install-hint-button,
        .install-hint-dismiss {
            border: none;
            border-radius: 12px;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
        }

        .install-hint-button {
            min-height: 36px;
            padding: 8px 12px;
            background: rgba(38, 38, 38, 0.92);
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .install-hint-dismiss {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 18px;
            line-height: 1;
        }

        .install-hint-button:hover,
        .install-hint-dismiss:hover {
            transform: translateY(-1px);
        }


        .labels-container {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 30px;
            animation: view-fade-in 0.24s ease;
        }

        .label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 0;
            margin-bottom: 0;
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            font-size: 25px;
        }

        .input {
            width: 70px;
            margin-left: 10px;
            min-height: 40px;
            padding: 6px 8px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #f7fafc;
            font-size: 20px;
            text-align: center;
            transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .inputcomparison {
            width: 55px;
            margin-left: 10px;
            min-height: 38px;
            padding: 6px 8px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #f7fafc;
            font-size: 16px;
            text-align: center;
            transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .input:focus,
        .inputcomparison:focus {
            outline: none;
            border-color: rgba(143, 208, 163, 0.52);
            box-shadow: 0 0 0 3px rgba(143, 208, 163, 0.14);
            background: rgba(255, 255, 255, 0.24);
        }

        #result1, #result2, #result3, #result4, #result5, #result6, #result7, #result8, #result9, #result10 {
            width: 70px;
            text-align: right;
            font-size: 25px;
        }

        ::placeholder {
            color: rgba(223, 229, 235, 0.4);
            font-style: italic;
        }

        /* Menü */
        .menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100%;
            background: linear-gradient(180deg, #555d66 0%, #4f5761 100%);
            z-index: 2;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            box-shadow: 18px 0 30px rgba(0, 0, 0, 0.2);
        }

        .menu a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: white;
            display: block;
            transition: 0.3s;
        }

        .menu a:hover {
            color: white;
        }

        .menu .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
            color: white;
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #profileList {
            margin-top: 12px;
            position: relative;
        }

        .sidebar-section {
            margin-top: 20px;
        }

        .sidebar-section-title {
            padding: 0 14px 8px 14px;
            color: rgba(255, 255, 255, 0.68);
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .ranking-sidebar-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .profile-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: transparent;
            margin-bottom: 5px;
        }

        .sidebar-entry {
            transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.16s ease;
        }

        .sidebar-entry:hover {
            background-color: rgba(255, 255, 255, 0.08);
            transform: translateX(1px);
        }

        .sidebar-entry.is-active {
            background-color: rgba(120, 190, 138, 0.18);
            box-shadow: inset 3px 0 0 #8fd0a3;
        }

        .sidebar-main-button {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            padding: 0 0 0 12px;
            border: none;
            background: transparent;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 20px;
            text-align: left;
            cursor: pointer;
            min-height: 46px;
        }

        .sidebar-main-button img {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            object-fit: contain;
        }

        .sidebar-main-button span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-action-button {
            border: none;
            background-color: #262626;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 8px;
            padding: 4px 8px;
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
            min-width: 36px;
            min-height: 36px;
            transition: background-color 0.18s ease, transform 0.18s ease;
        }

        .icon-action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            min-width: 32px;
            min-height: 32px;
        }

        .icon-action-button img {
            width: 20px;
            height: 20px;
            display: block;
        }

        .sidebar-action-button.icon-action-button {
            background-color: #262626;
            border-radius: 5px;
            margin-right: 8px;
            padding: 4px 8px;
        }

        .sidebar-action-button:hover {
            background-color: #1f2328;
            transform: translateY(-1px);
        }

        .sidebar-empty {
            margin: 8px 12px 0 12px;
            padding: 14px 12px;
            border: 1px dashed rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-soft);
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            line-height: 1.45;
        }

        .sidebar-empty-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            padding: 8px 10px;
            background: rgba(38, 38, 38, 0.88);
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.18s ease, transform 0.18s ease;
        }

        .sidebar-empty-button:hover {
            background: rgba(31, 35, 40, 0.96);
            transform: translateY(-1px);
        }

        .sidebar-empty-button img {
            width: 16px;
            height: 16px;
        }

        .profile-item.dragging {
            opacity: 0.6;
        }

        .profile-drop-indicator {
            height: 0;
            border-top: 2px solid #f1f1f1;
            margin: 4px 8px;
            pointer-events: none;
        }

        /* Overlay styles */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 200px; /* Starts right next to the sidebar */
            width: calc(100% - 200px); /* Covers the area to the right of the sidebar */
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Halbtransparent */
            z-index: 1; /* Set lower than the sidebar */
        }

        #main {
            transition: margin-left .5s;
            padding: 16px;
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) auto;
            align-items: center;
            gap: 14px;
        }

        #top-icons img {
            display: block;
            width: 32px;
            height: 32px;
            padding: 8px;
            box-sizing: content-box;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            cursor: pointer;
            transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
        }

        #top-icons img:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
        }

        #top-icons img[src$="comparison.png"] {
            width: 64px;
            height: 32px;
        }

        .ranking-view {
            position: relative;
            z-index: 0;
            width: calc(100% - 32px);
            margin: 8px 16px 0 16px;
            color: white;
            font-family: 'Roboto', sans-serif;
        }

        .ranking-scroll {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(143, 208, 163, 0.44) rgba(255, 255, 255, 0.05);
        }

        .ranking-table {
            width: max-content;
            min-width: 100%;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: repeat(12, minmax(92px, 1fr));
            align-items: stretch;
            width: 100%;
        }

        .ranking-row + .ranking-row {
            margin-top: 10px;
        }

        .ranking-cell {
            min-height: 76px;
            padding: 10px 10px;
            box-sizing: border-box;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .ranking-header .ranking-cell {
            min-height: 64px;
            font-size: 15px;
            font-weight: bold;
            color: #f3f5f7;
            background: rgba(255, 255, 255, 0.1);
        }

        .ranking-athlete {
            position: sticky;
            left: 0;
            z-index: 3;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            background: linear-gradient(90deg, #3a4450 0%, #34404b 100%);
            box-shadow: 10px 0 20px rgba(0, 0, 0, 0.16);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ranking-header .ranking-athlete {
            z-index: 5;
            background: linear-gradient(90deg, #4b5766 0%, #44505e 100%);
        }

        .ranking-total {
            position: sticky;
            right: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-weight: bold;
            background: linear-gradient(90deg, #355e46 0%, #2e543f 100%);
            box-shadow: -10px 0 20px rgba(0, 0, 0, 0.18);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ranking-header .ranking-total {
            z-index: 6;
            background: linear-gradient(90deg, #407555 0%, #38684c 100%);
        }

        .ranking-place {
            font-size: 13px;
            font-weight: bold;
            color: #a8d7b7;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }

        .ranking-name {
            font-size: 15px;
            font-weight: bold;
            color: white;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ranking-value-cell.is-best {
            background: rgba(120, 190, 138, 0.42);
        }

        .ranking-value-cell.is-second-best {
            background: rgba(120, 190, 138, 0.24);
        }

        .ranking-value-cell.is-third-best {
            background: rgba(120, 190, 138, 0.14);
        }

        .ranking-discipline-header {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: nowrap;
        }

        .ranking-value-cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            text-align: center;
        }

        .ranking-value {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }

        .ranking-subvalue {
            font-size: 12px;
            color: #d6dde4;
            white-space: nowrap;
        }

        .ranking-points {
            font-size: 13px;
            color: #c8d0d8;
        }

        .ranking-total-points {
            font-size: 20px;
            color: white;
        }

        .ranking-total-meta {
            font-size: 12px;
            color: #d6dde4;
            text-align: right;
            white-space: nowrap;
        }

        .ranking-empty {
            padding: 24px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            color: #d4d8dd;
            font-family: 'Roboto', sans-serif;
        }

        .view-header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 14px;
            padding: 2px 0 6px 0;
            box-sizing: border-box;
            animation: view-fade-in 0.22s ease;
        }

        .view-header-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 0;
            max-width: 100%;
        }

        .view-header-title {
            min-width: 0;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.01em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-view-surface {
            width: 100%;
            box-sizing: border-box;
        }

        .profile-data-row {
            gap: 10px;
            padding: 8px 0;
        }

        .profile-data-row + .profile-data-row {
            border-top: 1px solid rgba(255, 255, 255, 0.045);
        }

        .profile-table-header {
            padding-bottom: 10px;
            margin-bottom: 4px;
            color: var(--text-soft);
            font-size: 18px;
            letter-spacing: 0.01em;
        }

        .profile-total-summary {
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(143, 208, 163, 0.1) 0%, rgba(255, 255, 255, 0.045) 100%);
            border: 1px solid rgba(143, 208, 163, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .single-points-cell {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .single-cumulative {
            font-size: 12px;
            color: var(--text-soft);
            line-height: 1.2;
            white-space: nowrap;
        }

        .comparison-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 14px;
            padding: 10px 0 12px 0;
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            z-index: 1;
            background: transparent;
            transition: background 0.18s ease;
        }

        .comparison-header.is-stuck {
            background-color: #262626;
            background-image: radial-gradient(circle at top, rgba(108, 151, 122, 0.18), transparent 34%), linear-gradient(180deg, #1f2328 0%, #262626 42%, #222629 100%);
        }

        .comparison-athlete-head {
            display: flex;
            flex-direction: column;
            min-width: 0;
            align-items: center;
            text-align: center;
        }

        .comparison-athlete-head.is-left {
            align-items: center;
            text-align: center;
        }

    <script>
        const viewScrollPositions = {};
        let currentViewKey = 'home';
        let deferredInstallPrompt = null;
        const installHintDismissKey = 'installHintDismissed';
        let activeComparisonHeader = null;
        let comparisonHeaderStickY = 0;

        // Profile speichern
        function saveProfilesToLocalStorage() {
            localStorage.setItem('profiles', JSON.stringify(profiles));
        }

        // Profile laden
        function loadProfilesFromLocalStorage() {
            profiles.splice(0, profiles.length);
            console.log('Profile:' ,profiles);
            const savedProfiles = localStorage.getItem('profiles');
            console.log('Saved Profiles:', savedProfiles);
            if (savedProfiles) {
                try {
                    JSON.parse(savedProfiles).forEach(profile => {
                        if (!profile || typeof profile.name !== 'string' || !profile.name.trim()) {
                            return;
                        }

                        ensureProfileShape(profile);

                        if (!profiles.some(p => p.name === profile.name)) {
                            profiles.push(profile);
                        }
                    });
                } catch (error) {
                    console.error('Profile konnten nicht aus dem localStorage geladen werden:', error);
                    localStorage.removeItem('profiles');
                }
            }
            console.log('Loaded profiles:', profiles);
        }

        function normalizePerformanceInput(inputValue) {
            return (inputValue || '').trim().replace(',', '.');
        }

        function parsePerformanceValue(inputValue, disciplineType) {
            const normalizedValue = normalizePerformanceInput(inputValue);

            if (!normalizedValue) {
                return null;
            }

            if (disciplineType === 4) {
                const timeMatch = normalizedValue.match(/^(\d+):([0-5]?\d(?:\.\d+)?)$/);
                if (!timeMatch) {
                    return null;
                }

                const minutes = parseInt(timeMatch[1], 10);
                const seconds = parseFloat(timeMatch[2]);
                const totalSeconds = minutes * 60 + seconds;

                return Number.isFinite(totalSeconds) ? totalSeconds : null;
            }

            const numericValue = parseFloat(normalizedValue);
            if (!Number.isFinite(numericValue) || numericValue < 0) {
                return null;
            }

            if (disciplineType === 2) {
                return numericValue * 100;
            }

            return numericValue;
        }

        function calculateDecathlonPoints(disciplineType, performance, A, B, C) {
            if (!Number.isFinite(performance)) {
                return 0;
            }

            let baseValue = 0;

            if (disciplineType === 1 || disciplineType === 4) {
                baseValue = B - performance;
            } else {
                baseValue = performance - B;
            }

            if (baseValue <= 0) {
                return 0;
            }

            const points = A * Math.pow(baseValue, C);
            if (!Number.isFinite(points) || points < 0) {
                return 0;
            }

            return Math.floor(points);
        }

        function getComparisonAthletes(profileName) {
            if (typeof profileName !== 'string') {
                return [];
            }

            return profileName.includes(' vs. ') ? profileName.split(' vs. ') : [];
        }

        function getResultIndexForInput(profileName, inputName, resultId) {
            const resultIndexBase = parseInt(resultId.replace('result', ''), 10) - 1;
            const comparisonAthletes = getComparisonAthletes(profileName);

            if (comparisonAthletes.length !== 2) {
                return resultIndexBase;
            }

            const athleteName = inputName.includes('_') ? inputName.substring(inputName.indexOf('_') + 1) : '';
            return athleteName === comparisonAthletes[1] ? resultIndexBase + 10 : resultIndexBase;
        }

        function ensureProfileShape(profile) {
            const expectedLength = profile.type === 'comparison' ? 20 : 10;

            if (!Array.isArray(profile.results)) {
                profile.results = [];
            }
            if (!Array.isArray(profile.values)) {
                profile.values = [];
            }

            while (profile.results.length < expectedLength) {
                profile.results.push('0');
            }
            while (profile.values.length < expectedLength) {
                profile.values.push('');
            }

            profile.results = profile.results.slice(0, expectedLength).map(result => result === '' ? '0' : String(result));
            profile.values = profile.values.slice(0, expectedLength).map(value => value == null ? '' : String(value));

            if (profile.type === 'comparison') {
                const [athlete1, athlete2] = getComparisonAthletes(profile.name);
                if (!profile.totalPoints || typeof profile.totalPoints !== 'object') {
                    profile.totalPoints = {};
                }
                if (athlete1 && typeof profile.totalPoints[athlete1] !== 'number') {
                    profile.totalPoints[athlete1] = 0;
                }
                if (athlete2 && typeof profile.totalPoints[athlete2] !== 'number') {
                    profile.totalPoints[athlete2] = 0;
                }
            } else if (typeof profile.totalPoints !== 'number') {
                profile.totalPoints = 0;
            }
        }

        function sanitizeProfileName(profileName) {
            if (typeof profileName !== 'string') {
                return '';
            }

            return profileName.trim().replace(/\s+/g, ' ');
        }

        function toggleNav() {
            var sidebar = document.getElementById("mySidebar");

            // Überprüfen, ob die Sidebar derzeit geöffnet ist
            if (parseInt(sidebar.style.width || '0', 10) > 0) {
                // Sidebar schließen
                closeNav();
            } else {
                // Sidebar öffnen
                openNav();
            }
        }

        function openNav() {
            saveCurrentViewScrollPosition();
            var sidebar = document.getElementById("mySidebar");
            var sidebarWidth = getSidebarWidth();
            sidebar.style.display = "block";
            sidebar.style.width = sidebarWidth + "px";
            document.getElementById("main").style.marginLeft = sidebarWidth + "px";
            // Overlay nach 0.5s sichtbar machen
            setTimeout(function() {
                var overlay = document.getElementById('overlay');
                if (overlay) {
                    overlay.style.left = sidebarWidth + 'px';
                    overlay.style.width = 'calc(100% - ' + sidebarWidth + 'px)';
                    overlay.style.display = 'block';
                }
            }, 500);
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("main").style.marginLeft = "0";
            document.getElementById("overlay").style.display = "none"; // Hide overlay
            restoreViewScrollPosition(currentViewKey);
            // Öffnen Standardprofil nach Löschung
            if (profileDeleted) {
                handleProfileButtonClick(defaultTitle);
                profileDeleted = false;
            }
        }
        
        function calculatePoints(inputName, resultId, disciplineType, A, B, C) {
            var inputElement = document.getElementsByName(inputName)[0];
            var resultElement = document.getElementById(resultId);
            if (!inputElement || !resultElement) {
                return;
            }

            var inputValue = inputElement.value;
            var profileName = document.querySelector('.center').textContent;

            const profileIndex = getProfileIndex(profileName);
            if (profileIndex === -1) {
                return;
            }

            const normalizedValue = normalizePerformanceInput(inputValue);
            const resultIndex = getResultIndexForInput(profileName, inputName, resultId);
            const isComparisonProfile = profileName.includes(" vs. ");
            const isSingleProfile = !isComparisonProfile;

            if (normalizedValue === "") {
                resultElement.textContent = isComparisonProfile || isSingleProfile ? "0 P" : "0";
                profiles[profileIndex].results[resultIndex] = "0";
                profiles[profileIndex].values[resultIndex] = ""; // Wert im Profil ebenfalls auf leer setzen
            } else {
                const performance = parsePerformanceValue(normalizedValue, disciplineType);
                const points = calculateDecathlonPoints(disciplineType, performance, A, B, C);

                resultElement.textContent = isComparisonProfile || isSingleProfile ? `${points} P` : String(points);
                profiles[profileIndex].results[resultIndex] = String(points);
                profiles[profileIndex].values[resultIndex] = normalizedValue;
            }
            saveProfilesToLocalStorage();

            // Aktualisieren der Gesamtpunktzahl für das Vergleichsprofil
            if (isComparisonProfile) {
                const [athlete1, athlete2] = profileName.split(" vs. ");
                
                if (inputName.includes(athlete1)) {
                    calculateTotalPoints(profileName, athlete1);
                } else if (inputName.includes(athlete2)) {
                    calculateTotalPoints(profileName, athlete2);
                }
                updateComparisonRowStates(profileName);
            } else {
                // Standardverhalten für nicht-Vergleichsprofile
                calculateTotalPoints(profileName);
            }
        }


        function calculateTotalPoints(profileName, athlete = null) {
            const profile = profiles.find(p => p.name === profileName);

            if (profile) {
                ensureProfileShape(profile);
                if (athlete) {
                    const athleteIndex = profileName.split(" vs. ").indexOf(athlete);
                    if (athleteIndex === -1) {
                        return;
                    }
                    const startIndex = athleteIndex * 10;
                    const totalPoints = getTotalPointsFromResults(profile.results.slice(startIndex, startIndex + 10));
                    profile.totalPoints[athlete] = totalPoints;

                    const totalElement = document.getElementById(`totalPoints_${athlete}`);
                    if (totalElement) {
                        totalElement.innerHTML = `${totalPoints} P`;
                    }
                } else {
                    const totalPoints = getTotalPointsFromResults(profile.results);
                    profile.totalPoints = totalPoints;

                    const totalElement = document.getElementById('total');
                    if (totalElement) {
                        totalElement.innerHTML = `${totalPoints} P`;
                    }

                    updateSingleProfileCumulative(profileName);
                }

            }
        }

        function updateSingleProfileCumulative(profileName) {
            const profile = profiles.find(function(entry) {
                return entry.name === profileName;
            });

            if (!profile || profile.type !== 'single') {
                return;
            }

            const cumulativePoints = getCumulativePoints(profile.results.slice(0, 10));
            cumulativePoints.forEach(function(points, index) {
                const cumulativeElement = document.getElementById(`singleCumulative${index + 1}`);
                if (cumulativeElement) {
                    cumulativeElement.textContent = `${points} P`;
                }
            });
        }

        function updateComparisonRowStates(profileName) {
            const profile = profiles.find(function(entry) {
                return entry.name === profileName;
            });
            if (!profile || profile.type !== 'comparison') {
                return;
            }

            for (let i = 0; i < 10; i++) {
                const leftColumn = document.getElementById(`comparisonLeftColumn${i + 1}`);
                const rightColumn = document.getElementById(`comparisonRightColumn${i + 1}`);
                const leftPoints = parseInt(profile.results[i] || '0', 10);
                const rightPoints = parseInt(profile.results[i + 10] || '0', 10);

                if (leftColumn) {
                    leftColumn.classList.remove('is-leading');
                }
                if (rightColumn) {
                    rightColumn.classList.remove('is-leading');
                }

                if (leftPoints > rightPoints) {
                    if (leftColumn) {
                        leftColumn.classList.add('is-leading');
                    }
                } else if (rightPoints > leftPoints) {
                    if (rightColumn) {

        function updateInstallHintVisibility() {
            const hint = document.getElementById('installHint');
            const text = document.getElementById('installHintText');
            const button = document.getElementById('installHintButton');
            if (!hint || !text || !button) {
                return;
            }

            const wasDismissed = localStorage.getItem(installHintDismissKey) === '1';
            const shouldShow = isMobileInstallContext() && !isRunningStandalone() && !wasDismissed;

            if (!shouldShow) {
                hideInstallHint(false);
                return;
            }

            if (deferredInstallPrompt) {
                text.textContent = 'Die App kann direkt auf dem Homescreen abgelegt werden und ist dann noch schneller erreichbar.';
                button.style.display = 'inline-flex';
                button.textContent = 'Installieren';

                text.textContent = 'In Safari kannst du unten auf Teilen tippen und dann "Zum Home-Bildschirm" wählen.';
                button.style.display = 'none';
            } else {
                text.textContent = 'Du kannst diese Seite als App auf dem Startbildschirm speichern, wenn dein Browser das unterstützt.';

        // Beispielprofil-Daten
        const profiles = [];

        function saveRankingsToLocalStorage() {
            localStorage.setItem('rankings', JSON.stringify(rankings));
        }

        function loadRankingsFromLocalStorage() {
            rankings.splice(0, rankings.length);
            const savedRankings = localStorage.getItem('rankings');

            if (!savedRankings) {
                return;
            }

            try {
                JSON.parse(savedRankings).forEach(ranking => {
                    if (!ranking || typeof ranking.name !== 'string') {
                        return;
                    }

                    const sanitizedName = sanitizeProfileName(ranking.name);
                    if (!sanitizedName) {
                        return;
                    }

                    const selectedProfiles = Array.isArray(ranking.selectedProfiles)
                        ? ranking.selectedProfiles
                            .map(profileName => sanitizeProfileName(profileName))
                            .filter(profileName => !!profileName)
                        : [];

                    rankings.push({
                        name: sanitizedName,
                        selectedProfiles: selectedProfiles,
                        createdAt: ranking.createdAt || new Date().toISOString()
                    });
                });
            } catch (error) {
                console.error('Rankings konnten nicht aus dem localStorage geladen werden:', error);
                localStorage.removeItem('rankings');
            }
        }

        function getProfileIndex(profileName) {
            return profiles.findIndex(p => p.name === profileName);
        }

        function getInputName(index) {
            return [
                '100m', 'Weit', 'Kugel', 'Hoch', '400m',
                '110mH', 'Diskus', 'Stab', 'Speer', '1500m'
            ][index - 1];
        }

        function displayProfileResults(profileName) {
            const profile = profiles.find(p => p.name === profileName);
            if (!profile) return;
            ensureProfileShape(profile);

            // Leeren der vorhandenen Labels
            const labelsContainer = document.querySelector('.labels-container');
            labelsContainer.innerHTML = '';

            if (profile.type === 'single') {
                // Funktion zum Anzeigen von Einzelprofilen
                displaySingleProfile(profile);
            } else if (profile.type === 'comparison') {
                // Funktion zum Anzeigen von Vergleichsprofilen
                displayComparisonProfile(profile);
            }
        }

        function getRankingByName(rankingName) {
            return rankings.find(ranking => ranking.name === rankingName) || null;
        }

        function getSortedRankingEntries(ranking) {
            if (!ranking || !Array.isArray(ranking.selectedProfiles)) {
                return [];
            }

            return ranking.selectedProfiles
                .map(profileName => profiles.find(profile => profile.name === profileName && profile.type === 'single'))
                .filter(Boolean)
                .map(profile => {
                    ensureProfileShape(profile);
                    const totalPoints = getTotalPointsFromResults(profile.results.slice(0, 10));
                    profile.totalPoints = totalPoints;

                    return {
                        name: profile.name,
                        values: profile.values.slice(0, 10),
                        results: profile.results.slice(0, 10),
                        totalPoints: totalPoints
                    };
                })
                .sort((entryA, entryB) => {
                    if (entryB.totalPoints !== entryA.totalPoints) {
                        return entryB.totalPoints - entryA.totalPoints;
                    }

                    return entryA.name.localeCompare(entryB.name, 'de');
                });
        }

        function buildDescendingRanks(values) {
            const sortedValues = Array.from(new Set(values.slice().sort(function(a, b) {
                return b - a;
            })));

            return values.map(function(value) {
                return sortedValues.indexOf(value) + 1;
            });
        }

        function getCumulativePoints(results) {
            let runningTotal = 0;
            return results.map(function(result) {
                runningTotal += parseInt(result || '0', 10);
                return runningTotal;
            });
        }

        function ensureDropIndicator() {
            if (!dropIndicator) {
                dropIndicator = document.createElement('div');
                dropIndicator.className = 'profile-drop-indicator';
            }
            return dropIndicator;
        }

        function removeDropIndicator() {
            if (dropIndicator && dropIndicator.parentNode) {
                dropIndicator.parentNode.removeChild(dropIndicator);
            }
        }

        function getDropIndexByY(clientY) {
            const items = getProfileItems(false);
            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();
                if (clientY < rect.top + (rect.height / 2)) {
                    return i;
                }
            }
            return items.length;
        }

        function placeDropIndicator(dropIndex) {
            const profileList = getProfileListElement();
            const indicator = ensureDropIndicator();
            const items = getProfileItems(false);
            const targetItem = items[dropIndex];

            removeDropIndicator();

            if (targetItem) {
                profileList.insertBefore(indicator, targetItem);
            } else {
                profileList.appendChild(indicator);
            }
        }

        function reorderProfilesBySidebarOrder() {
            const orderedNames = getProfileItems(true).map(item => item.dataset.profileName);
            const profileMap = new Map(profiles.map(profile => [profile.name, profile]));
            const reorderedProfiles = [];

            orderedNames.forEach(name => {
                if (profileMap.has(name)) {
                    reorderedProfiles.push(profileMap.get(name));
                    profileMap.delete(name);
                }
            });

            profiles.splice(0, profiles.length, ...reorderedProfiles, ...Array.from(profileMap.values()));
            saveProfilesToLocalStorage();
        }

        function initializeSidebarDragAndDrop() {
            const profileList = getProfileListElement();
            if (profileList.dataset.dndInitialized === 'true') return;

            profileList.addEventListener('dragover', function(event) {
                event.preventDefault();
                if (!draggedProfileName) return;
                placeDropIndicator(getDropIndexByY(event.clientY));
            });

            profileList.addEventListener('drop', function(event) {
                event.preventDefault();
                if (!draggedProfileName) return;

                const draggedItem = findProfileItemByName(draggedProfileName);
                if (!draggedItem) {
                    removeDropIndicator();
                    draggedProfileName = null;
                    return;
                }

                const dropIndex = getDropIndexByY(event.clientY);
                const itemsWithoutDragged = getProfileItems(false).filter(item => item.dataset.profileName !== draggedProfileName);
                const referenceItem = itemsWithoutDragged[dropIndex];

                if (referenceItem) {
                    profileList.insertBefore(draggedItem, referenceItem);
                } else {
                    profileList.appendChild(draggedItem);
                }

                draggedItem.classList.remove('dragging');
                removeDropIndicator();
                draggedProfileName = null;
                reorderProfilesBySidebarOrder();
            });

            profileList.addEventListener('dragleave', function(event) {
                if (!profileList.contains(event.relatedTarget)) {
                    removeDropIndicator();
                }
            });

            profileList.dataset.dndInitialized = 'true';
        }

            // Prüfen ob Profil bereits in `profiles` existiert
            if (!existingProfile) {
                let resultsArray = Array(10).fill('');
                let valuesArray = Array(10).fill('');

                // Wenn es sich um ein Vergleichsprofil handelt, erweitern Sie die Arrays
                if (type === 'comparison') {

                // Hinzufügen des Profils zur internen Profil-Liste
                profiles.push({ name: profileName, results: resultsArray, values: valuesArray, type: type });
                saveProfilesToLocalStorage(); // Speichern der Profile im `localStorage`
            } else {
                ensureProfileShape(existingProfile);
            }

            updateSidebarEmptyStates();

        function createAthleteComparisonProfile(athlete1, athlete2) {
            athlete1 = sanitizeProfileName(athlete1);
            athlete2 = sanitizeProfileName(athlete2);

            if (!athlete1 || !athlete2) {
                alert('Bitte wählen Sie zwei Athleten aus.');
                return;
            }

            if (athlete1 === athlete2) {
                alert('Bitte wählen Sie zwei unterschiedliche Athleten aus.');
                return;
            }

            const profileName = `${athlete1} vs. ${athlete2}`;

            // Erstellen Sie ein neues Profil für den Vergleich
            addProfileToSidebar(profileName, 'comparison');
            // Abrufen der einzelnen Athletenprofile
            const athlete1Profile = profiles.find(p => p.name === athlete1);
            const athlete2Profile = profiles.find(p => p.name === athlete2);
            if (!athlete1Profile || !athlete2Profile) {
                alert('Mindestens eines der ausgewählten Profile existiert nicht mehr.');
                return;
            }

            // Abrufen des neu erstellten Vergleichsprofils
            const comparisonProfile = profiles.find(p => p.name === profileName);
            if (!comparisonProfile) {
                return;
            }

            // Initialisieren der Arrays für Werte und Ergebnisse
            comparisonProfile.values = new Array(20).fill('');
            comparisonProfile.results = new Array(20).fill('0');

            comparisonProfile.totalPoints = {};
            comparisonProfile.totalPoints[athlete1] = 0;
            comparisonProfile.totalPoints[athlete2] = 0;

            // Befüllen der Arrays
            for (let i = 0; i < 10; i++) {
                comparisonProfile.values[i] = athlete1Profile.values[i] || '';
                comparisonProfile.values[i + 10] = athlete2Profile.values[i] || '';

                comparisonProfile.results[i] = athlete1Profile.results[i] || '0';
                comparisonProfile.results[i + 10] = athlete2Profile.results[i] || '0';
            }

            saveProfilesToLocalStorage();
            handleProfileButtonClick(profileName);
        }

        function renameSingleProfile(oldName, newName) {
            const sanitizedNewName = sanitizeProfileName(newName);
            if (!sanitizedNewName) {
                alert('Bitte geben Sie einen Profilnamen ein.');
                return false;
            }

            if (sanitizedNewName.includes(' vs. ')) {
                alert('Der Profilname darf "vs." nicht enthalten.');
                return false;
            }

            if (isReservedProfileName(sanitizedNewName, oldName)) {
                alert('Ein Profil oder Ranking mit diesem Namen existiert bereits.');
                return false;
            }

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentRanking = getRankingByName(currentTitle);
            const profile = profiles.find(function(existingProfile) {
                return existingProfile.name === oldName && existingProfile.type === 'single';
            });

            if (!profile) {
                return false;
            }

            profile.name = sanitizedNewName;
            updateProfileSidebarName(oldName, sanitizedNewName);

            profiles
                .filter(function(existingProfile) {
                    return existingProfile.type === 'comparison' && getComparisonAthletes(existingProfile.name).includes(oldName);
                })
                .forEach(function(comparisonProfile) {
                    const athletes = getComparisonAthletes(comparisonProfile.name).map(function(athleteName) {
                        return athleteName === oldName ? sanitizedNewName : athleteName;
                    });
                    const updatedComparisonName = athletes.join(' vs. ');
                    const previousComparisonName = comparisonProfile.name;
                    comparisonProfile.name = updatedComparisonName;
                    updateProfileSidebarName(previousComparisonName, updatedComparisonName);
                });

            rankings.forEach(function(ranking) {
                ranking.selectedProfiles = (ranking.selectedProfiles || []).map(function(profileName) {
                    return profileName === oldName ? sanitizedNewName : profileName;
                });
            });

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();

            if (currentTitle === oldName) {
                handleProfileButtonClick(sanitizedNewName);
            } else {
                const currentComparisonAthletes = getComparisonAthletes(currentTitle);
                if (currentComparisonAthletes.includes(oldName)) {
                    const updatedComparisonName = currentComparisonAthletes
                        .map(function(athleteName) {
                            return athleteName === oldName ? sanitizedNewName : athleteName;
                        })
                        .join(' vs. ');
                    handleProfileButtonClick(updatedComparisonName);
                } else if (currentRanking) {
                    openRankingResults(currentRanking.name);
                }
            }

            return true;
        }

        function deleteProfile(profileName) {
            // Name des zurzeit angezeigten Profils
            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);
            const currentRanking = getRankingByName(currentTitle);

            // Entfernen Sie das Profil aus der internen Profil-Liste
            const profileList = getProfileListElement();
            const profilesToDelete = profiles
                .filter(profile => profile.name === profileName || getComparisonAthletes(profile.name).includes(profileName))
                .map(profile => profile.name);

            profilesToDelete.forEach(name => {
                const index = profiles.findIndex(profile => profile.name === name);
                if (index !== -1) {
                    profiles.splice(index, 1);
                }

                const profileItem = findProfileItemByName(name);
                if (profileItem) {
                    profileList.removeChild(profileItem);
                }
            });

            saveProfilesToLocalStorage();
            updateSidebarEmptyStates();

            for (let i = rankings.length - 1; i >= 0; i--) {
                rankings[i].selectedProfiles = (rankings[i].selectedProfiles || [])
                    .filter(selectedProfileName => !profilesToDelete.includes(selectedProfileName));

                if (rankings[i].selectedProfiles.length === 0) {
                    deleteRanking(rankings[i].name);
                }
            }

            saveRankingsToLocalStorage();

            if (currentTitle === profileName || currentComparisonAthletes.includes(profileName)) {
                navigateToHome();
            } else if (currentRanking) {
                const updatedRanking = getRankingByName(currentRanking.name);
                if (updatedRanking) {
                    openRankingResults(updatedRanking.name);
                } else {
                    navigateToHome();
                }
            }
        }

        let initialX = null;
        let initialY = null;

        document.body.addEventListener('touchstart', function (e) {
            initialX = e.touches[0].clientX;
            initialY = e.touches[0].clientY;
        });

        document.body.addEventListener('touchmove', function (e) {
            if (initialX === null || initialY === null) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let diffX = currentX - initialX;
            let diffY = currentY - initialY;

            // Prüfen, ob die horizontale Bewegung größer ist als die vertikale
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    openNav(); // Öffnen der Sidebar durch Swipen nach rechts
                } else {
                    closeNav(); // Schließen der Sidebar durch Swipen nach links
                }
            }

            // Zurücksetzen der initialen Werte
            initialX = null;
            initialY = null;
        });
