            function renderRankingPointsChart() {
                const card = createAnalysisChartCard(
                    'Gesamtpunktzahl im Verlauf',
                    ''
                );
                chartHost.appendChild(card);
                const selectedEntries = getSelectedEntries();
                appendRankingChartToolbar(card);
                const visibleDisciplineCount = getVisibleAnalysisDisciplineCount(selectedEntries);
                const chartFrame = card.querySelector('.analysis-chart-frame');
                const minimumChartHeight = window.innerWidth <= 680 ? 600 : 680;
                chartFrame.style.height = `${Math.max(minimumChartHeight, selectedEntries.length * 28 + 180)}px`;
                const defaults = getAnalysisChartDefaults();
                defaults.plugins.legend.display = false;
                defaults.layout = { padding: { right: window.innerWidth <= 680 ? 62 : 78 } };
                defaults.plugins.tooltip.callbacks = {
                    label: function(context) {
                        return `${context.dataset.label}: ${context.parsed.y} P`;
                    },
                    afterLabel: function(context) {
                        if (context.dataIndex === 0) {
                            return '';
                        }
                        const index = context.dataIndex - 1;
                        return `${context.dataset.performances[index] || '—'} · ${context.dataset.disciplinePoints[index] || 0} P`;
                    }
                };
                defaults.scales = {
                    x: Object.assign(getAnalysisScaleDefaults(), { grid: { display: false } }),
                    y: Object.assign(getAnalysisScaleDefaults(), {
                        beginAtZero: true,
                        title: { display: true, text: 'Punktzahl', color: '#aeb8c0' }
                    })
                };
                enableAnalysisLineFocus(defaults);

                const finalScoreLabelsPlugin = {
                    id: 'rankingFinalScoreLabels',
                    afterDatasetsDraw: function(chart) {
                        const labelItems = chart.data.datasets.map(function(dataset, datasetIndex) {
                            let pointIndex = dataset.data.length - 1;
                            while (pointIndex >= 0 && dataset.data[pointIndex] === null) {
                                pointIndex -= 1;
                            }
                            const point = chart.getDatasetMeta(datasetIndex).data[pointIndex];
                            if (!point) {
                                return null;
                            }
                            return {
                                color: dataset.borderColor,
                                point: point,
                                score: dataset.finalScore,
                                targetY: point.y,
                                labelY: point.y
                            };
                        }).filter(Boolean).sort(function(first, second) {
                            return first.targetY - second.targetY;
                        });

                        if (labelItems.length === 0) {
                            return;
                        }

                        const top = chart.chartArea.top + 7;
                        const bottom = chart.chartArea.bottom - 7;
                        const spacing = labelItems.length > 1
                            ? Math.min(18, (bottom - top) / (labelItems.length - 1))
                            : 0;
                        labelItems[0].labelY = Math.max(top, labelItems[0].targetY);
                        for (let index = 1; index < labelItems.length; index++) {
                            labelItems[index].labelY = Math.max(
                                labelItems[index].targetY,
                                labelItems[index - 1].labelY + spacing
                            );
                        }
                        if (labelItems[labelItems.length - 1].labelY > bottom) {
                            labelItems[labelItems.length - 1].labelY = bottom;
                            for (let index = labelItems.length - 2; index >= 0; index--) {
                                labelItems[index].labelY = Math.min(
                                    labelItems[index].labelY,
                                    labelItems[index + 1].labelY - spacing
                                );
                            }
                        }

                        const context = chart.ctx;
                        const labelX = chart.width - 7;
                        const connectorX = labelX - (window.innerWidth <= 680 ? 48 : 58);
                        context.save();
                        context.font = `bold ${window.innerWidth <= 680 ? 9 : 11}px Roboto`;
                        context.textAlign = 'right';
                        context.textBaseline = 'middle';
                        labelItems.forEach(function(item) {
                            context.strokeStyle = item.color;
                            context.fillStyle = item.color;
                            context.lineWidth = 1;
                            context.beginPath();
                            context.moveTo(item.point.x + 4, item.point.y);
                            context.lineTo(connectorX, item.labelY);
                            context.stroke();
                            context.fillText(`${item.score} P`, labelX, item.labelY);
                        });
                        context.restore();
                    }
                };

                createAnalysisChart(card, {
                    type: 'line',
                    data: {
                        labels: ['Start'].concat(Array.from({ length: visibleDisciplineCount }, function(_, index) {
                            return getInputName(index + 1);
                        })),
                        datasets: selectedEntries.map(function(entry) {
                            const entryIndex = entries.findIndex(function(candidate) { return candidate.name === entry.name; });
                            const color = getEntryColor(entry.name);
                            return {
                                label: entry.name,
                                data: getAnalysisCumulativeSeries(entry.results, entry.values, true).slice(0, visibleDisciplineCount + 1),
                                finalScore: getTotalPointsFromResults(entry.results),
                                performances: entry.values.slice(0, visibleDisciplineCount),
                                disciplinePoints: entry.results.slice(0, visibleDisciplineCount),
                                analysisBaseColor: color,
                                borderColor: color,
                                backgroundColor: color,
                                pointBackgroundColor: color,
                                pointBorderColor: color,
                                pointStyle: getAnalysisPointStyle(entryIndex),
                                pointRadius: function(context) {
                                    return context.dataIndex === visibleDisciplineCount ? 6 : 4;
                                },
                                pointHoverRadius: 6,
                                borderWidth: 2.3,
                                borderDash: getAnalysisLineDash(entryIndex),
                                tension: 0.16,
                                spanGaps: false
                            };
                        })
                    },
                    options: defaults,
                    plugins: [finalScoreLabelsPlugin]
                }, `Kumulierter Punkteverlauf im Ranking ${ranking.name}.`);
            }

            function renderRankingPlacesChart() {
                const card = createAnalysisChartCard(
                    'Platzierungsverlauf',
                    ''
                );
                chartHost.appendChild(card);
                const selectedEntries = getSelectedEntries();
                appendRankingChartToolbar(card);
                const visibleDisciplineCount = getVisibleAnalysisDisciplineCount(selectedEntries);
                const cumulativeByEntry = entries.map(function(entry) {
                    return getCumulativePoints(entry.results);
                });
                const ranksByDiscipline = Array.from({ length: 10 }, function(_, disciplineIndex) {
                    return buildDescendingRanks(cumulativeByEntry.map(function(values) {
                        return values[disciplineIndex];
                    }));
                });
                const defaults = getAnalysisChartDefaults();
                defaults.plugins.legend.display = false;
                defaults.plugins.tooltip.callbacks = {
                    label: function(context) {
                        const entryIndex = context.dataset.entryIndex;
                        const disciplineIndex = context.dataIndex;
                        return `${context.dataset.label}: Platz ${context.parsed.y} · ${cumulativeByEntry[entryIndex][disciplineIndex]} P`;
                    }
                };
                defaults.scales = {
                    x: Object.assign(getAnalysisScaleDefaults(), { grid: { display: false } }),
                    y: Object.assign(getAnalysisScaleDefaults(), {
                        min: 1,
                        max: entries.length,
                        reverse: true,
                        ticks: Object.assign({}, getAnalysisScaleDefaults().ticks, { stepSize: 1, precision: 0 }),
                        title: { display: true, text: 'Platz', color: '#aeb8c0' }
                    })
                };
                enableAnalysisLineFocus(defaults);

                createAnalysisChart(card, {
                    type: 'line',
                    data: {
                        labels: Array.from({ length: visibleDisciplineCount }, function(_, index) { return getInputName(index + 1); }),
                        datasets: selectedEntries.map(function(entry) {
                            const entryIndex = entries.findIndex(function(candidate) { return candidate.name === entry.name; });
                            const color = getEntryColor(entry.name);
                            return {
                                label: entry.name,
                                entryIndex: entryIndex,
                                data: ranksByDiscipline.slice(0, visibleDisciplineCount).map(function(ranks, disciplineIndex) {
                                    return hasAnalysisPerformance(entry.values[disciplineIndex]) ? ranks[entryIndex] : null;
                                }),
                                analysisBaseColor: color,
                                borderColor: color,
                                backgroundColor: color,
                                pointBackgroundColor: color,
                                pointBorderColor: color,
                                pointStyle: getAnalysisPointStyle(entryIndex),
                                pointRadius: 4,
                                pointHoverRadius: 6,
                                borderWidth: 2.3,
                                borderDash: getAnalysisLineDash(entryIndex),
                                tension: 0.12,
                                spanGaps: false
                            };
                        })
                    },
                    options: defaults
                }, `Platzierungsverlauf im Ranking ${ranking.name}.`);
            }

            renderRankingAnalysisChart();
            animateViewEntrance(view);
            updateResponsiveAppTitles();
        }

        function formatEuropeanChampionshipPoints(value) {
            return Number.isFinite(Number(value)) && Number(value) > 0
                ? Number(value).toLocaleString('de-DE')
                : '–';
        }

        function calculateEuropeanChampionshipDisciplinePoints(mark, disciplineIndex) {
            if (!mark) {
                return null;
            }
            const disciplineType = getDisciplineType(disciplineIndex + 1);
            const performance = parsePerformanceValue(mark, disciplineType);
            if (performance == null) {
                return null;
            }
            const abcValues = getABCValues(disciplineIndex + 1);
            return calculateDecathlonPoints(
                disciplineType,
                performance,
                abcValues[0],
                abcValues[1],
                abcValues[2]
            );
        }

                    const stickyOffset = parseFloat(getComputedStyle(document.documentElement)

                    const targetTop = Math.max(

                return entries.map(function(entry) {

                });
            });
            const disciplineRanksByIndex = disciplinePointsByIndex.map(function(pointValues) {
                return buildDescendingRanks(pointValues);
            });
            const cumulativePointsByEntry = entries.map(function(entry) {
                return getCumulativePoints(entry.results);
            });
            const cumulativeRanksByIndex = Array.from({ length: 10 }, function(_, disciplineIndex) {
                return buildDescendingRanks(cumulativePointsByEntry.map(function(cumulativeValues) {
                    return cumulativeValues[disciplineIndex];
                }));
            });
            const disciplineTopRanksByIndex = disciplinePointsByIndex.map(function(pointValues) {
                const uniqueValues = Array.from(new Set(pointValues.filter(function(value) {
                    return value > 0;
                }).sort(function(a, b) {
                    return b - a;
                }))).slice(0, 3);
                return uniqueValues;
            });

            const headerRow = document.createElement('div');

            const athleteHeader = document.createElement('div');
            athleteHeader.className = 'ranking-cell ranking-athlete';
            athleteHeader.textContent = '';

            for (let i = 1; i <= 10; i++) {

                disciplineHeader.className = 'ranking-cell ranking-discipline-header';
                disciplineHeader.textContent = getInputName(i);
                headerRow.appendChild(disciplineHeader);
            }

            const totalHeader = document.createElement('div');
            totalHeader.className = 'ranking-cell ranking-total';
            totalHeader.textContent = 'Punkte';
            headerRow.appendChild(totalHeader);
            table.appendChild(headerRow);

            entries.forEach((entry, index) => {
                const row = document.createElement('div');
                row.className = 'ranking-row';

                const totalLeader = entries[0].totalPoints;
                const totalBehind = totalLeader - entry.totalPoints;

                const athleteCell = document.createElement('div');
                athleteCell.className = 'ranking-cell ranking-athlete';

                const place = document.createElement('div');
                place.className = 'ranking-place';
                place.textContent = `${index + 1}.`;
                athleteCell.appendChild(place);

                const name = document.createElement('div');
                name.className = 'ranking-name';
                name.textContent = entry.name;
                athleteCell.appendChild(name);
                row.appendChild(athleteCell);

                entry.values.forEach((value, valueIndex) => {
                    const valueCell = document.createElement('div');
                    valueCell.className = 'ranking-cell ranking-value-cell';
                    const currentPoints = parseInt(entry.results[valueIndex] || '0', 10);
                    const disciplineRank = disciplineRanksByIndex[valueIndex][index];
                    const cumulativePoints = cumulativePointsByEntry[index][valueIndex];
                    const cumulativeRank = cumulativeRanksByIndex[valueIndex][index];

                    if (entries.length > 1 && currentPoints > 0) {
                        const topValues = disciplineTopRanksByIndex[valueIndex];
                        if (topValues[0] === currentPoints) {
                            valueCell.classList.add('is-best');
                        } else if (entries.length >= 4 && topValues[1] === currentPoints) {
                            valueCell.classList.add('is-second-best');
                        } else if (entries.length >= 4 && topValues[2] === currentPoints) {
                            valueCell.classList.add('is-third-best');
                        }
                    }

                    const points = document.createElement('div');
                    points.className = 'ranking-value';
                    points.textContent = `${currentPoints} P`;
                    valueCell.appendChild(points);

                    const performance = document.createElement('div');
                    performance.className = 'ranking-subvalue ranking-performance';
                    performance.appendChild(document.createTextNode(value || '—'));

                    const isHighlightedDisciplineRank = currentPoints > 0 && disciplineRank >= 1 && disciplineRank <= 3;

                    if (isHighlightedDisciplineRank) {
                        performance.appendChild(document.createTextNode(' '));
                    } else {
                        performance.appendChild(document.createTextNode(' ('));
                    }

                    const disciplineRankElement = document.createElement('span');
                    disciplineRankElement.textContent = isHighlightedDisciplineRank ? disciplineRank : `${disciplineRank}.`;
                    if (isHighlightedDisciplineRank) {
                        disciplineRankElement.className = 'ranking-discipline-rank';
                    }

                    if (isHighlightedDisciplineRank && disciplineRank === 1) {
                        disciplineRankElement.classList.add('is-gold');
                    } else if (isHighlightedDisciplineRank && disciplineRank === 2) {
                        disciplineRankElement.classList.add('is-silver');
                    } else if (isHighlightedDisciplineRank && disciplineRank === 3) {
                        disciplineRankElement.classList.add('is-bronze');
                    }
                    performance.appendChild(disciplineRankElement);
                    if (!isHighlightedDisciplineRank) {
                        performance.appendChild(document.createTextNode(')'));
                    }
                    valueCell.appendChild(performance);

                    const cumulative = document.createElement('div');
                    cumulative.className = 'ranking-subvalue ranking-cumulative';
                    cumulative.textContent = `${cumulativePoints} P (${cumulativeRank}.)`;
                    valueCell.appendChild(cumulative);

                    row.appendChild(valueCell);
                });

                const totalCell = document.createElement('div');
                totalCell.className = 'ranking-cell ranking-total';
                totalCell.style.flexDirection = 'column';
                totalCell.style.gap = '4px';
                totalCell.style.justifyContent = 'center';
                totalCell.style.alignItems = 'flex-end';

                const totalValue = document.createElement('div');
                totalValue.className = 'ranking-total-points';
                totalValue.textContent = `${entry.totalPoints} P`;
                totalCell.appendChild(totalValue);

                if (index !== 0) {
                    const totalMeta = document.createElement('div');
                    totalMeta.className = 'ranking-total-meta';
                    totalMeta.textContent = `-${totalBehind} P`;
                    totalCell.appendChild(totalMeta);
                }

                row.appendChild(totalCell);
                table.appendChild(row);
            });

            scrollWrapper.appendChild(table);
            rankingView.appendChild(scrollWrapper);
            labelsContainer.appendChild(rankingView);
            attachRankingScrollEnhancements(rankingView, scrollWrapper);
            animateViewEntrance(rankingView);
        }

        function closeSidebarActionMenus(exceptMenu = null) {
            document.querySelectorAll('.sidebar-action-menu.is-open').forEach(function(menu) {
                if (menu === exceptMenu) {
                    return;
                }
                menu.classList.remove('is-open');
                const entry = menu.closest('.sidebar-entry, .archive-folder-entry');
                if (entry) {
                    entry.classList.remove('has-open-menu');
                }
                const toggle = menu.parentElement && menu.parentElement.querySelector('.sidebar-more-button');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        function createSidebarActionMenu(actions, label = 'Weitere Optionen') {
            const control = document.createElement('div');
            control.className = 'sidebar-action-control';

            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'sidebar-action-button sidebar-more-button';
            toggle.textContent = '⋮';
            toggle.setAttribute('aria-label', label);
            toggle.setAttribute('aria-haspopup', 'menu');
            toggle.setAttribute('aria-expanded', 'false');
            control.appendChild(toggle);

            const menu = document.createElement('div');
            menu.className = 'sidebar-action-menu';
            menu.setAttribute('role', 'menu');

            actions.forEach(function(action) {
                const actionButton = document.createElement('button');
                actionButton.type = 'button';
                actionButton.textContent = action.label;
                actionButton.setAttribute('role', 'menuitem');
                if (action.className) {
                    actionButton.classList.add(action.className);
                }
                if (action.danger) {
                    actionButton.classList.add('is-danger');
                }
                actionButton.onclick = function(event) {
                    event.stopPropagation();
                    closeSidebarActionMenus();
                    action.handler();
                };
                menu.appendChild(actionButton);
            });

            toggle.onclick = function(event) {
                event.stopPropagation();
                const willOpen = !menu.classList.contains('is-open');
                closeSidebarActionMenus(willOpen ? menu : null);
                menu.classList.toggle('is-open', willOpen);
                const entry = menu.closest('.sidebar-entry, .archive-folder-entry');
                if (entry) {
                    entry.classList.toggle('has-open-menu', willOpen);
                }
                toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
            };
            menu.onclick = function(event) {
                event.stopPropagation();
            };

            control.appendChild(menu);
            return control;
        }

        function getDropIndexByYForItems(items, clientY) {
            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();
                if (clientY < rect.top + (rect.height / 2)) {
                    return i;
                }
            }

                .map(function(item) {

                    return folderName !== '';
                });

            archiveFolderOrder.splice(0, archiveFolderOrder.length, ...orderedFolders);
            saveArchiveFolderOrderToLocalStorage();

        function reorderArchivedProfilesBySidebarOrder(folderName) {
            const normalizedFolderName = normalizeArchiveFolderName(folderName);
            const orderedNames = getArchiveProfileItems(true).map(function(item) {
                return item.dataset.profileName;
            });
            const profileMap = new Map(profiles.map(function(profile) {
                return [profile.name, profile];
            }));
            const reorderedFolderProfiles = [];
            const remainingProfiles = [];

            orderedNames.forEach(function(profileName) {
                const profile = profileMap.get(profileName);
                if (profile) {
                    reorderedFolderProfiles.push(profile);
                    profileMap.delete(profileName);
                }
            });

            profiles.forEach(function(profile) {
                if (!profileMap.has(profile.name)) {
                    return;
                }

                if (profile.archived === true && normalizeArchiveFolderName(profile.archiveFolder) === normalizedFolderName) {
                    return;
                }

                remainingProfiles.push(profile);
            });

            profiles.splice(0, profiles.length, ...remainingProfiles, ...reorderedFolderProfiles);
            saveProfilesToLocalStorage();
        }

        function initializeArchiveProfileDragAndDrop(profileList, folderName) {
            if (!profileList || profileList.dataset.archiveProfileDndInitialized === 'true') {
                return;
            }

            profileList.addEventListener('dragover', function(event) {
                event.preventDefault();
                if (!draggedArchiveProfileName) {
                    return;
                }

                const items = Array.from(profileList.querySelectorAll('.archive-profile-item:not(.dragging)'));
                placeArchiveDropIndicator(profileList, items, getDropIndexByYForItems(items, event.clientY));
            });

            profileList.addEventListener('drop', function(event) {
                event.preventDefault();
                if (!draggedArchiveProfileName) {
                    return;
                }

                const draggedItem = profileList.querySelector('.archive-profile-item.dragging');
                if (!draggedItem) {
                    removeDropIndicator();
                    draggedArchiveProfileName = null;
                    return;
                }

                const items = Array.from(profileList.querySelectorAll('.archive-profile-item:not(.dragging)'));
                const dropIndex = getDropIndexByYForItems(items, event.clientY);
                const referenceItem = items[dropIndex];

                if (referenceItem) {
                    profileList.insertBefore(draggedItem, referenceItem);
                } else {
                    profileList.appendChild(draggedItem);
                }

                draggedItem.classList.remove('dragging');
                removeDropIndicator();
                draggedArchiveProfileName = null;
                reorderArchivedProfilesBySidebarOrder(folderName);
            });

            profileList.addEventListener('dragleave', function(event) {
                if (!profileList.contains(event.relatedTarget)) {
                    removeDropIndicator();
                }
            });

            profileList.dataset.archiveProfileDndInitialized = 'true';
        }

                    return;
                }

                event.preventDefault();
                const draggedItem = getArchiveFolderItems(true).find(function(item) {
                    return item.dataset.folderName === draggedArchiveFolderName;
                });

                if (!draggedItem) {
                    removeDropIndicator();
                    draggedArchiveFolderName = null;
                    return;
                }

                const items = getArchiveFolderItems(false);
                const dropIndex = getDropIndexByYForItems(items, event.clientY);
                const referenceItem = items[dropIndex];

                if (referenceItem) {
                    archiveSection.insertBefore(draggedItem, referenceItem);
                } else {
                    archiveSection.appendChild(draggedItem);
                }

                draggedItem.classList.remove('dragging');
                removeDropIndicator();
                draggedArchiveFolderName = null;
                reorderArchiveFoldersBySidebarOrder();
            });

            archiveSection.addEventListener('dragleave', function(event) {

        function deleteArchiveFolder(folderName) {
            const normalizedFolderName = normalizeArchiveFolderName(folderName);
            const folderProfileNames = getArchiveFolderProfileNames(normalizedFolderName);
            if (folderProfileNames.length === 0) {
                return false;
            }

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);
            const currentRanking = getRankingByName(currentTitle);
            const profilesToDelete = profiles
                .filter(function(profile) {
                    return folderProfileNames.includes(profile.name)
                        || folderProfileNames.some(function(profileName) {
                            return getComparisonAthletes(profile.name).includes(profileName);
                        });
                })
                .map(function(profile) {
                    return profile.name;
                });

            removeProfilesByName(profilesToDelete);

            for (let i = rankings.length - 1; i >= 0; i--) {
                rankings[i].selectedProfiles = (rankings[i].selectedProfiles || [])
                    .filter(function(selectedProfileName) {
                        return !profilesToDelete.includes(selectedProfileName);
                    });

                const isDeletedArchiveFolderRanking = rankings[i].type === 'archive'
                    && normalizeArchiveFolderName(rankings[i].archiveFolder) === normalizedFolderName;

                if (isDeletedArchiveFolderRanking || rankings[i].selectedProfiles.length === 0) {
                    deleteRanking(rankings[i].name);
                }
            }

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            const folderOrderIndex = archiveFolderOrder.indexOf(normalizedFolderName);
            if (folderOrderIndex !== -1) {
                archiveFolderOrder.splice(folderOrderIndex, 1);
                saveArchiveFolderOrderToLocalStorage();
            }
            if (sidebarMode === 'archive-folder' && activeArchiveFolder === normalizedFolderName) {
                sidebarMode = 'archive';
                activeArchiveFolder = '';
            }
            updateSidebarEmptyStates();

            if (profilesToDelete.includes(currentTitle) || currentComparisonAthletes.some(function(profileName) {
                return profilesToDelete.includes(profileName);
            })) {
                navigateToHome();
            } else if (currentRanking) {
                const updatedRanking = getRankingByName(currentRanking.name);
                if (updatedRanking) {
                    openRankingResults(updatedRanking.name);
                } else {
                    navigateToHome();
                }
            }

            return true;
        }

            emptyState.dataset.emptyType = type;

            const text = document.createElement('div');
            if (type === 'profile') {
                text.textContent = 'Noch keine Profile angelegt.';
            } else if (type === 'comparison') {
                text.textContent = 'Noch keine Head-to-Head-Profile angelegt.';
            } else if (type === 'archive') {
                text.textContent = 'Noch keine Profile archiviert.';
            } else {
                text.textContent = 'Noch keine Rankings gespeichert.';
            }
            emptyState.appendChild(text);

            const activeProfileCount = getActiveSingleProfiles().length;
            let action = null;

            if (type === 'profile') {
                action = {
                    label: 'Neues Profil',
                    icon: 'imgs/new_profile.png',
                    iconAlt: 'Profil hinzufügen',
                    handler: openProfileWindow
                };
            } else if (type === 'comparison' && activeProfileCount >= 2) {
                action = {
                    label: 'Head to Head erstellen',
                    icon: 'imgs/comparison.png',
                    iconAlt: 'Head to Head erstellen',
                    handler: openAthleteComparison
                };
            } else if (type === 'ranking' && activeProfileCount >= 1) {
                action = {
                    label: 'Ranking erstellen',
                    icon: 'imgs/table_icon.png',
                    iconAlt: 'Ranking erstellen',
                    handler: openRanking

        function archiveProfile(profileName, folderName = '') {
            const profile = profiles.find(existingProfile => existingProfile.name === profileName && existingProfile.type === 'single');
            if (!profile) {
                return false;
            }

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);
            const currentRanking = getRankingByName(currentTitle);
            const comparisonProfilesToDelete = profiles
                .filter(existingProfile => existingProfile.type === 'comparison' && getComparisonAthletes(existingProfile.name).includes(profileName))
                .map(existingProfile => existingProfile.name);

            profile.archived = true;
            profile.archiveFolder = normalizeArchiveFolderName(folderName);
            if (profile.archiveFolder && !archiveFolderOrder.includes(profile.archiveFolder)) {
                archiveFolderOrder.push(profile.archiveFolder);
                saveArchiveFolderOrderToLocalStorage();
            }

            const profileItem = findProfileItemByName(profileName);
            if (profileItem && profileItem.parentNode) {
                profileItem.parentNode.removeChild(profileItem);
            }

            removeProfilesByName(comparisonProfilesToDelete);
            cleanupRankingsAfterProfileArchive(profileName);

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            if (sidebarMode === 'archive-folder' && getArchiveFolderProfiles(activeArchiveFolder).length === 0) {
                sidebarMode = 'archive';
                activeArchiveFolder = '';
            }
            updateSidebarEmptyStates();

            if (currentTitle === profileName || currentComparisonAthletes.includes(profileName)) {
                navigateToHome();
            } else if (currentRanking) {
                const updatedRanking = getRankingByName(currentRanking.name);
                if (updatedRanking) {
                    openRankingResults(updatedRanking.name);
                } else {
                    navigateToHome();
                }
            }

            return true;
        }

        function ensureDropIndicator() {
            if (!dropIndicator) {
                dropIndicator = document.createElement('div');
                dropIndicator.className = 'profile-drop-indicator';
            }
            return dropIndicator;
        }

        function removeDropIndicator() {
            if (dropIndicator && dropIndicator.parentNode) {
                dropIndicator.parentNode.removeChild(dropIndicator);
            }
        }

        function getDropIndexByY(clientY, profileList) {
            const items = Array.from(profileList.querySelectorAll('.profile-item:not(.dragging)'));
            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();
                if (clientY < rect.top + (rect.height / 2)) {
                    return i;
                }
            }
            return items.length;
        }

        function placeDropIndicator(dropIndex, profileList) {
            const indicator = ensureDropIndicator();
            const items = Array.from(profileList.querySelectorAll('.profile-item:not(.dragging)'));
            const targetItem = items[dropIndex];

            removeDropIndicator();

            if (targetItem) {
                profileList.insertBefore(indicator, targetItem);
            } else {
                profileList.appendChild(indicator);
            }
        }

        function reorderProfilesBySidebarOrder() {
            const orderedNames = getProfileItems(true).map(item => item.dataset.profileName);
            const profileMap = new Map(profiles.map(profile => [profile.name, profile]));
            const reorderedProfiles = [];

            orderedNames.forEach(name => {
                if (profileMap.has(name)) {
                    reorderedProfiles.push(profileMap.get(name));
                    profileMap.delete(name);
                }
            });

            profiles.splice(0, profiles.length, ...reorderedProfiles, ...Array.from(profileMap.values()));
            saveProfilesToLocalStorage();
        }

        function initializeSidebarDragAndDrop() {
            [getProfileListElement(), getComparisonListElement()].forEach(function(profileList) {
                if (profileList.dataset.dndInitialized === 'true') {
                    return;
                }

                profileList.addEventListener('dragover', function(event) {
                    const draggedItem = findProfileItemByName(draggedProfileName);
                    if (!draggedItem || draggedItem.parentElement !== profileList) {
                        return;
                    }
                    event.preventDefault();
                    placeDropIndicator(getDropIndexByY(event.clientY, profileList), profileList);
                });

                profileList.addEventListener('drop', function(event) {
                    const draggedItem = findProfileItemByName(draggedProfileName);
                    if (!draggedItem || draggedItem.parentElement !== profileList) {
                        return;
                    }
                    event.preventDefault();

                    const dropIndex = getDropIndexByY(event.clientY, profileList);
                    const itemsWithoutDragged = Array.from(profileList.querySelectorAll('.profile-item:not(.dragging)'));
                    const referenceItem = itemsWithoutDragged[dropIndex];

                    if (referenceItem) {
                        profileList.insertBefore(draggedItem, referenceItem);
                    } else {
                        profileList.appendChild(draggedItem);
                    }

                    draggedItem.classList.remove('dragging');
                    removeDropIndicator();
                    draggedProfileName = null;
                    reorderProfilesBySidebarOrder();
                });

                profileList.addEventListener('dragleave', function(event) {
                    if (!profileList.contains(event.relatedTarget)) {
                        removeDropIndicator();
                    }
                });

                profileList.dataset.dndInitialized = 'true';
            });
        }

        // Hier können Sie die Funktion addProfileToSidebar anpassen, um neue Profile mit ihren eigenen Ergebnis-Arrays hinzuzufügen
        function addProfileToSidebar(profileName, type = 'single') {
            profileName = sanitizeProfileName(profileName);
            if (!profileName) {
                return null;
            }

            if (profileName === defaultTitle) {
                alert('Dieser Profilname ist bereits reserviert.');
                return null;
            }

            if (type === 'single' && profileName.includes(' vs. ')) {
                alert('Der Profilname darf "vs." nicht enthalten.');
                return null;
            }

            const existingProfile = profiles.find(p => p.name === profileName);
            const effectiveType = existingProfile ? existingProfile.type : type;
            const profileList = effectiveType === 'comparison'
                ? getComparisonListElement()
                : getProfileListElement();
            if (existingProfile && existingProfile.archived === true) {
                updateSidebarEmptyStates();
                return profileName;
            }

            // Prüfen ob Profil bereits in Sidebar existiert
            if (!getProfileItems(true).some(item => item.dataset.profileName === profileName)) {
                // Erstellen eines Containers für das Profil und den Lösch-Button
                const profileContainer = document.createElement('div');
                profileContainer.className = 'profile-item sidebar-entry';
                profileContainer.dataset.profileName = profileName;
                profileContainer.draggable = true;

                profileContainer.addEventListener('dragstart', function(event) {
                    if (event.target.closest('.sidebar-action-control')) {
                        event.preventDefault();
                        return;
                    }
                    draggedProfileName = profileName;
                    profileContainer.classList.add('dragging');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', profileName);
                });

                profileContainer.addEventListener('dragend', function() {
                    profileContainer.classList.remove('dragging');
                    removeDropIndicator();
                    draggedProfileName = null;
                });

                // Erstellen des Profil-Buttons
                const newButton = document.createElement('button');
                newButton.className = 'sidebar-main-button';
                newButton.onclick = function() {
                    handleProfileButtonClick(profileName);

        function createAthleteComparisonProfile(athlete1, athlete2) {
            athlete1 = sanitizeProfileName(athlete1);
            athlete2 = sanitizeProfileName(athlete2);

            if (!athlete1 || !athlete2) {
                alert('Bitte wählen Sie zwei Athleten aus.');
                return;
            }

            if (athlete1 === athlete2) {
                alert('Bitte wählen Sie zwei unterschiedliche Athleten aus.');
                return;
            }

            const profileName = `${athlete1} vs. ${athlete2}`;

            // Erstellen Sie ein neues Profil für den Vergleich
            addProfileToSidebar(profileName, 'comparison');
            // Abrufen der einzelnen Athletenprofile
            const athlete1Profile = profiles.find(p => p.name === athlete1);
            const athlete2Profile = profiles.find(p => p.name === athlete2);
            if (!athlete1Profile || !athlete2Profile) {
                alert('Mindestens eines der ausgewählten Profile existiert nicht mehr.');
                return;
            }

            // Abrufen des neu erstellten Vergleichsprofils
            const comparisonProfile = profiles.find(p => p.name === profileName);
            if (!comparisonProfile) {
                return;
            }

            // Initialisieren der Arrays für Werte und Ergebnisse
            comparisonProfile.values = new Array(20).fill('');
            comparisonProfile.results = new Array(20).fill('0');

            comparisonProfile.totalPoints = {};
            comparisonProfile.totalPoints[athlete1] = 0;
            comparisonProfile.totalPoints[athlete2] = 0;

            // Befüllen der Arrays
            for (let i = 0; i < 10; i++) {
                comparisonProfile.values[i] = athlete1Profile.values[i] || '';
                comparisonProfile.values[i + 10] = athlete2Profile.values[i] || '';

                comparisonProfile.results[i] = athlete1Profile.results[i] || '0';
                comparisonProfile.results[i + 10] = athlete2Profile.results[i] || '0';
            }

            saveProfilesToLocalStorage();
            handleProfileButtonClick(profileName);
        }

        function renameSingleProfile(oldName, newName) {
            const sanitizedNewName = sanitizeProfileName(newName);
            if (!sanitizedNewName) {
                alert('Bitte geben Sie einen Profilnamen ein.');
                return false;
            }

            if (sanitizedNewName.includes(' vs. ')) {
                alert('Der Profilname darf "vs." nicht enthalten.');
                return false;
            }

            if (isReservedProfileName(sanitizedNewName, oldName)) {
                alert('Ein Profil oder Ranking mit diesem Namen existiert bereits.');
                return false;
            }

            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentRanking = getRankingByName(currentTitle);
            const profile = profiles.find(function(existingProfile) {
                return existingProfile.name === oldName && existingProfile.type === 'single';
            });

            if (!profile) {
                return false;
            }

            profile.name = sanitizedNewName;
            updateProfileSidebarName(oldName, sanitizedNewName);

            profiles
                .filter(function(existingProfile) {
                    return existingProfile.type === 'comparison' && getComparisonAthletes(existingProfile.name).includes(oldName);
                })
                .forEach(function(comparisonProfile) {
                    const athletes = getComparisonAthletes(comparisonProfile.name).map(function(athleteName) {
                        return athleteName === oldName ? sanitizedNewName : athleteName;
                    });
                    const updatedComparisonName = athletes.join(' vs. ');
                    const previousComparisonName = comparisonProfile.name;
                    comparisonProfile.name = updatedComparisonName;
                    updateProfileSidebarName(previousComparisonName, updatedComparisonName);
                });

            rankings.forEach(function(ranking) {
                ranking.selectedProfiles = (ranking.selectedProfiles || []).map(function(profileName) {
                    return profileName === oldName ? sanitizedNewName : profileName;
                });
            });

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            updateSidebarEmptyStates();

            if (currentTitle === oldName) {
                handleProfileButtonClick(sanitizedNewName);
            } else {
                const currentComparisonAthletes = getComparisonAthletes(currentTitle);
                if (currentComparisonAthletes.includes(oldName)) {
                    const updatedComparisonName = currentComparisonAthletes
                        .map(function(athleteName) {
                            return athleteName === oldName ? sanitizedNewName : athleteName;
                        })
                        .join(' vs. ');
                    handleProfileButtonClick(updatedComparisonName);
                } else if (currentRanking) {
                    openRankingResults(currentRanking.name);
                }
            }

            return true;
        }

            styleModalField(inputField);
            inputSection.appendChild(inputField);
            content.appendChild(inputSection);

            const worldAthleticsLinkEditor = createWorldAthleticsLinkEditor({
                profile: profile,
                initialLink: profile.worldAthletics,
                getSearchSeed: function() {
                    return inputField.value;
                }
            });
            content.appendChild(worldAthleticsLinkEditor.element);

            var okButton = createPrimaryButton('Speichern');
            okButton.onclick = function() {
                const previousWorldAthleticsLink = normalizeWorldAthleticsLink(profile.worldAthletics);
                const selectedWorldAthleticsLink = worldAthleticsLinkEditor.getLink();
                if (renameSingleProfile(profileName, inputField.value)) {
                    if (selectedWorldAthleticsLink) {
                        profile.worldAthletics = selectedWorldAthleticsLink;
                    } else {
                        delete profile.worldAthletics;
                    }
                    saveProfilesToLocalStorage();
                    closeModal(modal);
                    handleProfileButtonClick(profile.name);

                    const linkChanged = selectedWorldAthleticsLink
                        && (!previousWorldAthleticsLink
                            || previousWorldAthleticsLink.athleteId !== selectedWorldAthleticsLink.athleteId);
                    if (linkChanged) {
                        syncAllWorldAthleticsProfiles({
                            force: true,
                            announce: true,
                            athleteIds: [selectedWorldAthleticsLink.athleteId]
                        });
                    }
                } else {
                    inputField.focus();
                    inputField.select();
                }
            };
            content.appendChild(okButton);

            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, okButton);
            setTimeout(function() {
                inputField.focus();
                inputField.select();
            }, 0);
        }

        function confirmRankingDeletion(rankingName) {
            closeNav();

            var modalParts = createUnifiedModal(
                'Ranking löschen',
                'min(92vw, 520px)'
            );
            var modal = modalParts.modal;
            var content = modalParts.content;

            var textSection = createModalSection();
            var text = document.createElement('p');
            text.innerHTML = 'Möchten Sie das Ranking <strong>' + rankingName + '</strong> wirklich löschen?';
            text.style.margin = '0';
            text.style.fontSize = '16px';
            text.style.lineHeight = '1.5';
            text.style.color = '#243342';
            textSection.appendChild(text);
            content.appendChild(textSection);

            var buttonRow = document.createElement('div');
            buttonRow.style.display = 'flex';
            buttonRow.style.justifyContent = 'flex-end';
            buttonRow.style.gap = '12px';

            var cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.textContent = 'Abbrechen';
            cancelButton.style.padding = '12px 18px';
            cancelButton.style.border = '1px solid rgba(69, 87, 107, 0.18)';
            cancelButton.style.borderRadius = '14px';
            cancelButton.style.background = 'rgba(255, 255, 255, 0.55)';
            cancelButton.style.color = '#233242';
            cancelButton.style.cursor = 'pointer';
            cancelButton.onclick = function() {
                closeModal(modal);
            };
            buttonRow.appendChild(cancelButton);

            var deleteButton = createPrimaryButton('Löschen');
            deleteButton.style.background = 'linear-gradient(135deg, #8e4343 0%, #6d3131 100%)';
            deleteButton.style.boxShadow = '0 14px 28px rgba(109, 49, 49, 0.22)';
            deleteButton.onclick = function() {
                deleteRanking(rankingName);
                closeModal(modal);
            };
            buttonRow.appendChild(deleteButton);

            content.appendChild(buttonRow);
            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, deleteButton);
        }
        
        let profileDeleted = false;

        // Profile löschen
        function confirmProfileDeletion(profileName, deleteOnly = false) {
            closeNav();
            const profile = profiles.find(existingProfile => existingProfile.name === profileName);
            const canArchive = !deleteOnly && profile && profile.type === 'single' && profile.archived !== true;

            var modalParts = createUnifiedModal(
                canArchive ? 'Profil verwalten' : 'Profil löschen',
                'min(92vw, 520px)'
            );
            var modal = modalParts.modal;
            var content = modalParts.content;

            var textSection = createModalSection();
            var text = document.createElement('p');
            text.innerHTML = canArchive
                ? 'Möchten Sie das Profil <strong>' + profileName + '</strong> archivieren oder endgültig löschen?'
                : 'Möchten Sie das Profil <strong>' + profileName + '</strong> wirklich löschen?';
            text.style.margin = '0';
            text.style.fontSize = '16px';
            text.style.lineHeight = '1.5';
            text.style.color = '#243342';
            textSection.appendChild(text);
            content.appendChild(textSection);

            var buttonRow = document.createElement('div');
            buttonRow.className = 'profile-manage-actions';
            buttonRow.style.display = 'flex';
            buttonRow.style.justifyContent = 'flex-end';
            buttonRow.style.gap = '12px';

            var cancelButton = document.createElement('button');
            cancelButton.type = 'button';
            cancelButton.className = 'profile-manage-action';
            cancelButton.textContent = 'Abbrechen';
            cancelButton.style.padding = '12px 18px';
            cancelButton.style.border = '1px solid rgba(69, 87, 107, 0.18)';
            cancelButton.style.borderRadius = '14px';
            cancelButton.style.background = 'rgba(255, 255, 255, 0.55)';
            cancelButton.style.color = '#233242';
            cancelButton.style.cursor = 'pointer';
            cancelButton.onclick = function() {
                closeModal(modal);
            };
            buttonRow.appendChild(cancelButton);

            if (canArchive) {
                var archiveButton = createPrimaryButton('Archivieren');
                archiveButton.classList.add('profile-manage-action');
                archiveButton.onclick = function() {
                    closeModal(modal);
                    openArchiveProfileWindow(profileName);
                };
                buttonRow.appendChild(archiveButton);
            }

            var deleteButton = createPrimaryButton('Löschen');
            deleteButton.classList.add('profile-manage-action');
            deleteButton.style.background = 'linear-gradient(135deg, #8e4343 0%, #6d3131 100%)';
            deleteButton.style.boxShadow = '0 14px 28px rgba(109, 49, 49, 0.22)';
            deleteButton.onclick = function() {
                deleteProfile(profileName);
                closeModal(modal);
            };
            buttonRow.appendChild(deleteButton);

            content.appendChild(buttonRow);
            document.body.appendChild(modal);
            bindEnterKeyToOk(modal, deleteButton);
        }

        function deleteProfile(profileName) {
            // Name des zurzeit angezeigten Profils
            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            const currentComparisonAthletes = getComparisonAthletes(currentTitle);
            const currentRanking = getRankingByName(currentTitle);

            const profilesToDelete = profiles
                .filter(profile => profile.name === profileName || getComparisonAthletes(profile.name).includes(profileName))
                .map(profile => profile.name);

            removeProfilesByName(profilesToDelete);

            for (let i = rankings.length - 1; i >= 0; i--) {
                rankings[i].selectedProfiles = (rankings[i].selectedProfiles || [])
                    .filter(selectedProfileName => !profilesToDelete.includes(selectedProfileName));

                if (rankings[i].selectedProfiles.length === 0) {
                    deleteRanking(rankings[i].name);
                }
            }

            saveProfilesToLocalStorage();
            saveRankingsToLocalStorage();
            updateSidebarEmptyStates();

            if (currentTitle === profileName || currentComparisonAthletes.includes(profileName)) {
                navigateToHome();
            } else if (currentRanking) {
                const updatedRanking = getRankingByName(currentRanking.name);
                if (updatedRanking) {
                    openRankingResults(updatedRanking.name);
                } else {
                    navigateToHome();
                }
            }
        }

        let initialX = null;
        let initialY = null;

        document.body.addEventListener('touchstart', function (e) {
            const sidebarOpen = parseInt(document.getElementById('mySidebar').style.width || '0', 10) > 0;
            const startX = e.touches[0].clientX;
            const edgeSwipeZone = 24;

            if (!sidebarOpen && startX > edgeSwipeZone) {
                initialX = null;
                initialY = null;
                return;
            }

            initialX = startX;
            initialY = e.touches[0].clientY;
        });

        document.body.addEventListener('touchmove', function (e) {
            if (initialX === null || initialY === null) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let diffX = currentX - initialX;
            let diffY = currentY - initialY;

            // Prüfen, ob die horizontale Bewegung größer ist als die vertikale
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    openNav();
                } else if (parseInt(document.getElementById('mySidebar').style.width || '0', 10) > 0) {
                    closeNav();
                }
            }

            // Zurücksetzen der initialen Werte
            initialX = null;
            initialY = null;
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(function(registration) {
            console.log('Service Worker registriert mit Scope: ', registration.scope);
            registration.update();

            window.addEventListener('online', function() {
                registration.update();
            });
            }, function(err) {
            console.log('Service Worker Registrierung fehlgeschlagen: ', err);
            });
        });
        }
    </script>
