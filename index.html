        function calculatePoints(inputName, resultId, disciplineType, A, B, C) {
            var inputElement = document.getElementsByName(inputName)[0];
            var resultElement = document.getElementById(resultId);
            if (!inputElement || !resultElement) {
                return;
            }

            var inputValue = inputElement.value;
            var profileName = document.querySelector('.center').textContent;

            const profileIndex = getProfileIndex(profileName);
            if (profileIndex === -1) {
                return;
            }

            const normalizedValue = normalizePerformanceInput(inputValue);
            const resultIndex = getResultIndexForInput(profileName, inputName, resultId);
            const isComparisonProfile = profileName.includes(" vs. ");
            const isSingleProfile = !isComparisonProfile;

            if (normalizedValue === "") {
                setAnimatedText(resultElement, isComparisonProfile || isSingleProfile ? "0 P" : "0");
                profiles[profileIndex].results[resultIndex] = "0";
                profiles[profileIndex].values[resultIndex] = ""; // Wert im Profil ebenfalls auf leer setzen
            } else {
                const performance = parsePerformanceValue(normalizedValue, disciplineType);
                const points = calculateDecathlonPoints(disciplineType, performance, A, B, C);

                setAnimatedText(resultElement, isComparisonProfile || isSingleProfile ? `${points} P` : String(points));
                profiles[profileIndex].results[resultIndex] = String(points);
                profiles[profileIndex].values[resultIndex] = normalizedValue;
            }
            saveProfilesToLocalStorage();

            // Aktualisieren der Gesamtpunktzahl für das Vergleichsprofil
            if (isComparisonProfile) {
                const comparisonAthletes = getComparisonAthletes(profileName);
                const changedAthlete = comparisonAthletes[resultIndex >= 10 ? 1 : 0];

                if (changedAthlete) {
                    calculateTotalPoints(profileName, changedAthlete);
                }
                updateComparisonRowStates(profileName);
            } else {
                // Standardverhalten für nicht-Vergleichsprofile
                calculateTotalPoints(profileName);
            }
        }


        function calculateTotalPoints(profileName, athlete = null) {
            const profile = profiles.find(p => p.name === profileName);

            if (profile) {
                ensureProfileShape(profile);
                if (athlete) {
                    const athleteIndex = profileName.split(" vs. ").indexOf(athlete);
                    if (athleteIndex === -1) {
                        return;
                    }
                    const startIndex = athleteIndex * 10;
                    const totalPoints = getTotalPointsFromResults(profile.results.slice(startIndex, startIndex + 10));
                    profile.totalPoints[athlete] = totalPoints;

                    const totalElement = document.getElementById(`totalPoints_${athlete}`);
                    if (totalElement) {
                        setAnimatedText(totalElement, `${totalPoints} P`);
                        pulseSummaryContainer(totalElement.closest('.comparison-total-summary'));
                    }
                } else {
                    const totalPoints = getTotalPointsFromResults(profile.results);
                    profile.totalPoints = totalPoints;

                    const totalElement = document.getElementById('total');
                    if (totalElement) {
                        setAnimatedText(totalElement, `${totalPoints} P`);
                        pulseSummaryContainer(totalElement.closest('.profile-total-summary'));
                    }

                    updateSingleProfileCumulative(profileName);
                }

            }
        }

        function updateSingleProfileCumulative(profileName) {
            const profile = profiles.find(function(entry) {
                return entry.name === profileName;
            });

            if (!profile || profile.type !== 'single') {
                return;
            }

            const cumulativePoints = getCumulativePoints(profile.results.slice(0, 10));
            cumulativePoints.forEach(function(points, index) {
                const cumulativeElement = document.getElementById(`singleCumulative${index + 1}`);
                if (cumulativeElement) {
                    setAnimatedText(cumulativeElement, `${points} P`);
                }
            });
        }

        function updateComparisonRowStates(profileName) {
            const profile = profiles.find(function(entry) {
                return entry.name === profileName;
            });
            if (!profile || profile.type !== 'comparison') {
                return;
            }

            for (let i = 0; i < 10; i++) {
                const leftColumn = document.getElementById(`comparisonLeftColumn${i + 1}`);
                const rightColumn = document.getElementById(`comparisonRightColumn${i + 1}`);
                const leftPoints = parseInt(profile.results[i] || '0', 10);
                const rightPoints = parseInt(profile.results[i + 10] || '0', 10);

                if (leftColumn) {
                    leftColumn.classList.remove('is-leading');
                }
                if (rightColumn) {
                    rightColumn.classList.remove('is-leading');
                }

                if (leftPoints > rightPoints) {
                    if (leftColumn) {
                        leftColumn.classList.add('is-leading');
                    }
                } else if (rightPoints > leftPoints) {
                    if (rightColumn) {
                        rightColumn.classList.add('is-leading');
                    }
                }
            }
        }


        function getTotalPointsFromResults(results) {
            return (results || [])
                .filter(result => result !== "" && !isNaN(result) && result !== null && result !== undefined)
                .reduce((total, result) => total + parseInt(result, 10), 0);
        }

            function renderDecathlonProjectionList() {
                cancelPendingSearch();
                const requestVersion = ++projectionRequestVersion;
                const currentYear = new Date().getFullYear();
                const displayedItems = [];
                let olderCandidates = [];
                let olderCandidateIndex = 0;

                function isCurrentRequest() {
                    return requestVersion === projectionRequestVersion && editor.isConnected;
                }

                function appendBestOlderDecathlons(targetCount) {
                    const candidatesToAppend = olderCandidates.slice(
                        olderCandidateIndex,
                        olderCandidateIndex + targetCount
                    );
                    olderCandidateIndex += candidatesToAppend.length;
                    candidatesToAppend.forEach(function(decathlon) {
                        displayedItems.push({ decathlon: decathlon, values: null });
                    });
                }

                function renderList(statusText) {
                    if (!isCurrentRequest()) {
                        return;
                    }
                    editor.innerHTML = '';
                    appendProjectionHeader('Zehnkampf auswählen', renderEditor);

                    const status = document.createElement('div');
                    status.className = 'wa-search-status';
                    status.textContent = statusText;
                    editor.appendChild(status);

                    const list = document.createElement('div');
                    list.className = 'profile-import-competition-list';
                    displayedItems.forEach(function(item) {
                        const decathlon = item.decathlon;
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'profile-import-competition';

                        const name = document.createElement('span');
                        name.className = 'profile-import-competition-name';
                        name.textContent = decathlon.competition || 'Zehnkampf';
                        button.appendChild(name);

                        const points = document.createElement('span');
                        points.className = 'profile-import-competition-points';
                        points.textContent = `${decathlon.mark} Pkt.`;
                        button.appendChild(points);

                        const meta = document.createElement('span');
                        meta.className = 'profile-import-competition-meta';
                        meta.textContent = [
                            formatWorldAthleticsCompetitionDate(decathlon.date),
                            getWorldAthleticsLocationLabel(decathlon.location)
                        ].filter(Boolean).join(' · ');
                        button.appendChild(meta);
                        button.onclick = async function() {
                            button.disabled = true;
                            try {
                                if (!item.values) {
                                    item.values = await fetchWorldAthleticsDecathlonValues(
                                        selectedLink.athleteId,
                                        decathlon
                                    );
                                }
                                if (!isCurrentRequest()) {
                                    return;
                                }
                                if (item.values.length !== 10 || !item.values.every(Boolean)) {
                                    const itemIndex = displayedItems.indexOf(item);
                                    if (itemIndex >= 0) {
                                        displayedItems.splice(itemIndex, 1);
                                    }
                                    renderList(`${displayedItems.length} vollständige Zehnkämpfe verfügbar.`);
                                    return;
                                }
                                renderDecathlonProjectionPreview(item, function() {
                                    renderList(`${displayedItems.length} vollständige Zehnkämpfe verfügbar.`);
                                });
                            } catch (error) {
                                console.error('Zehnkampfdetails konnten nicht geladen werden:', error);
                                if (isCurrentRequest()) {
                                    button.disabled = false;
                                    showAppToast('Zehnkampf konnte nicht geladen werden.');
                                }
                            }
                        };
                        list.appendChild(button);
                    });
                    editor.appendChild(list);

                    if (olderCandidateIndex < olderCandidates.length) {
                        const moreButton = createSecondaryButton('Weitere anzeigen', function() {
                            const previousCount = displayedItems.length;
                            appendBestOlderDecathlons(5);
                            const addedCount = displayedItems.length - previousCount;
                            renderList(addedCount > 0
                                ? `${displayedItems.length} vollständige Zehnkämpfe verfügbar.`
                                : 'Keine weiteren vollständigen Zehnkämpfe gefunden.');
                        }, 'wa-decathlon-projection-more');
                        editor.appendChild(moreButton);
                    }
                }

                editor.innerHTML = '';
                appendProjectionHeader('Zehnkampf auswählen', renderEditor);
                const loadingStatus = document.createElement('div');
                loadingStatus.className = 'wa-search-status';
                loadingStatus.textContent = 'Vollständige Zehnkämpfe werden geprüft ...';
                editor.appendChild(loadingStatus);

                (async function() {
                    try {
                        const candidates = await fetchWorldAthleticsAdultDecathlonCandidates(
                            selectedLink.athleteId
                        );
                        if (!isCurrentRequest()) {
                            return;
                        }

                        const currentYearCandidates = candidates
                            .filter(function(decathlon) {
                                return getWorldAthleticsPerformanceYear(decathlon.date) === currentYear;
                            })
                            .sort(function(left, right) {
                                return new Date(right.date).getTime() - new Date(left.date).getTime();
                            });
                        olderCandidates = candidates
                            .filter(function(decathlon) {
                                return getWorldAthleticsPerformanceYear(decathlon.date) !== currentYear;
                            })
                            .sort(function(left, right) {
                                const pointsDifference = Number(right.mark) - Number(left.mark);
                                return pointsDifference !== 0
                                    ? pointsDifference
                                    : new Date(right.date).getTime() - new Date(left.date).getTime();
                            });

                        currentYearCandidates.forEach(function(decathlon) {
                            displayedItems.push({ decathlon: decathlon, values: null });
                        });
                        appendBestOlderDecathlons(Math.max(0, 5 - displayedItems.length));
                        if (!isCurrentRequest()) {
                            return;
                        }

                        renderList(displayedItems.length > 0
                            ? `${displayedItems.length} vollständige Zehnkämpfe verfügbar.`
                            : 'Keine vollständigen Erwachsenen-Zehnkämpfe gefunden.');
                    } catch (error) {
                        if (!isCurrentRequest()) {
                            return;
                        }
                        console.error('Zehnkämpfe für Hochrechnung konnten nicht geladen werden:', error);
                        renderList('Die Zehnkämpfe konnten derzeit nicht geladen werden.');

                async function runSearch(searchTerm, requestVersion) {

                function scheduleSearch(delay = WORLD_ATHLETICS_SEARCH_DEBOUNCE_MS) {

                searchInput.addEventListener('input', function() {

                searchInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {

                        event.stopPropagation();

                        if (firstSuggestion) {

        function createWorldAthleticsInlineLinkPicker(inputField) {
            let selectedLink = null;
            let searchTimer = null;
            let searchRequestVersion = 0;

            const picker = document.createElement('div');
            picker.className = 'wa-inline-link-picker';

            function clearPendingSearch() {
                if (searchTimer) {
                    window.clearTimeout(searchTimer);
                    searchTimer = null;
                }
                searchRequestVersion += 1;
            }

            function renderSelectedLink() {
                picker.innerHTML = '';
                if (!selectedLink) {
                    return;
                }

                const summary = document.createElement('div');
                summary.className = 'wa-link-summary';

                const icon = document.createElement('img');
                icon.src = 'imgs/profile_linked.png';
                icon.alt = '';
                icon.draggable = false;

            function renderSuggestions(identities) {

                });
                picker.appendChild(results);
            }

            async function runSearch(searchTerm, requestVersion) {
                renderSearchState('Passende Zehnkämpfer werden geprüft ...');
                try {
                    const athletes = await searchWorldAthleticsDecathletes(searchTerm, 5, function(partialAthletes) {
                        if (requestVersion !== searchRequestVersion || selectedLink || !picker.isConnected) {
                            return;
                        }
                        const partialIdentities = partialAthletes.map(createWorldAthleticsIdentity).filter(Boolean);
                        if (partialIdentities.length > 0) {
                            renderSuggestions(partialIdentities);
                        }
                    });
                    if (requestVersion !== searchRequestVersion || selectedLink || !picker.isConnected) {
                        return;
                    }
                    const identities = athletes.map(createWorldAthleticsIdentity).filter(Boolean);
                    if (identities.length === 0) {
                        renderSearchState('Keine passenden Zehnkämpfer gefunden.');
                        return;
                    }
                    renderSuggestions(identities);
                } catch (error) {
                    if (requestVersion !== searchRequestVersion || selectedLink || !picker.isConnected) {
                        return;
                    }
                    console.error('Automatische World-Athletics-Suche fehlgeschlagen:', error);
                    renderSearchState('Verknüpfungsvorschläge sind momentan nicht erreichbar.');
                }
            }

            function scheduleSearch() {
                if (selectedLink) {
                    renderSelectedLink();
                    return;
                }

                if (searchTimer) {
                    window.clearTimeout(searchTimer);
                }
                const searchTerm = sanitizeProfileName(inputField.value);
                searchRequestVersion += 1;
                const requestVersion = searchRequestVersion;
                if (searchTerm.length < 2) {
                    picker.innerHTML = '';
                    searchTimer = null;
                    return;
                }

                searchTimer = window.setTimeout(function() {
                    searchTimer = null;
                    runSearch(searchTerm, requestVersion);
                }, WORLD_ATHLETICS_SEARCH_DEBOUNCE_MS);
            }

            inputField.addEventListener('input', scheduleSearch);
            inputField.addEventListener('keydown', function(event) {
                if (event.key === 'ArrowDown') {
                    const firstSuggestion = picker.querySelector('.wa-search-result');
                    if (firstSuggestion) {
                        event.preventDefault();
                        firstSuggestion.focus();
                    }
                }
            });

            return {
                element: picker,
                getLink: function() {
                    return normalizeWorldAthleticsLink(selectedLink);
                },
                destroy: clearPendingSearch
            };
        }

        function getWorldAthleticsDateKey(dateValue) {
            const date = new Date(dateValue);
            return Number.isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 10);
        }

        function formatWorldAthleticsCompetitionDate(dateValue) {
            const date = new Date(dateValue);
            if (Number.isNaN(date.getTime())) {
                return 'Datum unbekannt';
            }
            return new Intl.DateTimeFormat('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }).format(date);
        }

        function getWorldAthleticsLocationLabel(location) {
            if (!location || typeof location !== 'object') {
                return '';
            }
            return [location.city, location.country].filter(Boolean).join(', ');
        }

        function getWorldAthleticsDecathlonComponents(results, decathlon) {
            const selectedDate = new Date(decathlon && decathlon.date);
            const selectedTime = Number.isNaN(selectedDate.getTime()) ? null : selectedDate.getTime();
            const selectedByIndex = {};

            results.forEach(function(result) {
                if (Number(result && result.competitionId) !== Number(decathlon && decathlon.competitionId)
                    || !/^CE/i.test(String(result && result.race || ''))) {
                    return;
                }
                if (decathlon.category && result.category && decathlon.category !== result.category) {
                    return;
                }

                const code = normalizeWorldAthleticsDecathlonComponentCode(
                    result.disciplineCode,
                    result.discipline
                );
                const discipline = WORLD_ATHLETICS_DISCIPLINES[code];
                if (!discipline) {
                    return;
                }

                const resultDate = new Date(result.date || '');
                const resultTime = Number.isNaN(resultDate.getTime()) ? null : resultDate.getTime();
                const dayDistance = selectedTime != null && resultTime != null
                    ? Math.abs(selectedTime - resultTime) / (24 * 60 * 60 * 1000)
                    : 0;
                if (dayDistance > 3) {
                    return;
                }

                const previous = selectedByIndex[discipline.index];
                if (previous && previous.dayDistance <= dayDistance) {
                    return;
                }
                const parsedMark = parseWorldAthleticsMark(code, result.mark);
                const disciplinePoints = Number(result.resultScore);
                selectedByIndex[discipline.index] = {
                    dayDistance: dayDistance,
                    value: parsedMark == null ? '' : formatWorldAthleticsMark(code, parsedMark),
                    points: Number.isFinite(disciplinePoints) ? disciplinePoints : null
                };
            });

            const values = Array(10).fill('');
            const points = Array(10).fill(null);
            Object.keys(selectedByIndex).forEach(function(index) {
                values[Number(index)] = selectedByIndex[index].value;
                points[Number(index)] = selectedByIndex[index].points;
            });
            return { values: values, points: points };
        }

        function hasValidWorldAthleticsDecathlonComponents(decathlon) {
            return Array.isArray(decathlon && decathlon.componentValues)
                && decathlon.componentValues.length === 10
                && decathlon.componentValues.every(Boolean)
                && Array.isArray(decathlon.componentPoints)
                && decathlon.componentPoints.length === 10
                && decathlon.componentPoints.every(function(points) {
                    return Number.isFinite(Number(points)) && Number(points) > 0;
                });
        }

        async function loadWorldAthleticsDecathlons(athleteId) {
            const results = await fetchWorldAthleticsJson(`/athletes/${athleteId}/results`);
            if (!Array.isArray(results)) {
                return [];
            }

            const uniqueResults = new Map();
            results.forEach(function(result) {
                const disciplineCode = String(result && result.disciplineCode || '').toUpperCase();
                const competitionId = Number(result && result.competitionId);
                if (!disciplineCode.startsWith(WORLD_ATHLETICS_DECATHLON_CODE_PREFIX)
                    || !Number.isInteger(competitionId)
                    || competitionId <= 0) {
                    return;
                }

                const key = [competitionId, getWorldAthleticsDateKey(result.date), String(result.mark || '')].join(':');
                if (!uniqueResults.has(key)) {
                    uniqueResults.set(key, result);
                }
            });

            return Array.from(uniqueResults.values()).map(function(decathlon) {
                const components = getWorldAthleticsDecathlonComponents(results, decathlon);
                return Object.assign({}, decathlon, {
                    componentValues: components.values,
                    componentPoints: components.points
                });
            }).sort(function(left, right) {
                const leftTime = new Date(left.date).getTime() || 0;
                const rightTime = new Date(right.date).getTime() || 0;
                return rightTime - leftTime;
            });
        }

        function fetchWorldAthleticsDecathlons(athleteId) {
            const normalizedAthleteId = Number(athleteId);
            if (worldAthleticsDecathlonListCache.has(normalizedAthleteId)) {
                return worldAthleticsDecathlonListCache.get(normalizedAthleteId);
            }

            const request = loadWorldAthleticsDecathlons(normalizedAthleteId)
                .catch(function(error) {
                    worldAthleticsDecathlonListCache.delete(normalizedAthleteId);
                    throw error;
                });
            worldAthleticsDecathlonListCache.set(normalizedAthleteId, request);
            return request;
        }

        async function fetchWorldAthleticsCompleteDecathlons(athleteId) {
            const decathlons = await fetchWorldAthleticsDecathlons(athleteId);
            const now = Date.now();
            return decathlons.filter(function(decathlon) {
                const points = Number(decathlon && decathlon.mark);
                const date = new Date(decathlon && decathlon.date);
                return Number.isInteger(points)
                    && points > 0
                    && !Number.isNaN(date.getTime())
                    && date.getTime() <= now
                    && hasValidWorldAthleticsDecathlonComponents(decathlon);
            });
        }

        function normalizeWorldAthleticsDecathlonComponentCode(codeValue, disciplineValue) {
            const code = String(codeValue || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const discipline = String(disciplineValue || '').toUpperCase();
            if (WORLD_ATHLETICS_DISCIPLINES[code]) {
                return code;
            }
            if (code.startsWith('110H') || (discipline.includes('110') && discipline.includes('HURDLE'))) {
                return '110H';
            }
            if (code.startsWith('1500') || discipline.includes('1500')) {
                return '1500';
            }
            if (code.startsWith('LJ') || discipline.includes('LONG JUMP')) {
                return 'LJ';
            }
            if (code.startsWith('SP') || discipline.includes('SHOT PUT')) {
                return 'SP';
            }
            if (code.startsWith('HJ') || discipline.includes('HIGH JUMP')) {
                return 'HJ';
            }
            if (code.startsWith('DT') || discipline.includes('DISCUS')) {
                return 'DT';
            }
            if (code.startsWith('PV') || discipline.includes('POLE VAULT')) {
                return 'PV';
            }
            if (code.startsWith('JT') || discipline.includes('JAVELIN')) {
                return 'JT';
            }
            if (code === '400' || /^400\s+MET/.test(discipline)) {
                return '400';
            }
            if (code === '100' || /^100\s+MET/.test(discipline)) {
                return '100';
            }
            return '';
        }

        function extractWorldAthleticsDecathlonValues(dataSets, athleteId, decathlonDate) {
            const selectedDate = new Date(decathlonDate);
            const selectedTime = Number.isNaN(selectedDate.getTime()) ? null : selectedDate.getTime();
            const selectedByIndex = {};

            dataSets.forEach(function(data) {
                const events = data && Array.isArray(data.events) ? data.events : [];
                events.forEach(function(event) {
                    const code = normalizeWorldAthleticsDecathlonComponentCode(
                        event.disciplineCode,
                        event.discipline
                    );
                    const discipline = WORLD_ATHLETICS_DISCIPLINES[code];
                    if (!discipline) {
                        return;
                    }

                    const eventName = String(event.eventName || '').toLowerCase();
                    const combinedPriority = /combined|decathlon|zehnkampf|mehrkampf/.test(eventName) ? 20 : 0;
                    const races = Array.isArray(event.races) ? event.races : [];
                    races.forEach(function(race) {
                        const results = Array.isArray(race.results) ? race.results : [];
                        results.forEach(function(result) {
                            const athletes = Array.isArray(result.athletes) ? result.athletes : [];
                            const belongsToAthlete = athletes.some(function(athlete) {
                                return Number(athlete && athlete.id) === Number(athleteId);
                            });
                            if (!belongsToAthlete) {
                                return;
                            }

                            const parsedMark = parseWorldAthleticsMark(code, result.mark);
                            if (parsedMark == null) {
                                return;
                            }

                            const resultDate = new Date(result.date || race.date || '');
                            const resultTime = Number.isNaN(resultDate.getTime()) ? null : resultDate.getTime();
                            const dayDistance = selectedTime != null && resultTime != null
                                ? Math.abs(selectedTime - resultTime) / (24 * 60 * 60 * 1000)
                                : 0;
                            if (dayDistance > 3) {
                                return;
                            }

                            const priority = combinedPriority - dayDistance;
                            const previous = selectedByIndex[discipline.index];
                            if (!previous || priority > previous.priority) {
                                selectedByIndex[discipline.index] = {
                                    priority: priority,
                                    value: formatWorldAthleticsMark(code, parsedMark)
                                };
                            }
                        });
                    });
                });
            });

            const values = Array(10).fill('');
            Object.keys(selectedByIndex).forEach(function(index) {
                values[Number(index)] = selectedByIndex[index].value;
            });
            return values;
        }

        async function loadWorldAthleticsDecathlonValues(athleteId, decathlon) {
            const competitionId = Number(decathlon && decathlon.competitionId);
            if (!Number.isInteger(competitionId) || competitionId <= 0) {
                throw new Error('Für diesen Zehnkampf fehlen die Wettkampfdaten.');
            }

            const resultPath = `/competitions/${competitionId}/results`;
            const initialData = await fetchWorldAthleticsJson(resultPath);
            const availableDays = initialData && initialData.options && Array.isArray(initialData.options.days)
                ? initialData.options.days
                : [];
            const selectedDateKey = getWorldAthleticsDateKey(decathlon.date);
            const selectedTime = selectedDateKey ? new Date(`${selectedDateKey}T00:00:00Z`).getTime() : null;
            let relevantDays = availableDays.filter(function(day) {
                const dayKey = getWorldAthleticsDateKey(day.date);
                const dayTime = dayKey ? new Date(`${dayKey}T00:00:00Z`).getTime() : null;
                if (selectedTime == null || dayTime == null) {
                    return false;
                }
                const distance = (selectedTime - dayTime) / (24 * 60 * 60 * 1000);
                return distance >= 0 && distance <= 2;
            });
            if (relevantDays.length === 0) {
                relevantDays = availableDays;
            }

            const loadedDays = new Set();
            async function loadDays(days) {
                const pendingDays = days.filter(function(day) {
                    const dayNumber = Number(day.day);
                    if (!Number.isInteger(dayNumber) || loadedDays.has(dayNumber)) {
                        return false;
                    }
                    loadedDays.add(dayNumber);
                    return true;
                });
                const responses = await Promise.allSettled(pendingDays.map(function(day) {
                    return fetchWorldAthleticsJson(`${resultPath}?day=${Number(day.day)}`);
                }));
                return responses
                    .filter(function(response) { return response.status === 'fulfilled'; })
                    .map(function(response) { return response.value; });
            }

            const dataSets = [initialData].concat(await loadDays(relevantDays));
            let values = extractWorldAthleticsDecathlonValues(dataSets, athleteId, decathlon.date);
            if (values.filter(Boolean).length < 10 && loadedDays.size < availableDays.length) {
                dataSets.push.apply(dataSets, await loadDays(availableDays));
                values = extractWorldAthleticsDecathlonValues(dataSets, athleteId, decathlon.date);
            }
            if (!values.some(Boolean)) {
                throw new Error('Für diesen Zehnkampf konnten keine Einzeldisziplinen geladen werden.');
            }
            return values;
        }

        function fetchWorldAthleticsDecathlonValues(athleteId, decathlon) {
            if (hasValidWorldAthleticsDecathlonComponents(decathlon)) {
                return Promise.resolve(decathlon.componentValues.slice());
            }

            const competitionId = Number(decathlon && decathlon.competitionId);
            const dateKey = getWorldAthleticsDateKey(decathlon && decathlon.date);
            const cacheKey = `${Number(athleteId)}:${competitionId}:${dateKey}`;
            if (worldAthleticsDecathlonValuesCache.has(cacheKey)) {
                return worldAthleticsDecathlonValuesCache.get(cacheKey);
            }

            const request = loadWorldAthleticsDecathlonValues(athleteId, decathlon)
                .catch(function(error) {
                    worldAthleticsDecathlonValuesCache.delete(cacheKey);
                    throw error;
                });
            worldAthleticsDecathlonValuesCache.set(cacheKey, request);
            return request;
        }

        async function fetchWorldAthleticsAdultDecathlonCandidates(athleteId) {
            const decathlons = await fetchWorldAthleticsDecathlons(athleteId);
            const now = Date.now();
            return decathlons.filter(function(decathlon) {
                const disciplineCode = String(decathlon && decathlon.disciplineCode || '').toUpperCase();
                const date = new Date(decathlon && decathlon.date);
                const points = Number(decathlon && decathlon.mark);
                return disciplineCode === 'DEC'
                    && !Number.isNaN(date.getTime())
                    && date.getTime() <= now
                    && Number.isFinite(points)
                    && points > 0
                    && hasValidWorldAthleticsDecathlonComponents(decathlon);
            });
        }

                // Zeige die oberen Icons an, wenn ein Profil ausgewählt wird
                document.getElementById('top-icons').style.display = 'flex';
                // Aktualisieren der Gesamtpunktzahl für das Vergleichsprofil
                if (profileName.includes(" vs.")) {
                    // Zerlegen des Inputnamens, um die Athletennamen zu extrahieren
                    const [athlete1, athlete2] = profileName.split(" vs. ");
                    calculateTotalPoints(profileName, athlete1);
                    calculateTotalPoints(profileName, athlete2);
                } 
                else {
                    // Standardverhalten für nicht-Vergleichsprofile
                    calculateTotalPoints(profileName);
                }
                profileDeleted = false;
                setActiveSidebarItem('profile', profileName);
                animateViewEntrance(document.querySelector('.labels-container'));
                updateResponsiveAppTitles();
                restoreViewScrollPosition(currentViewKey);
            } else {
                navigateToHome();
            }
        }
        // Beispielprofil-Daten
        const profiles = [];
        const rankings = [];
        const archiveFolderOrder = [];
        let draggedProfileName = null;
        let draggedArchiveFolderName = null;
        let draggedArchiveProfileName = null;
        let dropIndicator = null;
        let sidebarMode = 'main';
        let activeArchiveFolder = '';

        function saveRankingsToLocalStorage() {
            localStorage.setItem('rankings', JSON.stringify(rankings));
        }

        function loadRankingsFromLocalStorage() {
            rankings.splice(0, rankings.length);
            const savedRankings = localStorage.getItem('rankings');

            if (!savedRankings) {
                return;
            }

            try {
                JSON.parse(savedRankings).forEach(ranking => {
                    if (!ranking || typeof ranking.name !== 'string') {
                        return;
                    }

                    const sanitizedName = sanitizeProfileName(ranking.name);
                    if (!sanitizedName) {
                        return;
                    }

                    const selectedProfiles = Array.isArray(ranking.selectedProfiles)
                        ? ranking.selectedProfiles
                            .map(profileName => sanitizeProfileName(profileName))
                            .filter(profileName => !!profileName)
                        : [];

                    rankings.push({
                        name: sanitizedName,
                        selectedProfiles: selectedProfiles,
                        type: ranking.type === 'archive' ? 'archive' : 'active',
                        archiveFolder: ranking.type === 'archive' ? normalizeArchiveFolderName(ranking.archiveFolder) : '',
                        createdAt: ranking.createdAt || new Date().toISOString()
                    });
                });
            } catch (error) {
                console.error('Rankings konnten nicht aus dem localStorage geladen werden:', error);
                localStorage.removeItem('rankings');
            }
        }

        function getProfileIndex(profileName) {
            return profiles.findIndex(p => p.name === profileName);
        }

        function getInputName(index) {
            return [
                '100m', 'Weit', 'Kugel', 'Hoch', '400m',
                '110mH', 'Diskus', 'Stab', 'Speer', '1500m'
            ][index - 1];
        }

        function displayProfileResults(profileName) {
            hideWorldAthleticsPerformanceSuggestions();
            destroyAnalysisCharts();
            const profile = profiles.find(p => p.name === profileName);
            if (!profile) return;
            ensureProfileShape(profile);

            // Leeren der vorhandenen Labels
            const labelsContainer = document.querySelector('.labels-container');
            labelsContainer.innerHTML = '';

            if (profile.type === 'single') {
                // Funktion zum Anzeigen von Einzelprofilen
                displaySingleProfile(profile);
            } else if (profile.type === 'comparison') {
                // Funktion zum Anzeigen von Vergleichsprofilen
                displayComparisonProfile(profile);
            }
        }

        function getRankingByName(rankingName) {
            return rankings.find(ranking => ranking.name === rankingName) || null;
        }

        function getSortedRankingEntries(ranking) {
            if (!ranking || !Array.isArray(ranking.selectedProfiles)) {
                return [];
            }

            const isArchiveRanking = ranking.type === 'archive';
            const archiveFolderName = normalizeArchiveFolderName(ranking.archiveFolder);

            return ranking.selectedProfiles
                .map(profileName => profiles.find(profile => profile.name === profileName && profile.type === 'single'))
                .filter(function(profile) {
                    if (!profile) {
                        return false;
                    }

                    if (isArchiveRanking) {
                        return profile.archived === true && normalizeArchiveFolderName(profile.archiveFolder) === archiveFolderName;
                    }

                    return profile.archived !== true;
                })
                .map(profile => {
                    ensureProfileShape(profile);
                    const totalPoints = getTotalPointsFromResults(profile.results.slice(0, 10));
                    profile.totalPoints = totalPoints;

                    return {
                        name: profile.name,
                        values: profile.values.slice(0, 10),
                        results: profile.results.slice(0, 10),
                        totalPoints: totalPoints
                    };
                })
                .sort((entryA, entryB) => {
                    if (entryB.totalPoints !== entryA.totalPoints) {
                        return entryB.totalPoints - entryA.totalPoints;
                    }

                    return entryA.name.localeCompare(entryB.name, 'de');
                });
        }

        function buildDescendingRanks(values) {
            const sortedValues = Array.from(new Set(values.slice().sort(function(a, b) {
                return b - a;
            })));

            return values.map(function(value) {
                return sortedValues.indexOf(value) + 1;
            });
        }

        function getCumulativePoints(results) {
            let runningTotal = 0;
            return results.map(function(result) {
                runningTotal += parseInt(result || '0', 10);
                return runningTotal;
            });
        }

        // Okabe-Ito palette plus line patterns keeps series distinguishable with color-vision deficiencies.
        const ANALYSIS_COLORS = ['#0072B2', '#E69F00', '#CC79A7', '#56B4E9', '#F0E442', '#D55E00', '#009E73', '#EDEDED'];
        const ANALYSIS_LINE_DASHES = [[], [9, 4], [2, 4], [11, 4, 2, 4], [5, 3], [13, 4], [3, 3, 9, 3], [1, 4]];
        const ANALYSIS_POINT_STYLES = ['circle', 'rectRounded', 'triangle', 'rectRot', 'star', 'crossRot', 'rect', 'cross'];
        const analysisChartInstances = [];

        function destroyAnalysisCharts() {
            closeAnalysisPseudoFullscreen();
            while (analysisChartInstances.length > 0) {
                const chart = analysisChartInstances.pop();
                if (chart && typeof chart.destroy === 'function') {
                    chart.destroy();
                }
            }
        }

        function hasAnalysisPerformance(value) {
            return String(value == null ? '' : value).trim() !== '';
        }

        function getAnalysisPoint(result, value) {
            if (!hasAnalysisPerformance(value)) {
                return null;
            }
            const points = parseInt(result || '0', 10);
            return Number.isFinite(points) ? points : 0;
        }

        function getAnalysisCumulativeSeries(results, values, includeStart = false) {
            let runningTotal = 0;
            const series = results.slice(0, 10).map(function(result, index) {
                const points = getAnalysisPoint(result, values[index]);
                if (points === null) {
                    return null;
                }
                runningTotal += points;
                return runningTotal;
            });
            return includeStart ? [0].concat(series) : series;
        }

        function getVisibleAnalysisDisciplineCount(athleteEntries) {
            let lastPopulatedIndex = -1;
            (athleteEntries || []).forEach(function(entry) {
                const values = entry && Array.isArray(entry.values) ? entry.values : [];
                const results = entry && Array.isArray(entry.results) ? entry.results : [];
                results.slice(0, 10).forEach(function(result, disciplineIndex) {
                    const points = parseInt(result || '0', 10);
                    if (hasAnalysisPerformance(values[disciplineIndex]) && Number.isFinite(points) && points > 0) {
                        lastPopulatedIndex = Math.max(lastPopulatedIndex, disciplineIndex);
                    }
                });
            });
            return lastPopulatedIndex + 1;
        }

        function getAnalysisChartDefaults() {
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            return {
                responsive: true,
                maintainAspectRatio: false,
                animation: reduceMotion ? false : { duration: 360 },
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: {
                        labels: {
                            color: '#d9e0e5',
                            usePointStyle: true,
                            boxWidth: 8,
                            boxHeight: 8,
                            padding: 16,
                            font: { family: 'Roboto', size: 12, weight: 'bold' }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(22, 27, 32, 0.96)',
                        borderColor: 'rgba(255, 255, 255, 0.12)',
                        borderWidth: 1,
                        titleColor: '#ffffff',
                        bodyColor: '#dce3e8',
                        padding: 11,
                        displayColors: true,
                        titleFont: { family: 'Roboto', weight: 'bold' },
                        bodyFont: { family: 'Roboto' }
                    }
                }
            };
        }

        function getAnalysisScaleDefaults() {
            return {
                grid: { color: 'rgba(255, 255, 255, 0.065)' },
                border: { color: 'rgba(255, 255, 255, 0.11)' },
                ticks: {
                    color: '#aeb8c0',
                    font: { family: 'Roboto', size: window.innerWidth <= 680 ? 9 : 11 }
                }
            };
        }

        function analysisColorWithAlpha(hexColor, alpha) {
            const normalized = String(hexColor || '').replace('#', '');
            if (!/^[0-9a-f]{6}$/i.test(normalized)) {
                return `rgba(210, 218, 224, ${alpha})`;
            }
            const red = parseInt(normalized.slice(0, 2), 16);
            const green = parseInt(normalized.slice(2, 4), 16);
            const blue = parseInt(normalized.slice(4, 6), 16);
            return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
        }

        function getAnalysisLineDash(entryIndex) {
            const styleGroup = Math.floor(entryIndex / ANALYSIS_COLORS.length);
            return ANALYSIS_LINE_DASHES[styleGroup % ANALYSIS_LINE_DASHES.length];
        }

        function getAnalysisPointStyle(entryIndex) {
            const styleGroup = Math.floor(entryIndex / ANALYSIS_COLORS.length);
            return ANALYSIS_POINT_STYLES[(entryIndex + styleGroup) % ANALYSIS_POINT_STYLES.length];
        }

        function syncAnalysisLegendFocus(chart) {
            const card = chart && chart.canvas ? chart.canvas.closest('.analysis-chart-card') : null;
            if (!card) {
                return;
            }

            card.querySelectorAll('.analysis-inline-legend-item').forEach(function(item) {
                const datasetIndex = chart.data.datasets.findIndex(function(dataset) {
                    return dataset.label === item.dataset.datasetLabel;
                });
                const isFocused = chart.$focusedDatasetIndex === datasetIndex;
                const isMuted = chart.$focusedDatasetIndex !== null && !isFocused;
                item.classList.toggle('is-focused', isFocused);
                item.classList.toggle('is-muted', isMuted);
                item.setAttribute('aria-pressed', isFocused ? 'true' : 'false');
            });
        }

        function toggleAnalysisDatasetFocus(chart, datasetIndex) {
            if (!chart || datasetIndex < 0 || datasetIndex >= chart.data.datasets.length) {
                return;
            }

            chart.$focusedDatasetIndex = chart.$focusedDatasetIndex === datasetIndex
                ? null
                : datasetIndex;

            chart.data.datasets.forEach(function(dataset, currentDatasetIndex) {
                const isMuted = chart.$focusedDatasetIndex !== null
                    && currentDatasetIndex !== chart.$focusedDatasetIndex;
                dataset.borderColor = isMuted
                    ? analysisColorWithAlpha(dataset.analysisBaseColor, 0.16)
                    : dataset.analysisBaseColor;
                dataset.backgroundColor = isMuted
                    ? analysisColorWithAlpha(dataset.analysisBaseColor, 0.12)
                    : dataset.analysisBaseColor;
                dataset.pointBackgroundColor = dataset.backgroundColor;
                dataset.pointBorderColor = dataset.borderColor;
                dataset.borderWidth = isMuted ? 1.2 : (currentDatasetIndex === chart.$focusedDatasetIndex ? 3.4 : 2.3);
                dataset.pointRadius = isMuted ? 2 : 4;
            });
            syncAnalysisLegendFocus(chart);
            chart.update();
        }

        function enableAnalysisLineFocus(options) {
            options.onClick = function(event, _elements, chart) {
                const nearest = chart.getElementsAtEventForMode(
                    event,
                    'nearest',
                    { intersect: false, axis: 'xy' },
                    true
                );
                if (nearest.length === 0) {
                    return;
                }

                toggleAnalysisDatasetFocus(chart, nearest[0].datasetIndex);
            };

            options.plugins = options.plugins || {};
            options.plugins.legend = options.plugins.legend || {};
            options.plugins.legend.onClick = function(_event, legendItem, legend) {
                toggleAnalysisDatasetFocus(legend.chart, legendItem.datasetIndex);
            };

            options.onHover = function(event, elements) {
                const target = event.native && event.native.target;
                if (target) {
                    target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
                }
            };
        }

        function createAnalysisChart(card, config, ariaLabel) {
            const frame = card.querySelector('.analysis-chart-frame');
            if (typeof Chart === 'undefined') {
                frame.className = 'analysis-chart-empty';
                frame.textContent = 'Die Diagrammkomponente konnte nicht geladen werden.';
                return null;
            }

            const canvas = document.createElement('canvas');
            canvas.setAttribute('role', 'img');
            canvas.setAttribute('aria-label', ariaLabel);
            canvas.appendChild(document.createTextNode(ariaLabel));
            frame.appendChild(canvas);

            const chart = new Chart(canvas, config);
            analysisChartInstances.push(chart);
            return chart;
        }

        function resizeAnalysisCharts() {
            window.requestAnimationFrame(function() {
                analysisChartInstances.forEach(function(chart) {
                    if (chart && typeof chart.resize === 'function') {
                        chart.resize();
                    }
                });
            });
        }

        function updateAnalysisFullscreenButtons() {
            document.querySelectorAll('.analysis-chart-card').forEach(function(card) {
                const button = card.querySelector('.analysis-fullscreen-button');
                if (!button) {
                    return;
                }
                const isFullscreen = document.fullscreenElement === card
                    || card.classList.contains('is-analysis-fullscreen');
                button.classList.toggle('is-active', isFullscreen);
                button.setAttribute(
                    'aria-label',
                    isFullscreen ? 'Vollbild schließen' : 'Diagramm im Vollbild anzeigen'
                );
                button.title = isFullscreen ? 'Vollbild schließen' : 'Vollbild anzeigen';
            });
        }

        function closeAnalysisPseudoFullscreen() {
            document.querySelectorAll('.analysis-chart-card.is-analysis-fullscreen').forEach(function(card) {
                card.classList.remove('is-analysis-fullscreen');
            });
            document.body.classList.remove('analysis-fullscreen-open');
            updateAnalysisFullscreenButtons();
        }

        async function toggleAnalysisChartFullscreen(card) {
            if (document.fullscreenElement === card) {
                await document.exitFullscreen();
                return;
            }
            if (card.classList.contains('is-analysis-fullscreen')) {
                closeAnalysisPseudoFullscreen();
                resizeAnalysisCharts();
                return;
            }

            if (typeof card.requestFullscreen === 'function') {
                try {
                    await card.requestFullscreen();
                    return;
                } catch (error) {
                    console.warn('Browser-Vollbild nicht verfügbar, Fallback wird verwendet:', error);
                }
            }

            card.classList.add('is-analysis-fullscreen');
            document.body.classList.add('analysis-fullscreen-open');
            updateAnalysisFullscreenButtons();
            resizeAnalysisCharts();
        }

        document.addEventListener('fullscreenchange', function() {
            updateAnalysisFullscreenButtons();
            resizeAnalysisCharts();
        });

        document.addEventListener('click', function(event) {
            document.querySelectorAll('.analysis-athlete-select[open]').forEach(function(details) {
                if (!details.contains(event.target)) {
                    details.open = false;
                }
            });
        });

        document.addEventListener('keydown', function(event) {
            if (event.key !== 'Escape') {
                return;
            }
            document.querySelectorAll('.analysis-athlete-select[open]').forEach(function(details) {
                details.open = false;
            });
            closeAnalysisPseudoFullscreen();
            resizeAnalysisCharts();
        });

        function createAnalysisChartCard(titleText, subtitleText, isDisciplineChart = false) {
            const card = document.createElement('section');
            card.className = 'analysis-chart-card';

            const heading = document.createElement('div');
            heading.className = 'analysis-chart-heading';

            const headingText = document.createElement('div');
            const title = document.createElement('div');
            title.className = 'analysis-chart-title';
            title.textContent = titleText;
            headingText.appendChild(title);

            if (subtitleText) {
                const subtitle = document.createElement('div');
                subtitle.className = 'analysis-chart-subtitle';
                subtitle.textContent = subtitleText;
                headingText.appendChild(subtitle);
            }

            heading.appendChild(headingText);

            const actions = document.createElement('div');
            actions.className = 'analysis-chart-actions';

            const fullscreenButton = document.createElement('button');
            fullscreenButton.type = 'button';
            fullscreenButton.className = 'analysis-fullscreen-button';
            fullscreenButton.title = 'Vollbild anzeigen';
            fullscreenButton.setAttribute('aria-label', 'Diagramm im Vollbild anzeigen');
            fullscreenButton.onclick = function() {
                toggleAnalysisChartFullscreen(card);
            };
            actions.appendChild(fullscreenButton);
            heading.appendChild(actions);
            card.appendChild(heading);

            const frame = document.createElement('div');
            frame.className = `analysis-chart-frame${isDisciplineChart ? ' is-discipline-chart' : ''}`;
            card.appendChild(frame);
            return card;
        }

        function createAnalysisTabs(items, activeKey, onChange, onBack) {
            const navigation = document.createElement('div');
            navigation.className = 'analysis-navigation';
            const backButton = document.createElement('button');
            backButton.type = 'button';
            backButton.className = 'analysis-back-button';
            backButton.textContent = '‹';
            backButton.title = 'Zurück';
            backButton.setAttribute('aria-label', 'Zurück zur Datenansicht');
            backButton.onclick = onBack;
            navigation.appendChild(backButton);

            const tabs = document.createElement('div');
            tabs.className = 'analysis-tabs';
            tabs.setAttribute('role', 'tablist');

            items.forEach(function(item) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `analysis-tab${item.key === activeKey ? ' is-active' : ''}`;
                button.textContent = item.label;
                button.dataset.analysisTab = item.key;
                button.setAttribute('role', 'tab');
                button.setAttribute('aria-selected', item.key === activeKey ? 'true' : 'false');
                button.onclick = function() {
                    tabs.querySelectorAll('.analysis-tab').forEach(function(tab) {
                        const isActive = tab.dataset.analysisTab === item.key;
                        tab.classList.toggle('is-active', isActive);
                        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    });
                    onChange(item.key);
                };
                tabs.appendChild(button);
            });

            navigation.appendChild(tabs);
            return navigation;
        }

        function appendAnalysisSummaryCard(container, options) {
            const card = document.createElement('div');
            card.className = `analysis-summary-card${options.center ? ' is-center' : ''}${options.right ? ' is-right' : ''}`;

            const name = document.createElement('div');
            name.className = 'analysis-summary-name';
            name.textContent = options.name;

            const value = document.createElement('div');
            value.className = options.center ? 'analysis-lead-value' : 'analysis-summary-points';
            value.textContent = options.value;

            if (options.center) {
                card.appendChild(value);
                card.appendChild(name);
            } else {
                card.appendChild(name);
                card.appendChild(value);
            }

            if (options.meta) {
                const meta = document.createElement('div');
                meta.className = 'analysis-summary-meta';
                meta.textContent = options.meta;
                card.appendChild(meta);
            }
            container.appendChild(card);
        }

        function prepareAnalysisView(titleText, isRanking) {
            hideWorldAthleticsPerformanceSuggestions();
            closeNav();
            setContentViewActive(true);
            setRankingViewActive(isRanking);
            document.getElementById('main').classList.add('is-content-view');
            document.querySelector('.center').textContent = titleText;

            const labelsContainer = document.querySelector('.labels-container');
            labelsContainer.innerHTML = '';
            labelsContainer.style.display = 'block';
            labelsContainer.style.alignItems = 'stretch';
            labelsContainer.classList.toggle('is-ranking-layout', isRanking);
            labelsContainer.classList.remove('is-document-layout');
            labelsContainer.classList.add('is-analysis-layout');
            document.getElementById('home-intro').style.display = 'none';
            document.getElementById('home-top-title').style.display = 'none';
            document.getElementById('top-icons').style.display = 'flex';
            return labelsContainer;
        }

        function openComparisonAnalysis(profileName) {
            const profile = profiles.find(function(entry) {
                return entry.type === 'comparison' && entry.name === profileName;
            });
            if (!profile) {
                return;
            }

            saveCurrentViewScrollPosition();
            currentViewKey = `analysis:comparison:${profileName}`;
            setActiveSidebarItem('profile', profileName);
            displayComparisonAnalysis(profile);
            restoreViewScrollPosition(currentViewKey);
        }

        function openRankingAnalysis(rankingName) {
            const ranking = getRankingByName(rankingName);
            if (!ranking || getSortedRankingEntries(ranking).length < 2) {
                return;
            }

            saveCurrentViewScrollPosition();
            currentViewKey = `analysis:ranking:${rankingName}`;
            setActiveSidebarItem('ranking', rankingName);
            displayRankingAnalysis(ranking);
            restoreViewScrollPosition(currentViewKey);
        }

        function displayComparisonAnalysis(profile) {
            ensureProfileShape(profile);
            destroyAnalysisCharts();
            const labelsContainer = prepareAnalysisView(profile.name, false);
            const view = document.createElement('div');
            view.className = 'analysis-view';
            labelsContainer.appendChild(view);

            const athletes = getComparisonAthletes(profile.name);
            const athlete1 = athletes[0];
            const athlete2 = athletes[1];
            const values1 = profile.values.slice(0, 10);
            const values2 = profile.values.slice(10, 20);
            const results1 = profile.results.slice(0, 10);
            const results2 = profile.results.slice(10, 20);
            const total1 = getTotalPointsFromResults(results1);
            const total2 = getTotalPointsFromResults(results2);
            let wins1 = 0;
            let wins2 = 0;

            for (let index = 0; index < 10; index++) {
                const points1 = getAnalysisPoint(results1[index], values1[index]);
                const points2 = getAnalysisPoint(results2[index], values2[index]);
                if (points1 === null && points2 === null) {
                    continue;
                }
                if ((points1 || 0) > (points2 || 0)) {
                    wins1 += 1;
                } else if ((points2 || 0) > (points1 || 0)) {
                    wins2 += 1;
                }
            }

            const summary = document.createElement('div');
            summary.className = 'analysis-summary-grid';
            appendAnalysisSummaryCard(summary, {
                name: athlete1,
                value: `${total1} P`,
                meta: `${wins1} Disziplin${wins1 === 1 ? '' : 'en'} gewonnen`
            });

            const pointDifference = Math.abs(total1 - total2);
            const leaderName = total1 === total2 ? '' : (total1 > total2 ? athlete1 : athlete2);
            appendAnalysisSummaryCard(summary, {
                name: total1 === total2 ? 'Gleichstand' : leaderName,
                value: total1 === total2 ? '0 P' : `+${pointDifference} P`,
                meta: '',
                center: true
            });

            appendAnalysisSummaryCard(summary, {
                name: athlete2,
                value: `${total2} P`,
                meta: `${wins2} Disziplin${wins2 === 1 ? '' : 'en'} gewonnen`,
                right: true
            });
            const chartHost = document.createElement('div');
            let activeTab = 'progress';
            const tabs = createAnalysisTabs([
                { key: 'progress', label: 'Verlauf' },
                { key: 'disciplines', label: 'Disziplinen' }
            ], activeTab, function(nextTab) {
                activeTab = nextTab;
                renderComparisonAnalysisChart();
            }, function() {
                handleProfileButtonClick(profile.name);
            });
            view.appendChild(tabs);
            view.appendChild(summary);
            view.appendChild(chartHost);

            const profileCaption = document.createElement('div');
            profileCaption.className = 'analysis-profile-caption';
            profileCaption.textContent = profile.name;
            view.appendChild(profileCaption);

            function renderComparisonAnalysisChart() {
                destroyAnalysisCharts();
                chartHost.innerHTML = '';
                const visibleDisciplineCount = getVisibleAnalysisDisciplineCount([
                    { values: values1, results: results1 },
                    { values: values2, results: results2 }
                ]);

                if (activeTab === 'disciplines') {
                    const card = createAnalysisChartCard(
                        'Disziplinpunkte im Vergleich',
                        '',
                        true
                    );
                    chartHost.appendChild(card);
                    const points1 = results1.slice(0, visibleDisciplineCount).map(function(result, index) {
                        return getAnalysisPoint(result, values1[index]);
                    });
                    const points2 = results2.slice(0, visibleDisciplineCount).map(function(result, index) {
                        return getAnalysisPoint(result, values2[index]);
                    });
                    const defaults = getAnalysisChartDefaults();
                    defaults.interaction = { mode: 'index', intersect: false };
                    defaults.plugins.tooltip.callbacks = {
                        label: function(context) {
                            const index = context.dataIndex;
                            const performance = context.dataset.performances[index] || '—';
                            return `${context.dataset.label}: ${performance} · ${context.parsed.y || 0} P`;
                        }
                    };
                    defaults.scales = {
                        x: Object.assign(getAnalysisScaleDefaults(), { grid: { display: false } }),
                        y: Object.assign(getAnalysisScaleDefaults(), {
                            beginAtZero: true,
                            suggestedMax: 1200,
                            title: { display: true, text: 'Disziplinpunkte', color: '#aeb8c0' }
                        })
                    };

                    createAnalysisChart(card, {
                        type: 'bar',
                        data: {
                            labels: Array.from({ length: visibleDisciplineCount }, function(_, index) { return getInputName(index + 1); }),
                            datasets: [
                                {
                                    label: athlete1,
                                    data: points1,
                                    performances: values1.slice(0, visibleDisciplineCount),
                                    backgroundColor: analysisColorWithAlpha(ANALYSIS_COLORS[0], 0.78),
                                    borderColor: ANALYSIS_COLORS[0],

                    }

                    name.textContent = entry.name;
                    legendItem.appendChild(name);

                const summaryChevron = document.createElement('span');
                summaryChevron.className = 'analysis-athlete-select-chevron';
                summaryChevron.textContent = '▼';
                summary.appendChild(summaryChevron);
                selector.appendChild(summary);

                const panel = document.createElement('div');
                panel.className = 'analysis-athlete-select-panel';
                selector.appendChild(panel);

                function renderSelectorPanel() {
                    panel.innerHTML = '';
                    const draftNames = new Set(selectedNames);

                    const allRow = document.createElement('label');
                    allRow.className = 'analysis-athlete-select-row is-all';
                    const allCheckbox = document.createElement('input');
                    allCheckbox.type = 'checkbox';
                    allRow.appendChild(allCheckbox);
                    const allLabel = document.createElement('span');
                    allLabel.textContent = 'Alle auswählen';
                    allRow.appendChild(allLabel);
                    panel.appendChild(allRow);

                    const list = document.createElement('div');
                    list.className = 'analysis-athlete-select-list';
                    panel.appendChild(list);

                    const athleteCheckboxes = [];
                    entries.forEach(function(entry, entryIndex) {
                        const row = document.createElement('label');
                        row.className = 'analysis-athlete-select-row';
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.checked = draftNames.has(entry.name);
                        row.appendChild(checkbox);

                        const line = document.createElement('span');
                        line.className = 'analysis-inline-legend-line';
                        line.style.setProperty('--legend-color', getEntryColor(entry.name));
                        if (getAnalysisLineDash(entryIndex).length > 0) {
                            line.style.borderTopStyle = 'dashed';
                        }
                        row.appendChild(line);

                        const label = document.createElement('span');
                        label.textContent = entry.name;
                        row.appendChild(label);
                        list.appendChild(row);
                        athleteCheckboxes.push({ checkbox: checkbox, name: entry.name });

                        checkbox.onchange = function() {
                            if (checkbox.checked) {
                                draftNames.add(entry.name);
                            } else {
                                draftNames.delete(entry.name);
                            }
                            updateSelectorControls();
                        };
                    });

                    const applyButton = document.createElement('button');
                    applyButton.type = 'button';
                    applyButton.className = 'analysis-athlete-select-apply';
                    panel.appendChild(applyButton);

                    function updateSelectorControls() {
                        allCheckbox.checked = draftNames.size === entries.length;
                        allCheckbox.indeterminate = draftNames.size > 0 && draftNames.size < entries.length;
                        applyButton.disabled = draftNames.size === 0;
                        applyButton.textContent = draftNames.size > 0
                            ? `${draftNames.size} auswählen`
                            : 'Mindestens einen auswählen';
                    }

                    allCheckbox.onchange = function() {
                        draftNames.clear();
                        if (allCheckbox.checked) {
                            entries.forEach(function(entry) { draftNames.add(entry.name); });
                        }
                        athleteCheckboxes.forEach(function(item) {
                            item.checkbox.checked = draftNames.has(item.name);
                        });
                        updateSelectorControls();
                    };

                    applyButton.onclick = function() {
                        if (draftNames.size === 0) {
                            return;
                        }
                        selectedNames.clear();
                        draftNames.forEach(function(name) { selectedNames.add(name); });
                        selector.open = false;
                        renderRankingAnalysisChart();
                    };

                    updateSelectorControls();

                selector.addEventListener('toggle', function() {
                    if (selector.open) {
                        renderSelectorPanel();

            function renderRankingAnalysisChart() {
                destroyAnalysisCharts();
