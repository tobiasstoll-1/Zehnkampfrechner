<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Zehnkampfrechner</title>

    <!-- Verweise auf die Manifest-Datei -->
    <link rel="manifest" href="manifest.json">

    <!-- Theme color für die mobile Ansicht -->
    <meta name="theme-color" content="#262626">

    <!-- Icons -->
    <link rel="icon" href="imgs/appIcon.png" sizes="192x192">
    <link rel="icon" href="imgs/appIcon.png" sizes="512x512">

    <style>
        :root {
            --accent: #8fd0a3;
            --accent-strong: #63a97b;
            --performance-input-width: clamp(110px, 32vw, 128px);
            --focus-ring: 0 0 0 3px rgba(143, 208, 163, 0.18);
            --motion-standard: 220ms cubic-bezier(0.22, 1, 0.36, 1);
            --motion-entrance: 320ms cubic-bezier(0.16, 1, 0.3, 1);
            --page-bg-color: #262626;
            --page-bg-image: radial-gradient(circle at top, rgba(108, 151, 122, 0.18), transparent 34%), linear-gradient(180deg, #1f2328 0%, #262626 42%, #222629 100%);
            --sticky-title-height: 44px;
            --surface-soft: rgba(255, 255, 255, 0.06);
            --surface-mid: rgba(255, 255, 255, 0.1);
            --surface-strong: rgba(255, 255, 255, 0.16);
            --border-soft: rgba(255, 255, 255, 0.08);
            --border-mid: rgba(255, 255, 255, 0.18);
            --text-main: #f4f6f8;
            --text-soft: rgba(232, 237, 241, 0.72);
            --text-muted: rgba(220, 226, 233, 0.48);
            --shadow-soft: 0 16px 30px rgba(0, 0, 0, 0.16);
            --shadow-mid: 0 20px 42px rgba(0, 0, 0, 0.22);
            --radius-card: 22px;
            --app-topbar-height: 0px;
            --view-header-height: 0px;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .background-dark {
            background-color: var(--page-bg-color);
            background-image: var(--page-bg-image);
            background-repeat: no-repeat;
            background-size: 100vw 100vh;
            background-position: center top;
            background-attachment: fixed;
            height: 100dvh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }

        .center{
            display: none;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
            text-align: center;
            letter-spacing: 0.01em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .home-top-title {
            display: none;
            flex: 1 1 auto;
            min-width: 0;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 10px 4px 12px 16px;
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid var(--border-soft);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0.02) 100%);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }

        .app-topbar.is-content-view {
            padding-right: 0;
        }

        #stickyTitleBackdrop {
            display: none;
            position: sticky;
            top: 0;
            height: var(--sticky-title-height);
            margin-bottom: calc(var(--sticky-title-height) * -1);
            z-index: 15;
            pointer-events: none;
            background-color: var(--page-bg-color);
            background-image: var(--page-bg-image);
            background-repeat: no-repeat;
            background-size: 100vw 100vh;
            background-position: center top;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        body.content-view-active #stickyTitleBackdrop {
            display: block;
        }

        body.content-view-active:has(.em-preview-view) #stickyTitleBackdrop {
            display: none;
        }

        body.content-view-active:not(.ranking-view-active):has(.analysis-view) #stickyTitleBackdrop {
            display: none;
        }

        html.content-view-active,
        body.content-view-active {
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        html.content-view-active.sidebar-open,
        body.content-view-active.sidebar-open {
            height: 100dvh;
            overflow: hidden;
        }

        body.content-view-active .content-scroll-area {
            overflow-y: auto;
            overflow-x: hidden;
            padding-top: 0;
            padding-bottom: max(128px, calc(env(safe-area-inset-bottom) + 96px));
            scroll-padding-bottom: max(128px, calc(env(safe-area-inset-bottom) + 96px));
        }

        .app-topbar-menu {
            flex: 0 0 auto;
        }

        .app-topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex: 0 0 auto;
            margin-left: auto;
            padding-right: 0;
            margin-right: 0;
        }

        .home-intro {
            width: calc(100% - 32px);
            max-width: 720px;
            margin: 22px auto 0 auto;
            padding: 0;
            box-sizing: border-box;
        }

        .content-scroll-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            padding-bottom: max(96px, calc(env(safe-area-inset-bottom) + 72px));
            scroll-padding-bottom: max(96px, calc(env(safe-area-inset-bottom) + 72px));
            box-sizing: border-box;
        }

        body.mobile-input-active .content-scroll-area {
            overscroll-behavior-y: auto;
            touch-action: pan-y;
            padding-bottom: max(
                128px,
                calc(env(safe-area-inset-bottom) + 96px + var(--mobile-keyboard-inset, 0px))
            );
            scroll-padding-bottom: max(
                128px,
                calc(env(safe-area-inset-bottom) + 96px + var(--mobile-keyboard-inset, 0px))
            );
        }

        body.sidebar-open .content-scroll-area {
            overflow: hidden;
        }

        html.sidebar-open,
        body.sidebar-open {
            overscroll-behavior: contain;
        }

        html.ranking-view-active,
        body.ranking-view-active {
            height: auto;
            overflow-y: auto;
        }

        html.ranking-view-active.sidebar-open,
        body.ranking-view-active.sidebar-open {
            height: 100dvh;
            overflow: hidden;
        }

        html.ranking-view-active body {
            min-height: 100vh;
        }

        body.ranking-view-active .app-topbar {
            position: relative;
            top: auto;
        }

        body.ranking-view-active #stickyTitleBackdrop {
            display: none;
        }

        body.ranking-view-active .content-scroll-area {
            overflow: visible;
            padding-bottom: 0;
        }

        .icon-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 0;
        }

        .home-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
            aspect-ratio: 1 / 1;
            min-height: 0;
            padding: 16px 14px 18px 14px;
            box-sizing: border-box;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-card);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.045) 100%);
            box-shadow: var(--shadow-soft);
            color: white;
            text-align: center;
            cursor: pointer;
            transition: transform var(--motion-standard), border-color var(--motion-standard), background-color var(--motion-standard), box-shadow var(--motion-standard), filter var(--motion-standard);
        }

        .home-action:hover {
            transform: translateY(-3px);
            border-color: rgba(143, 208, 163, 0.3);
            background: linear-gradient(180deg, rgba(143, 208, 163, 0.12) 0%, rgba(255, 255, 255, 0.065) 100%);
            box-shadow: var(--shadow-mid);
        }

        .home-action-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .home-action-icon img {
            display: block;
            width: min(100%, 28vh);
            height: min(100%, 28vh);
            max-width: 100%;
            max-height: 82%;
            object-fit: contain;
        }

        .home-action-comparison .home-action-icon img {
            width: min(100%, 31vh);
            height: auto;
            max-height: min(72%, 18vh);
        }

        .home-action-title {
            font-family: 'Roboto', sans-serif;
            font-size: 24px;
            font-weight: bold;
            min-height: 28px;
            letter-spacing: 0.01em;
            margin-top: auto;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .home-action-placeholder {
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.14);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
            cursor: default;
            box-shadow: none;
        }

        .home-action-placeholder:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.12);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
        }

        .home-action-placeholder .home-action-icon {
            color: rgba(255, 255, 255, 0.42);
            font-size: 52px;
            font-weight: bold;
        }

        .home-action-faustregeln .home-action-icon img {
            width: min(100%, 26vh);
            height: min(100%, 26vh);
            max-height: 78%;
            object-fit: contain;
        }

        .home-action.home-action-em-preview {
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        .home-action-em-preview::after {
            content: '';
            position: absolute;
            z-index: 1;
            right: 0;
            bottom: 0;
            left: 0;
            height: 48%;
            background: linear-gradient(180deg, transparent 0%, rgba(5, 9, 42, 0.88) 100%);
            pointer-events: none;
        }

        .home-action-em-preview .home-action-icon {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: inherit;
        }

        .home-action-em-preview .home-action-icon img {
            width: 100%;
            height: 100%;
            max-height: 100%;
            border-radius: 0;
            object-fit: cover;
            object-position: center;
        }

        .home-action-em-preview .home-action-title {
            position: relative;
            z-index: 2;
            box-sizing: border-box;
            margin-top: auto;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.72);
        }

        .install-hint {
            display: none;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
            padding: 14px 14px 12px 14px;
            border: 1px solid rgba(143, 208, 163, 0.18);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(143, 208, 163, 0.1) 0%, rgba(255, 255, 255, 0.04) 100%);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
        }

        .install-hint.is-visible {
            display: flex;
        }

        .install-hint-copy {
            min-width: 0;
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
        }

        .install-hint-title {
            font-size: 15px;
            font-weight: bold;
            line-height: 1.25;
        }

        .install-hint-text {
            margin-top: 4px;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.4;
        }

        .install-hint-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .install-hint-button,
        .install-hint-dismiss {
            border: none;
            border-radius: 12px;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
        }

        .install-hint-button {
            min-height: 36px;
            padding: 8px 12px;
            background: rgba(38, 38, 38, 0.92);
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .install-hint-dismiss {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 18px;
            line-height: 1;
        }

        .install-hint-button:hover,
        .install-hint-dismiss:hover {
            transform: translateY(-1px);
        }


        .labels-container {
            display: none;
            flex-direction: column;
            align-items: stretch;
            margin-top: 30px;
            width: calc(100% - 32px);
            max-width: 920px;
            margin-left: auto;
            margin-right: auto;
            animation: view-fade-in 0.24s ease;
        }

        body.content-view-active .labels-container {
            margin-top: 0;
        }

        .labels-container.is-ranking-layout {
            width: calc(100% - 12px);
            max-width: none;
            padding-bottom: max(110px, env(safe-area-inset-bottom));
        }

        .labels-container.is-document-layout {
            width: calc(100% - 32px);
            max-width: 1080px;
        }

        .labels-container.is-analysis-layout,
        .labels-container.is-ranking-layout.is-analysis-layout {
            width: calc(100% - 32px);
            max-width: 1180px;
        }

        .document-view-panel {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 18px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-card);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.045) 100%);
            box-shadow: var(--shadow-soft);
        }

        .document-view-image-scroll {
            width: 100%;
            max-height: 72vh;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid var(--border-mid);
            border-radius: 18px;
            background: rgba(15, 18, 21, 0.72);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            -webkit-overflow-scrolling: touch;
        }

        .document-view-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .em-preview-view {
            --em-paper: #edf0f2;
            --em-paper-soft: #e3e8eb;
            --em-ink: #172027;
            --em-ink-soft: #55616a;
            --em-line: rgba(23, 32, 39, 0.12);
            margin-top: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 26px;
            background: var(--em-paper);
            color: var(--em-ink);
            box-shadow: 0 26px 60px rgba(0, 0, 0, 0.3);
            font-family: 'Roboto', sans-serif;
        }

        .em-preview-book-toolbar {
            position: relative;
            z-index: 16;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 7px;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: #1d2529;
        }

        .em-preview-book-nav {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
        }

        .em-preview-home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            width: 44px;
            height: 44px;
            padding: 0 0 3px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            transition: background-color var(--motion-standard), transform var(--motion-standard);
        }

        .em-preview-home-button:hover,
        .em-preview-home-button:focus-visible {
            background: rgba(255, 255, 255, 0.14);
            transform: translateX(-1px);
            outline: none;
        }

        .em-preview-book-tab {
            min-height: 44px;
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.045);
            color: rgba(255, 255, 255, 0.64);
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.025em;
            cursor: pointer;
            transition: color var(--motion-standard), background-color var(--motion-standard), border-color var(--motion-standard);
        }

        .em-preview-book-tab:hover {
            color: white;
            border-color: rgba(143, 208, 163, 0.28);
        }

        .em-preview-book-tab.is-active {
            border-color: rgba(143, 208, 163, 0.34);
            background: rgba(143, 208, 163, 0.14);
            color: #f7faf8;
        }

        .em-preview-book-page[hidden] {
            display: none;
        }

        .em-preview-page-turn {
            display: flex;
            justify-content: flex-end;
            padding: 0 clamp(20px, 5vw, 58px) clamp(28px, 5vw, 48px);
            background: var(--em-paper);
        }

        .em-preview-page-turn-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 44px;
            padding: 10px 17px;
            border: 1px solid rgba(49, 95, 69, 0.24);
            border-radius: 13px;
            background: #315f45;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform var(--motion-standard), background-color var(--motion-standard), box-shadow var(--motion-standard);
        }

        .em-preview-page-turn-button:hover {
            transform: translateY(-1px);
            background: #274f39;
            box-shadow: 0 9px 20px rgba(39, 79, 57, 0.2);
        }

        .em-preview-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            padding: clamp(30px, 6vw, 72px);
            background:
                linear-gradient(112deg, rgba(13, 21, 25, 0.96) 0%, rgba(25, 39, 37, 0.93) 58%, rgba(47, 88, 63, 0.84) 100%),
                radial-gradient(circle at 82% 22%, rgba(228, 186, 88, 0.34), transparent 30%);
            color: #f7f8f6;
        }

        .em-preview-hero::before {
            content: '10';
            position: absolute;
            z-index: -1;
            right: clamp(-24px, -1vw, 12px);
            bottom: clamp(-58px, -5vw, -18px);
            color: rgba(255, 255, 255, 0.055);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(190px, 30vw, 390px);
            font-weight: bold;
            line-height: 0.72;
        }

        .em-preview-kicker {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: #e8c976;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .em-preview-kicker::before {
            content: '';
            width: 34px;
            height: 2px;
            background: currentColor;
        }

        .em-preview-title {
            max-width: 780px;
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(38px, 7vw, 78px);
            font-weight: 700;
            letter-spacing: -0.045em;
            line-height: 0.98;
        }

        .em-preview-lede {
            max-width: 720px;
            margin: 24px 0 0 0;
            color: rgba(247, 248, 246, 0.78);
            font-size: clamp(17px, 2.4vw, 21px);
            line-height: 1.58;
        }

        .em-preview-facts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 30px;
        }

        .em-preview-fact {
            display: inline-flex;
            align-items: baseline;
            gap: 7px;
            padding: 9px 13px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
        }

        .em-preview-fact strong {
            color: white;
            font-size: 16px;
        }

        .em-preview-analysis {
            padding: clamp(28px, 5vw, 58px);
            background:
                linear-gradient(135deg, rgba(46, 96, 67, 0.06), transparent 42%),
                var(--em-paper);
        }

        .em-preview-section-heading {
            max-width: 760px;
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(28px, 4vw, 42px);
            letter-spacing: -0.025em;
            line-height: 1.08;
        }

        .em-preview-section-intro {
            max-width: 760px;
            margin: 14px 0 0 0;
            color: var(--em-ink-soft);
            font-size: 15px;
            line-height: 1.65;
        }

        .em-preview-analysis-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-top: 28px;
        }

        .em-preview-story {
            position: relative;
            min-width: 0;
            padding: 24px 22px 22px 22px;
            border: 1px solid var(--em-line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.66);
            box-shadow: 0 10px 24px rgba(27, 36, 41, 0.06);
        }

        .em-preview-story::before {
            content: '';
            position: absolute;
            top: 0;
            left: 22px;
            width: 42px;
            height: 4px;
            border-radius: 0 0 4px 4px;
            background: var(--accent-strong);
        }

        .em-preview-story:nth-child(2)::before {
            background: #d2a948;
        }

        .em-preview-story:nth-child(3)::before {
            background: #66859a;
        }

        .em-preview-story-label {
            margin: 0 0 11px 0;
            color: #37644a;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .em-preview-story h3 {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 23px;
            line-height: 1.13;
        }

        .em-preview-story p {
            margin: 14px 0 0 0;
            color: #43515a;
            font-size: 14px;
            line-height: 1.65;
        }

        .em-preview-table-section {
            padding: 0 clamp(16px, 4vw, 46px) clamp(28px, 5vw, 52px);
            background: var(--em-paper);
        }

        .em-preview-table-head {
            display: flex;
            align-items: flex-end;

            flex: 0 0 auto;

            height: 34px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);

            color: white;
            cursor: pointer;
            transition: background-color var(--motion-standard), border-color var(--motion-standard);

            content: "";

            width: 14px;
            height: 14px;
            background:

                linear-gradient(currentColor, currentColor) left top / 2px 6px no-repeat,
                linear-gradient(currentColor, currentColor) right top / 6px 2px no-repeat,
                linear-gradient(currentColor, currentColor) right top / 2px 6px no-repeat,
                linear-gradient(currentColor, currentColor) left bottom / 6px 2px no-repeat,
                linear-gradient(currentColor, currentColor) left bottom / 2px 6px no-repeat,
                linear-gradient(currentColor, currentColor) right bottom / 6px 2px no-repeat,
                linear-gradient(currentColor, currentColor) right bottom / 2px 6px no-repeat;
        }

        .analysis-fullscreen-button.is-active::before {
            width: 15px;
            height: 2px;
            background: currentColor;
            transform: rotate(45deg);
        }

        .analysis-fullscreen-button.is-active::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 2px;
            background: currentColor;
            transform: rotate(-45deg);

            font-size: 18px;

        function parseWorldAthleticsMark(code, mark) {
            if (!WORLD_ATHLETICS_DISCIPLINES[code] || mark == null) {
                return null;
            }

            const normalizedMark = String(mark)
                .trim()
                .replace(',', '.')
                .replace(/h$/i, '');
            if (!normalizedMark) {
                return null;
            }

            if (code !== '1500') {
                if (!/^\d+(?:\.\d+)?$/.test(normalizedMark)) {
                    return null;
                }
                const numericValue = Number(normalizedMark);
                return Number.isFinite(numericValue) && numericValue > 0 ? numericValue : null;
            }

            const timeParts = normalizedMark.split(':');
            if (timeParts.length < 1 || timeParts.length > 3
                || timeParts.some(function(part) { return !/^\d+(?:\.\d+)?$/.test(part); })) {
                return null;
            }

            const numericParts = timeParts.map(Number);
            let totalSeconds;
            if (numericParts.length === 1) {
                totalSeconds = numericParts[0];
            } else if (numericParts.length === 2 && numericParts[1] < 60) {
                totalSeconds = numericParts[0] * 60 + numericParts[1];
            } else if (numericParts.length === 3 && numericParts[1] < 60 && numericParts[2] < 60) {
                totalSeconds = numericParts[0] * 3600 + numericParts[1] * 60 + numericParts[2];
            } else {
                return null;
            }

            return Number.isFinite(totalSeconds) && totalSeconds > 0 ? totalSeconds : null;
        }

        function formatWorldAthleticsMark(code, parsedMark) {
            const numericValue = Number(parsedMark);
            if (!WORLD_ATHLETICS_DISCIPLINES[code] || !Number.isFinite(numericValue) || numericValue < 0) {
                return '';
            }

            if (code === '1500') {
                const totalHundredths = Math.round(numericValue * 100);
                const minutes = Math.floor(totalHundredths / 6000);
                const seconds = ((totalHundredths % 6000) / 100).toFixed(2).padStart(5, '0');
                return `${minutes}:${seconds}`;
            }

            return numericValue.toFixed(2);
        }

        function getWorldAthleticsPerformanceYear(dateValue) {

            return Number.isNaN(date.getTime()) ? null : date.getFullYear();
        }

        function buildWorldAthleticsBestMap(performances, includeYear, expectedYear = null) {
            const selectedByCode = {};
            if (!Array.isArray(performances)) {
                return {};
            }

            performances.forEach(function(performance) {
                if (!performance || performance.legal !== true) {
                    return;
                }

                const code = String(performance.disciplineCode || '');
                const discipline = WORLD_ATHLETICS_DISCIPLINES[code];
                const parsedMark = parseWorldAthleticsMark(code, performance.mark);
                if (!discipline || parsedMark == null) {
                    return;
                }

                const performanceYear = getWorldAthleticsPerformanceYear(performance.date);
                if (expectedYear && performanceYear !== expectedYear) {
                    return;
                }

                const selectedPerformance = selectedByCode[code];
                const isBetter = !selectedPerformance
                    || (discipline.isTime
                        ? parsedMark < selectedPerformance.parsedMark
                        : parsedMark > selectedPerformance.parsedMark);
                if (isBetter) {
                    selectedByCode[code] = {
                        parsedMark: parsedMark,
                        year: performanceYear
                    };
                }
            });

            const bestMap = {};
            Object.keys(selectedByCode).forEach(function(code) {
                const selectedPerformance = selectedByCode[code];
                const formattedValue = formatWorldAthleticsMark(code, selectedPerformance.parsedMark);
                if (!formattedValue) {
                    return;
                }

                bestMap[code] = { value: formattedValue };
                if (includeYear && selectedPerformance.year) {
                    bestMap[code].year = selectedPerformance.year;
                }
            });

            return bestMap;
        }

        function mergeWorldAthleticsBestMaps(primaryMap, fallbackMap) {
            const mergedMap = {};
            WORLD_ATHLETICS_CODE_BY_INDEX.forEach(function(code) {

                if (entry) {
                    mergedMap[code] = entry;
                }
            });
            return mergedMap;
        }

        async function fetchWorldAthleticsJson(path) {

            try {

                    method: 'GET',
                    headers: { Accept: 'application/json' },
                    cache: 'no-store',
                    signal: controller.signal
                });
                if (!response.ok) {
                    throw new Error(`World Athletics antwortet mit Status ${response.status}.`);
                }
                return await response.json();
            } finally {
                window.clearTimeout(timeoutId);
            }
        }

        function normalizeWorldAthleticsSearchText(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();

        function prioritizeWorldAthleticsSearchResults(athletes, searchTerm) {
            const normalizedSearchTerm = normalizeWorldAthleticsSearchText(searchTerm);
            return athletes.map(function(athlete, originalIndex) {
                const fullName = normalizeWorldAthleticsSearchText(
                    [athlete && athlete.firstname, athlete && athlete.lastname].filter(Boolean).join(' ')
                );
                const phraseRank = fullName.startsWith(normalizedSearchTerm)
                    ? 0
                    : (fullName.includes(normalizedSearchTerm) ? 1 : 2);
                const distance = Number(athlete && athlete.levenshteinDistance);
                return {
                    athlete: athlete,
                    phraseRank: phraseRank,
                    distance: Number.isFinite(distance) ? distance : Number.MAX_SAFE_INTEGER,
                    originalIndex: originalIndex
                };
            }).sort(function(left, right) {
                return left.phraseRank - right.phraseRank
                    || left.distance - right.distance
                    || left.originalIndex - right.originalIndex;
            }).map(function(entry) {
                return entry.athlete;
            });

            const request = fetchWorldAthleticsJson(`/athletes/search?name=${encodeURIComponent(normalizedSearchTerm)}`)
                .then(function(searchResult) {

                        : [];
                })
                .catch(function(error) {
                    worldAthleticsAthleteSearchCache.delete(cacheKey);
                    throw error;
                });
            worldAthleticsAthleteSearchCache.set(cacheKey, {
                expiresAt: Date.now() + WORLD_ATHLETICS_SEARCH_CACHE_MAX_AGE_MS,

        function loadWorldAthleticsDecathlonEligibilityStore() {
            try {
                const storedValue = JSON.parse(localStorage.getItem(WORLD_ATHLETICS_DECATHLON_CACHE_KEY) || '{}');
                if (!storedValue || typeof storedValue !== 'object' || Array.isArray(storedValue)) {
                    return {};

                const now = Date.now();
                return Object.keys(storedValue).reduce(function(validEntries, athleteId) {
                    const entry = storedValue[athleteId];
                    const checkedAt = Number(entry && entry.checkedAt);
                    if (typeof (entry && entry.eligible) === 'boolean'
                        && Number.isFinite(checkedAt)
                        && now - checkedAt < WORLD_ATHLETICS_DECATHLON_CACHE_MAX_AGE_MS) {
                        validEntries[athleteId] = {
                            eligible: entry.eligible,
                            checkedAt: checkedAt
                        };
                    }
                    return validEntries;
                }, {});

                console.warn('Zehnkampf-Suchcache konnte nicht gelesen werden:', error);

        function storeWorldAthleticsDecathlonEligibility(athleteId, eligible) {
            worldAthleticsDecathlonEligibilityStore[athleteId] = {
                eligible: !!eligible,
                checkedAt: Date.now()

            if (worldAthleticsDecathlonCacheSaveTimer) {
                window.clearTimeout(worldAthleticsDecathlonCacheSaveTimer);

            worldAthleticsDecathlonCacheSaveTimer = window.setTimeout(function() {
                worldAthleticsDecathlonCacheSaveTimer = null;

        function getWorldAthleticsDecathlonEligibility(athleteId) {
            const normalizedAthleteId = Number(athleteId);
            if (!Number.isInteger(normalizedAthleteId) || normalizedAthleteId <= 0) {
                return Promise.resolve(false);
            }

            if (worldAthleticsDecathlonEligibilityCache.has(normalizedAthleteId)) {
                return worldAthleticsDecathlonEligibilityCache.get(normalizedAthleteId);
            }

            const storedEligibility = worldAthleticsDecathlonEligibilityStore[normalizedAthleteId];
            if (storedEligibility) {
                const cachedResult = Promise.resolve(storedEligibility.eligible);
                worldAthleticsDecathlonEligibilityCache.set(normalizedAthleteId, cachedResult);
                return cachedResult;
            }

            const eligibilityRequest = fetchWorldAthleticsJson(`/athletes/${normalizedAthleteId}`)
                .then(hasWorldAthleticsDecathlonPerformance)
                .then(function(eligible) {

                .catch(function(error) {
                    worldAthleticsDecathlonEligibilityCache.delete(normalizedAthleteId);

            worldAthleticsDecathlonEligibilityCache.set(normalizedAthleteId, eligibilityRequest);

        async function searchWorldAthleticsDecathletes(searchTerm, limit = 5, onProgress = null) {
            const athletes = await searchWorldAthleticsAthletes(searchTerm);
            const resultLimit = Math.max(0, Number(limit) || 0);
            if (athletes.length === 0 || resultLimit === 0) {
                return [];
            }

            return new Promise(function(resolve) {
                const eligibilityByIndex = Array(athletes.length);
                const concurrency = Math.min(WORLD_ATHLETICS_SEARCH_CONCURRENCY, athletes.length);
                let nextIndex = 0;
                let activeChecks = 0;
                let isResolved = false;

                function getEligibleAthletes() {
                    return athletes.filter(function(athlete, index) {
                        return eligibilityByIndex[index] === true;
                    }).slice(0, resultLimit);
                }

                function hasFinalTopResults() {
                    let eligibleCount = 0;
                    for (let index = 0; index < eligibilityByIndex.length; index += 1) {
                        if (typeof eligibilityByIndex[index] !== 'boolean') {
                            return false;
                        }
                        if (eligibilityByIndex[index]) {
                            eligibleCount += 1;
                            if (eligibleCount >= resultLimit) {
                                return true;
                            }
                        }
                    }
                    return false;
                }

                function finish() {
                    if (isResolved) {
                        return;
                    }
                    isResolved = true;
                    resolve(getEligibleAthletes());
                }

                function publishProgress() {
                    if (typeof onProgress === 'function' && !isResolved) {
                        onProgress(getEligibleAthletes());
                    }
                }

                function scheduleChecks() {
                    if (isResolved) {
                        return;
                    }
                    if (hasFinalTopResults()) {
                        finish();
                        return;
                    }

                    while (activeChecks < concurrency && nextIndex < athletes.length) {
                        const athleteIndex = nextIndex;
                        const athlete = athletes[athleteIndex];
                        nextIndex += 1;
                        activeChecks += 1;

                        getWorldAthleticsDecathlonEligibility(athlete && athlete.id)
                            .then(function(eligible) {
                                eligibilityByIndex[athleteIndex] = !!eligible;
                            })
                            .catch(function(error) {
                                eligibilityByIndex[athleteIndex] = false;
                                console.error('Zehnkampfprofil konnte nicht geprüft werden:', error);
                            })
                            .finally(function() {
                                activeChecks -= 1;
                                if (isResolved) {
                                    return;
                                }
                                publishProgress();
                                if (hasFinalTopResults()
                                    || (nextIndex >= athletes.length && activeChecks === 0)) {
                                    finish();
                                    return;
                                }
                                scheduleChecks();
                            });
                    }
                }

                scheduleChecks();
            });
        }

        async function fetchWorldAthleticsData(athleteId) {
            const currentYear = new Date().getFullYear();
            const responses = await Promise.allSettled([
                fetchWorldAthleticsJson(`/athletes/${athleteId}`),
                fetchWorldAthleticsJson(`/athletes/${athleteId}/results?year=${currentYear}`)
            ]);
            if (responses[0].status !== 'fulfilled') {
                throw responses[0].reason;
            }

            const athlete = responses[0].value;
            const currentYearResults = responses[1].status === 'fulfilled' && Array.isArray(responses[1].value)
                ? responses[1].value
                : [];
            if (responses[1].status === 'rejected') {
                console.warn(`Jahresresultate für Athlet ${athleteId} konnten nicht als SB-Fallback geladen werden:`, responses[1].reason);
            }
            const identity = createWorldAthleticsIdentity(athlete);
            if (!identity || identity.athleteId !== Number(athleteId)) {
                throw new Error('Die empfangenen Athletendaten sind unvollständig.');
            }

            const personalBests = Array.isArray(athlete.personalbests)
                ? athlete.personalbests
                : athlete.personalBests;
            const officialSeasonBests = [
                athlete.seasonsbests,
                athlete.seasonBests,
                athlete.seasonsBests
            ].find(Array.isArray) || [];
            const officialSeasonBestMap = buildWorldAthleticsBestMap(
                officialSeasonBests,
                false,
                currentYear
            );
            const resultSeasonBestMap = buildWorldAthleticsBestMap(
                currentYearResults,
                false,
                currentYear
            );
            identity.lastSyncedAt = Date.now();
            identity.dataFormatVersion = WORLD_ATHLETICS_DATA_FORMAT_VERSION;
            identity.personalBests = buildWorldAthleticsBestMap(personalBests, true);
            identity.seasonBests = mergeWorldAthleticsBestMaps(
                officialSeasonBestMap,
                resultSeasonBestMap
            );
            return identity;
        }

            const normalizedLink = normalizeWorldAthleticsLink(link);
            return !normalizedLink
                || normalizedLink.dataFormatVersion !== WORLD_ATHLETICS_DATA_FORMAT_VERSION
                || normalizedLink.lastSyncedAt === 0
                || Date.now() - normalizedLink.lastSyncedAt >= WORLD_ATHLETICS_SYNC_INTERVAL_MS;

        async function syncAllWorldAthleticsProfiles(options = {}) {
            const force = options.force === true;
            const announce = options.announce === true;
            const requestedAthleteIds = Array.isArray(options.athleteIds)
                ? new Set(options.athleteIds.map(Number))
                : null;

            if (force) {
                worldAthleticsDecathlonListCache.forEach(function(value, athleteId) {
                    if (!requestedAthleteIds || requestedAthleteIds.has(Number(athleteId))) {
                        worldAthleticsDecathlonListCache.delete(athleteId);
                    }
                });
                worldAthleticsDecathlonValuesCache.forEach(function(value, key) {
                    const athleteId = Number(String(key).split(':')[0]);
                    if (!requestedAthleteIds || requestedAthleteIds.has(athleteId)) {
                        worldAthleticsDecathlonValuesCache.delete(key);
                    }
                });
            }

            if (worldAthleticsSyncPromise) {
                if (announce) {
                    showAppToast('Die Athletendaten werden bereits aktualisiert.');
                }
                return worldAthleticsSyncPromise;
            }

            if (typeof navigator !== 'undefined' && navigator.onLine === false) {
                if (announce) {
                    showAppToast('Keine Internetverbindung. Die gespeicherten Daten bleiben verfügbar.');
                }
                return null;
            }

            const linkedProfiles = getLinkedWorldAthleticsProfiles();
            const targetProfiles = linkedProfiles.filter(function(profile) {
                const link = normalizeWorldAthleticsLink(profile.worldAthletics);
                const idMatches = !requestedAthleteIds || requestedAthleteIds.has(link.athleteId);
                return idMatches && (force || isWorldAthleticsLinkStale(link));
            });
            const athleteIds = Array.from(new Set(targetProfiles.map(function(profile) {
                return Number(profile.worldAthletics.athleteId);
            })));

            if (athleteIds.length === 0) {
                if (announce) {
                    showAppToast(linkedProfiles.length === 0
                        ? 'Es sind noch keine Profile mit World Athletics verknüpft.'
                        : 'Die Athletendaten sind bereits aktuell.');
                }
                return null;
            }

            setWorldAthleticsSyncButtonState(true);
            if (announce) {
                showAppToast('Athletendaten werden aktualisiert ...', 1800);
            }

            worldAthleticsSyncPromise = (async function() {
                const results = await Promise.allSettled(athleteIds.map(function(athleteId) {
                    return fetchWorldAthleticsData(athleteId);
                }));
                let updatedAthletes = 0;
                let failedAthletes = 0;

                results.forEach(function(result, index) {
                    const athleteId = athleteIds[index];
                    if (result.status !== 'fulfilled') {
                        failedAthletes += 1;
                        console.error(`Athletendaten für ID ${athleteId} konnten nicht aktualisiert werden:`, result.reason);
                        return;
                    }

                    updatedAthletes += 1;
                    linkedProfiles.forEach(function(profile) {
                        const link = normalizeWorldAthleticsLink(profile.worldAthletics);
                        if (link && link.athleteId === athleteId) {
                            profile.worldAthletics = result.value;
                        }
                    });
                });

                if (updatedAthletes > 0) {
                    saveProfilesToLocalStorage();
                    hideWorldAthleticsPerformanceSuggestions();
                    refreshVisibleWorldAthleticsIndicator();
                }

                if (announce) {
                    if (updatedAthletes > 0 && failedAthletes === 0) {
                        showAppToast(updatedAthletes === 1
                            ? 'Athletendaten wurden aktualisiert.'
                            : `${updatedAthletes} Athletendatensätze wurden aktualisiert.`);
                    } else if (updatedAthletes > 0) {
                        showAppToast('Ein Teil der Athletendaten konnte nicht aktualisiert werden.');
                    } else {
                        showAppToast('Athletendaten konnten nicht aktualisiert werden.');
                    }
                }

                return { updatedAthletes: updatedAthletes, failedAthletes: failedAthletes };
            })();

            try {
                return await worldAthleticsSyncPromise;
            } finally {
                worldAthleticsSyncPromise = null;
                setWorldAthleticsSyncButtonState(false);
            }
        }

        function refreshStaleWorldAthleticsProfiles() {

        function getAppViewportBounds() {
            const visualViewport = window.visualViewport;
            const left = visualViewport ? visualViewport.offsetLeft : 0;
            const top = visualViewport ? visualViewport.offsetTop : 0;
            const width = visualViewport
                ? visualViewport.width
                : (window.innerWidth || document.documentElement.clientWidth);
            const height = visualViewport
                ? visualViewport.height
                : (window.innerHeight || document.documentElement.clientHeight);

            return {
                left: left,
                top: top,
                right: left + width,
                bottom: top + height,
                width: width,
                height: height
            };
        }

        function isProfilePerformanceInput(element) {
            return element instanceof HTMLElement
                && element.matches('.labels-container input.input, .labels-container input.inputcomparison');
        }

        function isMobileInputViewport() {
            return window.innerWidth <= 980
                || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        }

        function syncMobileInputViewport(input) {
            const activeInput = isProfilePerformanceInput(input)
                ? input
                : (isProfilePerformanceInput(document.activeElement) ? document.activeElement : null);
            const shouldManageViewport = Boolean(activeInput && isMobileInputViewport());

            document.body.classList.toggle('mobile-input-active', shouldManageViewport);
            if (!shouldManageViewport || !window.visualViewport) {
                document.documentElement.style.removeProperty('--mobile-keyboard-inset');
                return shouldManageViewport ? activeInput : null;
            }

            const visualViewport = window.visualViewport;
            const currentWidth = window.innerWidth || visualViewport.width;
            const layoutHeight = Math.max(
                window.innerHeight || 0,
                document.documentElement.clientHeight || 0,
                visualViewport.height + visualViewport.offsetTop
            );
            if (Math.abs(currentWidth - mobileViewportBaselineWidth) > 80) {
                mobileViewportBaselineWidth = currentWidth;
                mobileViewportBaselineHeight = layoutHeight;
            } else {
                mobileViewportBaselineHeight = Math.max(mobileViewportBaselineHeight, layoutHeight);
            }

            const rawInset = Math.max(0, mobileViewportBaselineHeight - visualViewport.height);
            const keyboardThreshold = Math.max(140, mobileViewportBaselineHeight * 0.18);
            const keyboardInset = rawInset >= keyboardThreshold
                ? Math.min(rawInset, mobileViewportBaselineHeight * 0.62)
                : 0;
            document.documentElement.style.setProperty(
                '--mobile-keyboard-inset',
                `${Math.round(keyboardInset)}px`
            );

            return activeInput;
        }

        function handleAppViewportChange() {
            if (appViewportAnimationFrame) {
                window.cancelAnimationFrame(appViewportAnimationFrame);
            }
            appViewportAnimationFrame = window.requestAnimationFrame(function() {
                appViewportAnimationFrame = null;
                syncMobileInputViewport();
                if (activeWorldAthleticsSuggestion
                    && activeWorldAthleticsSuggestion.popover
                    && activeWorldAthleticsSuggestion.input) {
                    positionWorldAthleticsPerformanceSuggestions(
                        activeWorldAthleticsSuggestion.popover,
                        activeWorldAthleticsSuggestion.input
                    );
                }
            });
        }

        function hideWorldAthleticsPerformanceSuggestions() {
            if (worldAthleticsSuggestionTimer) {
                window.clearTimeout(worldAthleticsSuggestionTimer);
                worldAthleticsSuggestionTimer = null;
            }
            if (activeWorldAthleticsSuggestion) {
                if (activeWorldAthleticsSuggestion.popover) {
                    activeWorldAthleticsSuggestion.popover.remove();
                }
                if (activeWorldAthleticsSuggestion.anchor) {
                    activeWorldAthleticsSuggestion.anchor.classList.remove('wa-suggestion-anchor');
                }
            }
            activeWorldAthleticsSuggestion = null;
        }

        function positionWorldAthleticsPerformanceSuggestions(popover, input) {
            if (!popover || !input || !document.body.contains(input) || !document.body.contains(popover)) {
                return;
            }

            const inputRect = input.getBoundingClientRect();
            const popoverRect = popover.getBoundingClientRect();
            const viewport = getAppViewportBounds();
            let left = inputRect.left + (inputRect.width - popoverRect.width) / 2;
            left = Math.max(
                viewport.left + 10,
                Math.min(left, viewport.right - popoverRect.width - 10)
            );

            const anchor = popover.parentElement;
            if (popover.classList.contains('is-input-anchored') && anchor) {
                const anchorRect = anchor.getBoundingClientRect();
                popover.style.left = `${Math.round(left - anchorRect.left)}px`;
                popover.style.top = `${Math.round(inputRect.bottom - anchorRect.top + 4)}px`;
            } else {
                popover.style.left = `${Math.round(left)}px`;
                popover.style.top = `${Math.round(inputRect.bottom + 4)}px`;
            }
            popover.style.visibility = 'visible';
        }

        function applyWorldAthleticsSuggestion(input, value) {
            input.value = value;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            hideWorldAthleticsPerformanceSuggestions();
            input.focus({ preventScroll: true });
        }

        function showWorldAthleticsPerformanceSuggestions(profile, disciplineIndex, input) {
            hideWorldAthleticsPerformanceSuggestions();
            const link = normalizeWorldAthleticsLink(profile && profile.worldAthletics);
            const code = WORLD_ATHLETICS_CODE_BY_INDEX[disciplineIndex];
            if (!link || !code || document.activeElement !== input) {
                return;
            }

            const seasonBest = link.seasonBests[code];
            const personalBest = link.personalBests[code];
            if (!seasonBest && !personalBest) {
                return;
            }

            const popover = document.createElement('div');
            popover.className = 'wa-performance-suggestions';
            popover.style.visibility = 'hidden';
            popover.setAttribute('role', 'group');
            popover.setAttribute('aria-label', 'Leistungsvorschläge');

            function appendSuggestion(label, entry) {
                if (!entry || !entry.value) {
                    return;
                }
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'wa-performance-suggestion';
                button.textContent = label === 'PB' && entry.year
                    ? `${label} ${entry.value} (${entry.year})`
                    : `${label} ${entry.value}`;
                button.addEventListener('mousedown', function(event) {
                    event.preventDefault();
                });
                button.onclick = function() {
                    applyWorldAthleticsSuggestion(input, entry.value);
                };
                popover.appendChild(button);
            }

            appendSuggestion('SB', seasonBest);
            appendSuggestion('PB', personalBest);
            if (!popover.childElementCount) {
                return;
            }
            if (popover.childElementCount === 1) {
                popover.classList.add('has-single-suggestion');
            }

            const anchor = input.closest('.comparison-performance') || input.parentElement;
            if (!anchor) {
                return;
            }
            anchor.classList.add('wa-suggestion-anchor');
            popover.classList.add('is-input-anchored');
            anchor.appendChild(popover);
            activeWorldAthleticsSuggestion = { popover: popover, input: input, anchor: anchor };
            positionWorldAthleticsPerformanceSuggestions(popover, input);
            window.requestAnimationFrame(function() {
                if (activeWorldAthleticsSuggestion
                    && activeWorldAthleticsSuggestion.popover === popover) {
                    positionWorldAthleticsPerformanceSuggestions(popover, input);
                }
            });
        }

        function attachWorldAthleticsSuggestions(profile, disciplineIndex, input) {
            if (!input || !normalizeWorldAthleticsLink(profile && profile.worldAthletics)) {
                return;
            }

            const scheduleSuggestions = function(delay) {
                if (worldAthleticsSuggestionTimer) {
                    window.clearTimeout(worldAthleticsSuggestionTimer);
                }
                worldAthleticsSuggestionTimer = window.setTimeout(function() {
                    worldAthleticsSuggestionTimer = null;
                    showWorldAthleticsPerformanceSuggestions(profile, disciplineIndex, input);
                }, delay);
            };

            input.addEventListener('focus', function() {
                scheduleSuggestions(230);
            });
            input.addEventListener('click', function() {
                scheduleSuggestions(0);
            });
            input.addEventListener('blur', function() {
                worldAthleticsSuggestionTimer = window.setTimeout(function() {
                    if (activeWorldAthleticsSuggestion && activeWorldAthleticsSuggestion.input === input) {
                        hideWorldAthleticsPerformanceSuggestions();
                    }
                    syncMobileInputViewport();
                }, 120);
            });
        }

        function recalculateSingleProfileFromValues(profile) {
            let totalPoints = 0;
            for (let index = 0; index < 10; index += 1) {
                const disciplineType = getDisciplineType(index + 1);
                const performance = parsePerformanceValue(profile.values[index], disciplineType);
                const abcValues = getABCValues(index + 1);
                const points = performance == null
                    ? 0
                    : calculateDecathlonPoints(disciplineType, performance, abcValues[0], abcValues[1], abcValues[2]);
                profile.results[index] = String(points);
                totalPoints += points;
            }
            profile.totalPoints = totalPoints;
        }

        function fillEmptyProfileValuesFromWorldAthletics(profile, bestType) {
            const link = normalizeWorldAthleticsLink(profile && profile.worldAthletics);
            if (!profile || profile.type !== 'single' || !link) {
                return 0;
            }

            const bestMap = bestType === 'personal' ? link.personalBests : link.seasonBests;
            let filledFields = 0;
            WORLD_ATHLETICS_CODE_BY_INDEX.forEach(function(code, index) {
                const entry = bestMap[code];
                if (entry && entry.value && !String(profile.values[index] || '').trim()) {
                    profile.values[index] = entry.value;
                    filledFields += 1;
                }
            });

            if (filledFields === 0) {
                showAppToast('Es gibt keine passenden leeren Felder.');
                return 0;
            }

            recalculateSingleProfileFromValues(profile);
            saveProfilesToLocalStorage();
            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            if (currentTitle === profile.name) {
                const contentScrollArea = getContentScrollArea();
                const scrollPosition = contentScrollArea ? contentScrollArea.scrollTop : 0;
                displayProfileResults(profile.name);
                if (contentScrollArea) {
                    requestAnimationFrame(function() {
                        contentScrollArea.scrollTop = scrollPosition;

                }
            }

            showAppToast(`${filledFields} ${filledFields === 1 ? 'Feld wurde' : 'Felder wurden'} mit ${bestType === 'personal' ? 'PB' : 'SB'} gefüllt.`);
            return filledFields;
        }

        function fillEmptyProfileValuesFromDecathlon(profile, decathlonValues) {
            if (!profile || profile.type !== 'single' || !Array.isArray(decathlonValues)) {
                return 0;
            }

            let filledFields = 0;
            decathlonValues.slice(0, 10).forEach(function(value, index) {
                if (value && !String(profile.values[index] || '').trim()) {
                    profile.values[index] = value;
                    filledFields += 1;
                }
            });

            if (filledFields === 0) {
                showAppToast('Es gibt keine passenden leeren Felder.');
                return 0;
            }

            recalculateSingleProfileFromValues(profile);
            saveProfilesToLocalStorage();
            const currentTitle = document.querySelector('.center')?.textContent?.trim();
            if (currentTitle === profile.name) {
                const contentScrollArea = getContentScrollArea();
                const scrollPosition = contentScrollArea ? contentScrollArea.scrollTop : 0;
                displayProfileResults(profile.name);
                if (contentScrollArea) {
                    requestAnimationFrame(function() {
                        contentScrollArea.scrollTop = scrollPosition;
                    });
                }
            }

            showAppToast(`${filledFields} ${filledFields === 1 ? 'Feld wurde' : 'Felder wurden'} mit Zehnkampfwerten gefüllt.`);
            return filledFields;

        // Profile speichern
        function saveProfilesToLocalStorage() {
            localStorage.setItem('profiles', JSON.stringify(profiles));
        }

        function saveArchiveFolderOrderToLocalStorage() {
            localStorage.setItem('archiveFolderOrder', JSON.stringify(archiveFolderOrder));
        }

        function loadArchiveFolderOrderFromLocalStorage() {
            archiveFolderOrder.splice(0, archiveFolderOrder.length);
            const savedOrder = localStorage.getItem('archiveFolderOrder');
            if (!savedOrder) {
                return;
            }

            try {
                JSON.parse(savedOrder).forEach(function(folderName) {
                    const normalizedFolderName = normalizeArchiveFolderName(folderName);
                    if (normalizedFolderName && !archiveFolderOrder.includes(normalizedFolderName)) {
                        archiveFolderOrder.push(normalizedFolderName);

                console.error('Archivordner-Reihenfolge konnte nicht geladen werden:', error);
                localStorage.removeItem('archiveFolderOrder');

        // Profile laden
        function loadProfilesFromLocalStorage() {
            profiles.splice(0, profiles.length);
            console.log('Profile:' ,profiles);
            const savedProfiles = localStorage.getItem('profiles');
            console.log('Saved Profiles:', savedProfiles);
            if (savedProfiles) {
                try {
                    JSON.parse(savedProfiles).forEach(profile => {
                        if (!profile || typeof profile.name !== 'string' || !profile.name.trim()) {
                            return;
                        }

                        ensureProfileShape(profile);

                        if (!profiles.some(p => p.name === profile.name)) {
                            profiles.push(profile);
                        }
                    });
                } catch (error) {
                    console.error('Profile konnten nicht aus dem localStorage geladen werden:', error);
                    localStorage.removeItem('profiles');
                }
            }
            console.log('Loaded profiles:', profiles);
        }

        function normalizePerformanceInput(inputValue) {
            return (inputValue || '').trim().replace(',', '.');
        }

        function parsePerformanceValue(inputValue, disciplineType) {
            const normalizedValue = normalizePerformanceInput(inputValue);

            if (!normalizedValue) {
                return null;
            }

            if (disciplineType === 4) {
                const timeMatch = normalizedValue.match(/^(\d+):([0-5]?\d(?:\.\d+)?)$/);
                if (!timeMatch) {
                    return null;
                }

                const minutes = parseInt(timeMatch[1], 10);
                const seconds = parseFloat(timeMatch[2]);
                const totalSeconds = minutes * 60 + seconds;

                return Number.isFinite(totalSeconds) ? totalSeconds : null;
            }

            const numericValue = parseFloat(normalizedValue);
            if (!Number.isFinite(numericValue) || numericValue < 0) {
                return null;
            }

            if (disciplineType === 2) {
                return numericValue * 100;
            }

            return numericValue;
        }

        function calculateDecathlonPoints(disciplineType, performance, A, B, C) {
            if (!Number.isFinite(performance)) {
                return 0;
            }

            let baseValue = 0;

            if (disciplineType === 1 || disciplineType === 4) {
                baseValue = B - performance;
            } else {
                baseValue = performance - B;
            }

            if (baseValue <= 0) {
                return 0;
            }

            const points = A * Math.pow(baseValue, C);
            if (!Number.isFinite(points) || points < 0) {
                return 0;
            }

            return Math.floor(points);
        }

        function getComparisonAthletes(profileName) {
            if (typeof profileName !== 'string') {
                return [];
            }

            return profileName.includes(' vs. ') ? profileName.split(' vs. ') : [];
        }

        function getResultIndexForInput(profileName, inputName, resultId) {
            const resultIndexBase = parseInt(resultId.replace('result', ''), 10) - 1;
            const comparisonAthletes = getComparisonAthletes(profileName);

            if (comparisonAthletes.length !== 2) {
                return resultIndexBase;
            }

            const athleteName = inputName.includes('_') ? inputName.substring(inputName.indexOf('_') + 1) : '';
            return athleteName === comparisonAthletes[1] ? resultIndexBase + 10 : resultIndexBase;
        }

        function ensureProfileShape(profile) {
            const expectedLength = profile.type === 'comparison' ? 20 : 10;

            if (!Array.isArray(profile.results)) {
                profile.results = [];
            }
            if (!Array.isArray(profile.values)) {
                profile.values = [];
            }

            while (profile.results.length < expectedLength) {
                profile.results.push('0');
            }
            while (profile.values.length < expectedLength) {
                profile.values.push('');
            }

            profile.results = profile.results.slice(0, expectedLength).map(result => result === '' ? '0' : String(result));
            profile.values = profile.values.slice(0, expectedLength).map(value => value == null ? '' : String(value));
            profile.archived = profile.archived === true;
            profile.archiveFolder = profile.archived ? normalizeArchiveFolderName(profile.archiveFolder) : '';

            if (profile.type === 'single') {
                const normalizedWorldAthleticsLink = normalizeWorldAthleticsLink(profile.worldAthletics);
                if (normalizedWorldAthleticsLink) {
                    profile.worldAthletics = normalizedWorldAthleticsLink;
                } else {
                    delete profile.worldAthletics;
                }
            }

            if (profile.type === 'comparison') {
                const [athlete1, athlete2] = getComparisonAthletes(profile.name);
                if (!profile.totalPoints || typeof profile.totalPoints !== 'object') {
                    profile.totalPoints = {};
                }
                if (athlete1 && typeof profile.totalPoints[athlete1] !== 'number') {
                    profile.totalPoints[athlete1] = 0;
                }
                if (athlete2 && typeof profile.totalPoints[athlete2] !== 'number') {
                    profile.totalPoints[athlete2] = 0;
                }
            } else if (typeof profile.totalPoints !== 'number') {
                profile.totalPoints = 0;
            }
        }

        function sanitizeProfileName(profileName) {
            if (typeof profileName !== 'string') {
                return '';
            }

            return profileName.trim().replace(/\s+/g, ' ');
        }

        function normalizeArchiveFolderName(folderName) {
            const sanitizedFolderName = sanitizeProfileName(folderName);
            return sanitizedFolderName.replace(/[\\/]+/g, '-');
        }

        function getArchiveFolderLabel(folderName) {
            return normalizeArchiveFolderName(folderName) || 'Ohne Ordner';
        }

        function isActiveSingleProfile(profile) {
            return profile && profile.type === 'single' && profile.name !== defaultTitle && profile.archived !== true;
        }

        function isArchivedSingleProfile(profile) {
            return profile && profile.type === 'single' && profile.name !== defaultTitle && profile.archived === true;
        }

        function getActiveSingleProfiles() {
            return profiles.filter(isActiveSingleProfile);
        }

        function getArchivedSingleProfiles() {
            return profiles.filter(isArchivedSingleProfile);
        }

        function getArchiveFolderProfiles(folderName) {

        function getArchiveFolderNames() {
            const folderNames = Array.from(new Set(
                getArchivedSingleProfiles()
                    .map(function(profile) {
                        return normalizeArchiveFolderName(profile.archiveFolder);
                    })
                    .filter(function(folderName) {
                        return folderName !== '';
                    })
            ));

            const orderedFolders = archiveFolderOrder.filter(function(folderName) {
                return folderNames.includes(folderName);
            });
            const unorderedFolders = folderNames
                .filter(function(folderName) {
                    return !orderedFolders.includes(folderName);
                })
                .sort(function(folderA, folderB) {
                    return folderA.localeCompare(folderB, 'de');
                });

            return orderedFolders.concat(unorderedFolders);
        }
